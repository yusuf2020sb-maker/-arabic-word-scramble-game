<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Marhey:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:clip; background:#c9a57a; font-family:'Marhey',sans-serif; color:#3b2a20; }
  .page { position:absolute; left:40px; top:60px; width:1000px; height:1800px; box-shadow:0 20px 40px rgba(0,0,0,.25); background:

      repeating-linear-gradient(180deg, transparent 0 58px, rgba(76,106,138,.22) 58px 60px), #f4ecdc; }
  .line { position:absolute; left:0; width:1080px; text-align:center; font-weight:700; line-height:1.3; white-space:nowrap; }
  .st { position:absolute; filter:drop-shadow(0 8px 6px rgba(0,0,0,.25)); }
  .tape { position:absolute; width:180px; height:56px; background:rgba(214,182,140,.85); background-image:repeating-linear-gradient(45deg, rgba(255,255,255,.18) 0 10px, transparent 10px 20px);

  .scrap { position:absolute; padding:10px 46px 30px; background:#fffaf0; font-weight:700; box-shadow:0 8px 14px rgba(0,0,0,.2);
    clip-path:polygon(0 4%, 6% 0, 14% 5%, 25% 1%, 37% 6%, 50% 0, 63% 5%, 75% 1%, 88% 6%, 100% 2%, 98% 50%, 100% 97%, 88% 100%, 75% 95%, 62% 100%, 50% 96%, 37% 100%, 25% 95%, 12% 100%, 0 96%, 2% 50%); }
</style></head><body>
