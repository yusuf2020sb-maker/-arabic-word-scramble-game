<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:clip; font-family:'Markazi Text',serif; color:#f1e6cf; }
  #stage { position:absolute; left:0; top:0; width:1080px; height:1920px; overflow:clip; background:radial-gradient(ellipse at 50% 45%, #2b241d, #0e0c0a 72%); }
  .line { position:absolute; left:0; width:1080px; text-align:center; font-weight:700; line-height:1.15; white-space:nowrap; }
  .st { position:absolute; filter:drop-shadow(0 20px 26px rgba(0,0,0,.6)); }
  .strip { position:absolute; left:-40px; top:1290px; width:1160px; height:300px; background:#151210; border-top:6px solid #2a2520; border-bottom:6px solid #2a2520; transform:rotate(-4deg); }
  .holes { position:absolute; left:0; width:100%; height:30px; background:repeating-linear-gradient(90deg, transparent 0 20px, #e8dcc4 20px 46px, transparent 46px 66px); opacity:.85; }
  .fr { position:absolute; top:45px; width:200px; height:210px; background:radial-gradient(circle, #3b3127, #1c1712); border-radius:6px; }
  .fr img { position:absolute; left:20px; top:15px; width:160px; height:180px; object-fit:contain; }
  .title { position:absolute; left:160px; top:1680px; width:760px; padding:14px 0 26px; text-align:center; background:#0b0a09; border:4px solid #f1e6cf; outline:2px solid #f1e6cf; outline-offset:8px; font-size:64px; }
  #half { position:absolute; left:0; top:0; width:540px; height:1920px; overflow:hidden; }
  #grain { position:absolute; left:0; top:0; mix-blend-mode:overlay; opacity:.5; }
  #vig { position:absolute; left:0; top:0; width:1080px; height:1920px; background:radial-gradient(ellipse at 50% 50%, transparent 45%, rgba(0,0,0,.75) 100%); }
</style></head><body><div id="stage">
<div class="line" style="top:170px; font-size:110px">من زمن الأبيض والأسود…</div>
<div class="line" style="top:330px; font-size:170px; color:#c9a45c">بس بالألوان!</div>
<img class="st" src="classic/v12.png" style="left:250px; top:600px; width:580px">
<div id="half"><img class="st" src="classic/v12.png" style="left:250px; top:600px; width:580px; filter:grayscale(1) sepia(.3) contrast(1.1) drop-shadow(0 20px 26px rgba(0,0,0,.6))"></div>
<div style="position:absolute; left:538px; top:560px; width:4px; height:720px; background:#c9a45c"></div>
<div class="strip"><div class="holes" style="top:8px"></div><div class="holes" style="bottom:8px"></div>
  <div class="fr" style="left:880px"><img src="classic/v42.png"></div><div class="fr" style="left:650px"><img src="classic/v20.png"></div>
  <div class="fr" style="left:420px"><img src="classic/v5.png"></div><div class="fr" style="left:190px"><img src="classic/v8.png"></div><div class="fr" style="left:-40px"><img src="classic/v10.png"></div></div>
<div class="title">متوفرة في متجر دُر</div>
<svg id="grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .45  0 0 0 .9 0"/></filter><rect width="1080" height="1920" filter="url(#n)"/></svg>
<div id="vig"></div>
</div></body></html>
