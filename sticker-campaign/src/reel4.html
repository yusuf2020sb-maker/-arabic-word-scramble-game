<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@600;700&family=Amiri:wght@700&family=Changa:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --navy:#13203a; --navy-d:#0b1426; --gold:#e9c46a; --gold-d:#b8913a; --cream:#f6efe0; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1080px; height:1920px; overflow:clip; background:var(--navy-d); color:var(--cream); font-family:'Changa',sans-serif; }
  #stage { position:absolute; inset:0; overflow:clip; background:radial-gradient(ellipse at 50% 40%, #1d2f52 0%, var(--navy) 45%, var(--navy-d) 100%); }
  .scene { position:absolute; inset:0; overflow:clip; display:none; }
  .abs { position:absolute; }
  .center { width:100%; text-align:center; }
  .messiri { font-family:'El Messiri',serif; font-weight:700; }
  .amiri { font-family:'Amiri',serif; font-weight:700; }
  .gold { color:var(--gold); }
  /* gold shine sweep over text */
  .shine { background:linear-gradient(100deg, var(--gold) 0%, var(--gold) 40%, #fff6d8 50%, var(--gold) 60%, var(--gold) 100%);
           background-size:300% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; }
  .word { display:inline-block; margin:0 14px; }
  /* 3D flip card */
  .flipwrap { position:absolute; left:140px; top:560px; width:800px; height:900px; perspective:2200px; }
  .card { position:absolute; inset:0; transform-style:preserve-3d; }
  .face { position:absolute; inset:0; backface-visibility:hidden; border-radius:36px; overflow:hidden;
          border:5px solid var(--gold); box-shadow:0 40px 90px rgba(0,0,0,.55); }
  .front { background:linear-gradient(160deg, #22355c, var(--navy-d)); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; }
  .front .n { font-family:'El Messiri'; font-size:220px; line-height:1; }
  .front .w { font-family:'El Messiri'; font-weight:700; font-size:92px; text-align:center; line-height:1.2; }
  .back { transform:rotateY(180deg); background:#d6bcac; }
  .back img { width:100%; height:100%; object-fit:cover; }
  .stk { position:absolute; filter:drop-shadow(0 16px 20px rgba(0,0,0,.5)); }
  /* mosaic wall */
  .tile { position:absolute; width:300px; height:424px; object-fit:cover; border-radius:16px; border:3px solid var(--gold-d); box-shadow:0 12px 30px rgba(0,0,0,.5); }
  /* QR */
  #qrcard { position:absolute; left:240px; top:620px; width:600px; height:600px; background:#fff; border-radius:40px; padding:34px; overflow:hidden; box-shadow:0 30px 80px rgba(0,0,0,.6); }
  #qrshine { position:absolute; top:-50%; width:140px; height:200%; background:linear-gradient(90deg, transparent, rgba(255,255,255,.85), transparent); transform:rotate(20deg); }
  .ring { position:absolute; left:540px; top:920px; width:600px; height:600px; margin:-300px 0 0 -300px; border:5px solid var(--gold); border-radius:50px; }
  #bokeh { position:absolute; inset:0; pointer-events:none; }
  .bokeh { position:absolute; left:0; top:0; border-radius:50%; background:radial-gradient(circle, rgba(255,226,150,.9), rgba(233,196,106,.25) 55%, transparent 70%); pointer-events:none; }
  #vig { position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.6) 100%); }
</style>
</head>
<body>
<div id="stage">
<div id="bokeh"></div>

<!-- S1: title, words blur in, gold shine sweeps across -->
<div class="scene" id="s1">
  <div class="abs center messiri" style="top:600px; font-size:190px; line-height:1.15">
    <span class="word" id="w1">ستيكرات</span><br><span class="word shine" id="w2">فنتج</span>
  </div>
  <div class="abs center amiri gold" id="w3" style="top:1130px; font-size:84px">لكل واحد استخدام</div>
</div>

<!-- S2-S4: flip cards per audience -->
<div class="scene" id="s2"></div>
<div class="scene" id="s3"></div>
<div class="scene" id="s4"></div>

<!-- S5: mosaic wall zooms out -->
<div class="scene" id="s5">
  <div class="abs" id="wall" style="left:0; top:0; width:1080px; height:1920px; transform-origin:540px 960px"></div>
  <div class="abs" id="s5cap" style="left:90px; right:90px; top:1460px; padding:34px; text-align:center; background:rgba(11,20,38,.88); border:4px solid var(--gold); border-radius:30px">
    <div class="messiri shine" id="s5t" style="font-size:96px">11 مجموعة</div>
    <div style="font-size:48px">ملف PDF · تطبع كل ما احتجت</div>
  </div>
</div>

<!-- S6: store QR -->
<div class="scene" id="s6">
  <div class="abs center messiri shine" id="sh" style="top:300px; font-size:160px">المتجر</div>
  <div class="abs center amiri" style="top:500px; font-size:66px">الكود يوصلك على طول</div>
  <div class="ring" id="r1"></div><div class="ring" id="r2"></div>
  <div id="qrcard"><img src="qr_store.png" style="width:100%; height:100%"><div id="qrshine"></div></div>
  <div class="abs center gold" style="top:1300px; font-size:58px; font-weight:700; direction:ltr">planme.zaher.io</div>
</div>

<div id="vig"></div>
</div>

<script>
const clamp = (x) => Math.min(1, Math.max(0, x));
const p = (t, a, b) => clamp((t - a) / (b - a));
const back = (x) => { const c1 = 1.8, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const outCubic = (x) => 1 - Math.pow(1 - x, 3);
const inOut = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const $ = (id) => document.getElementById(id);
const rnd = (seed) => { const x = Math.sin(seed * 12.9898) * 43758.5453; return x - Math.floor(x); };

// Timeline matches tools/mix_reel4.py output (voice clips with effects in the gaps).
const SCENES = [['s1', 0, 4.19], ['s2', 4.19, 8.44], ['s3', 8.44, 13.57], ['s4', 13.57, 17.55], ['s5', 17.55, 22.65], ['s6', 22.65, 28.0]];

// floating gold bokeh across the whole video
const BOKEH = [...Array(16)].map((_, i) => {
  const el = document.createElement('div'); el.className = 'bokeh';
  const s = 40 + rnd(i + 1) * 140; Object.assign(el.style, { width: s + 'px', height: s + 'px' });
  $('bokeh').appendChild(el);
  return { el, x: rnd(i + 7) * 1080, y: rnd(i + 13) * 1920, sp: 30 + rnd(i + 3) * 70, ph: rnd(i + 5) * 6 };
});

// flip cards: front = number + audience, back = their sticker sheet; side stickers float in
const CARDS = [
  ['s2', '١', 'أصحاب<br>المشاريع', 'تغليف يخلي طلبك ينحفظ', 'stamps_body', ['roses_0', 'vintage_3'], 4.19, 5.82, 6.18, 8.44],
  ['s3', '٢', 'المعلمين<br>والمعلمات', 'تحفيز للطلاب وتزيين للدفاتر', 'botanical_body', ['cozyhome_1', 'heritage_2'], 8.44, 10.64, 11.00, 13.57],
  ['s4', '٣', 'محبين<br>الجورنال', 'صفحات ما تكون فاضية', 'journal_body', ['journal_0', 'ephemera_1'], 13.57, 15.24, 15.60, 17.55],
].map(([scene, n, who, line, img, side, at, flipAt, lineAt, end]) => {
  $(scene).innerHTML = `
    <div class="flipwrap"><div class="card">
      <div class="face front"><div class="n shine">${n}</div><div class="w">${who}</div></div>
      <div class="face back"><img src="${img}.png"></div>
    </div></div>
    <img class="stk" src="cut/${side[0]}.png" style="left:40px; top:430px; width:250px">
    <img class="stk" src="cut/${side[1]}.png" style="left:790px; top:1330px; width:250px">
    <div class="abs center amiri gold" style="top:1560px; font-size:72px">${line}</div>`;
  const el = $(scene);
  return { card: el.querySelector('.card'), wrap: el.querySelector('.flipwrap'), a: el.children[1], b: el.children[2], line: el.children[3], at, flipAt, lineAt, end };
});

// mosaic wall of sheet thumbnails (5 x 5), centred tile is the hero
const SHEETS = ['cozyhome', 'journal', 'heritage', 'roses', 'cozyautumn', 'stamps', 'ephemera', 'autumn_ar', 'vintage', 'botanical'];
const TILES = [];
for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) {
  const el = document.createElement('img'); el.className = 'tile';
  el.src = `sheets/${SHEETS[(r * 5 + c * 3) % SHEETS.length]}.jpg`;
  const x = 540 - 150 + (c - 2) * 330, y = 960 - 212 + (r - 2) * 454;
  Object.assign(el.style, { left: x + 'px', top: y + 'px' });
  $('wall').appendChild(el); TILES.push({ el, d: Math.hypot(r - 2, c - 2) });
}

window.render = (t) => {
  SCENES.forEach(([id, a, b]) => { $(id).style.display = t >= a && t < b ? 'block' : 'none'; });

  BOKEH.forEach(({ el, x, y, sp, ph }) => {
    const yy = ((y - t * sp) % 2100 + 2100) % 2100 - 150;
    el.style.transform = `translate(${x + Math.sin(t * 0.8 + ph) * 40}px, ${yy}px)`;
    el.style.opacity = 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(t * 1.3 + ph));
  });

  // S1: words blur in one by one, then the shine sweeps
  [['w1', 0.6], ['w2', 1.2], ['w3', 2.4]].forEach(([id, at]) => {
    const k = p(t, at, at + 0.45);
    $(id).style.opacity = k;
    $(id).style.filter = `blur(${(1 - k) * 24}px)`;
    $(id).style.transform = `translateY(${(1 - outCubic(k)) * 50}px) scale(${1.15 - 0.15 * outCubic(k)})`;
  });
  document.querySelectorAll('.shine').forEach((el) => { el.style.backgroundPosition = `${100 - ((t * 45) % 200)}% 0`; });

  // S2-S4: card rises, flips to reveal the stickers, side stickers drift in
  CARDS.forEach(({ card, wrap, a, b, line, at, flipAt, lineAt, end }) => {
    if (t < at || t >= end) return;
    const rise = back(p(t, at, at + 0.45));
    wrap.style.transform = `translateY(${(1 - rise) * 500}px) scale(${0.85 + 0.15 * rise})`;
    const flip = inOut(p(t, flipAt, flipAt + 0.3));
    card.style.transform = `rotateY(${flip * 180}deg) rotateX(${Math.sin(t * 1.6) * 4}deg)`;
    [a, b].forEach((el, i) => {
      const k = p(t, flipAt + 0.3 + i * 0.15, flipAt + 0.7 + i * 0.15);
      el.style.opacity = k;
      el.style.transform = `translate(${(1 - outCubic(k)) * (i ? 300 : -300)}px, ${Math.sin(t * 2 + i) * 12}px) rotate(${(i ? 12 : -12) + Math.sin(t * 1.5 + i) * 4}deg)`;
    });
    line.style.opacity = p(t, lineAt, lineAt + 0.3);
    line.style.filter = `blur(${(1 - p(t, lineAt, lineAt + 0.3)) * 16}px)`;
  });

  // S5: start zoomed into the centre tile, pull back to the full wall, tiles ripple in
  const z = inOut(p(t, 17.6, 19.3));
  $('wall').style.transform = `scale(${3.2 - 2.55 * z}) rotate(${-6 + 6 * z}deg)`;
  TILES.forEach(({ el, d }) => {
    const k = p(t, 17.6 + d * 0.12, 18.0 + d * 0.12);
    el.style.opacity = d === 0 ? 1 : k;
    el.style.transform = `scale(${d === 0 ? 1 : 0.6 + 0.4 * back(k)})`;
  });
  $('s5cap').style.opacity = p(t, 18.2, 18.5);
  $('s5cap').style.transform = `translateY(${(1 - back(p(t, 18.2, 18.7))) * 200}px)`;

  // S6: QR pops, shine sweeps across it, rings pulse outward
  const q = p(t, 22.65, 23.0);
  $('qrcard').style.transform = `scale(${0.3 + 0.7 * back(q)})`;
  $('qrshine').style.left = (-200 + ((t - 23.2) % 1.6) / 1.6 * 1000) + 'px';
  $('qrshine').style.display = t > 23.2 ? '' : 'none';
  [['r1', 0], ['r2', 0.8]].forEach(([id, off]) => {
    const k = ((t - 23.2 - off) % 1.6 + 1.6) % 1.6 / 1.6;
    $(id).style.display = t > 23.2 + off ? '' : 'none';
    $(id).style.transform = `scale(${1 + k * 0.45})`;
    $(id).style.opacity = 1 - k;
  });
  $('sh').style.opacity = p(t, 22.65, 22.95);
};
render(0);
</script>
</body>
</html>
