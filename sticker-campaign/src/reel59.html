<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root { --ink:#111; --yel:#ffd23f; --red:#ef3e36; --blue:#2e86de; --cream:#fffaf0; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:clip; background:var(--yel); font-family:'Lalezar','Cairo',sans-serif; color:var(--ink); }
  #stage { position:absolute; left:0; top:0; width:1080px; height:1920px; overflow:clip; background:radial-gradient(circle, rgba(239,62,54,.35) 0 5px, transparent 6px) 0 0 / 26px 26px, var(--yel); }
  .panel { position:absolute; left:0; top:0; background:var(--cream); border:12px solid var(--ink); box-shadow:14px 14px 0 var(--ink); overflow:hidden; will-change:transform; transform-origin:50% 50%; }
  .panel .dots { position:absolute; inset:0; background:radial-gradient(circle, rgba(46,134,222,.25) 0 6px, transparent 7px) 0 0 / 30px 30px; }
  .panel .speed { position:absolute; inset:-200px; background:repeating-conic-gradient(from 0deg at 50% 50%, rgba(0,0,0,.08) 0 2deg, transparent 2deg 9deg); }
  .panel img { position:absolute; filter:drop-shadow(6px 6px 0 rgba(0,0,0,.85)); }
  .cap { position:absolute; left:-12px; top:-12px; background:var(--yel); border:10px solid var(--ink); padding:4px 40px 18px; font-size:96px; white-space:nowrap; }
  .bub { position:absolute; background:#fff; border:10px solid var(--ink); border-radius:60px; padding:6px 44px 22px; white-space:nowrap; font-size:84px; }
  .bub:after { content:''; position:absolute; bottom:-46px; right:80px; width:50px; height:50px; background:#fff; border-right:10px solid var(--ink); border-bottom:10px solid var(--ink); transform:skewX(30deg) rotate(45deg); }
  .burst { position:absolute; left:0; top:0; will-change:transform; }
  .grp { position:absolute; left:0; top:0; width:1080px; height:1920px; display:none; }
  .ov { position:absolute; left:0; width:1080px; text-align:center; white-space:nowrap; line-height:1.35; z-index:60; }
  .w { display:inline-block; }
  .blk { display:inline-block; background:var(--ink); color:var(--yel); padding:0 50px 16px; transform:rotate(-2deg); }
</style></head><body>
<div id="stage">
  <div class="grp" id="g1">
    <div class="panel" id="pA" style="left:60px; top:110px; width:960px; height:780px"><div class="speed"></div><img src="coffee/p94.png" style="left:330px; top:150px; width:300px"><img src="coffee/p48.png" style="left:600px; top:470px; width:300px"><div class="cap" id="h1">قبل القهوة</div></div>
    <div class="panel" id="pB" style="left:60px; top:960px; width:960px; height:820px"><div class="dots"></div><img src="coffee/p33.png" style="left:330px; top:200px; width:330px"><div class="cap" id="h2" style="background:var(--red); color:#fff">وبعد القهوة!</div></div>
    <svg class="burst" id="bB" width="420" height="420" viewBox="0 0 200 200"><polygon points="100,0 120,60 190,40 140,95 200,130 130,130 140,200 100,145 55,200 65,130 0,135 60,95 10,40 80,60" fill="#ef3e36" stroke="#111" stroke-width="6"/><text x="100" y="125" text-anchor="middle" font-family="Lalezar" font-size="70" fill="#fff" stroke="#111" stroke-width="3">!!</text></svg>
  </div>
  <div class="grp" id="g2"></div>
  <div class="grp" id="g3"><div id="tiles"></div>
    <div class="panel" id="cP" style="left:210px; top:730px; width:660px; height:600px; z-index:5; text-align:center"><div class="dots"></div><div style="position:relative; font-family:Cairo; font-weight:900; font-size:260px; line-height:1.1; color:var(--red); -webkit-text-stroke:8px #111" id="n114">١١٤</div><div style="position:relative; font-size:110px; line-height:1">ستيكر</div></div>
  </div>
  <div class="grp" id="g4"></div>
  <div class="grp" id="g5"><div class="panel" id="sP" style="left:200px; top:560px; width:680px; height:960px; background:#fff"><img src="coffee/sheet3.jpg" style="left:20px; top:20px; width:616px; filter:none"></div></div>
  <div class="grp" id="g6"><div class="panel" id="qP" style="left:230px; top:560px; width:620px; height:620px; background:#fff"><img src="qr_store.png" style="left:40px; top:40px; width:516px; filter:none"></div>
    <div class="bub" id="qB" style="left:330px; top:300px; font-size:90px">امسح هنا!</div></div>
  <div class="ov" style="top:1560px; font-size:120px"><span class="w blk" id="cap"></span></div>
  <div class="ov" style="top:1290px; font-size:90px"><span class="w blk" id="n2" style="background:var(--red); color:#fff">ميمز تضحّك</span></div>
  <div class="ov" style="top:180px; font-size:130px"><span class="w blk" id="ucap"></span></div>
  <div class="ov" style="top:170px; font-size:140px"><span class="w blk" id="p1">ملف PDF</span></div>
  <div class="ov" style="top:360px; font-size:96px"><span class="w blk" id="p2" style="background:var(--red); color:#fff">جاهز للطباعة</span></div>
  <div class="ov" style="top:110px; font-size:100px"><span class="w blk" id="e1">ستيكرات قهوة وميمز</span></div>
  <div class="ov" style="top:1300px; font-size:84px"><span class="w" id="e2b">متوفرة في</span></div>
  <div class="ov" style="top:1440px; font-size:170px"><span class="w blk" id="e2" style="background:var(--red); color:#fff; padding:0 70px 26px">متجر دُر</span></div>
  <div class="ov" style="top:1730px; font-size:50px; font-family:Cairo; font-weight:800; direction:ltr"><span class="w" id="e3">planme.zaher.io</span></div>
</div>

<script src="reel59_timeline.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const p = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eb = (x) => { const c = 1.7; return x <= 0 ? 0 : 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const R = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const place = (e, x, y, s, r, o) => { e.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`; if (o !== undefined) e.style.opacity = o; };
// comic slam: comes in big, lands hard with a little shake
const slam = (e, t, a, rot = 0, d = 0.28) => { const k = p(t, a, a + d); const sh = k >= 1 ? Math.sin((t - a - d) * 70) * 6 * Math.exp(-(t - a - d) * 12) : 0;
  e.style.opacity = k > 0 ? 1 : 0; e.style.transform = `translate(${sh}px, ${-sh}px) rotate(${rot + (1 - k) * 8}deg) scale(${k < 1 ? 1.6 - 0.6 * eo(k) : 1})`; };
const pop = (id, t, a, d = 0.35) => { const k = p(t, a, a + d); const e = $(id); e.style.opacity = p(t, a, a + 0.08); e.style.transform = `rotate(-2deg) scale(${0.5 + 0.5 * eb(k)})`; };
const off = (...ids) => ids.forEach((id) => ($(id).style.opacity = 0));

const D = { h1: 0.3, h2: 1.5, c1: 3.4, c2: 4.8, c3: 6.2, count: 8.0, n2: 9.4, u0: 11.0, u1: 12.2, u2: 13.4, print: 15.2, print2: 16.3, brand: 18.0, store: 19.6, store2: 20.3, end_all: 23.4 };
const T = Object.assign({}, D, window.TL || {});
const CUT = [T.c1 - 0.4, T.count - 0.35, T.u0 - 0.35, T.print - 0.35, T.brand - 0.35];
const sceneAt = (t) => (t < CUT[0] ? 0 : t < CUT[1] ? 1 : t < CUT[2] ? 2 : t < CUT[3] ? 3 : t < CUT[4] ? 4 : 5);

// S2: one big panel per meme, each with its own bubble
const IT = [['بطارية فاضية', 'p49', 'أبغى قهوة!', '#ffe9e8'], ['قهوة بالمغذّي', 'p10', 'حالة طوارئ!', '#e6f1ff'], ['وقهوتي أولاً', 'p46', 'لا تكلمني!', '#fff6d6']];
const its = IT.map(([cap, n, bub, bg], i) => { const d = document.createElement('div'); d.className = 'panel'; d.style.cssText += `left:70px; top:240px; width:940px; height:1180px; background:${bg}`;
  d.innerHTML = `<div class="speed"></div><img src="coffee/${n}.png" style="left:170px; top:330px; width:600px"><div class="bub" style="left:${i === 1 ? 300 : 200}px; top:70px">${bub}</div>`; $('g2').appendChild(d); return { d, cap }; });
// S3: tiles around the count panel
const TN = ['p8', 'p26', 'p30', 'p36', 'p51', 'p53', 'p54', 'p74'];
const TP = [[40, 70], [380, 50], [720, 70], [40, 400], [720, 400], [40, 1440], [380, 1460], [720, 1440]];
const tiles = TN.map((n, i) => { const d = document.createElement('div'); d.className = 'panel'; d.style.cssText += `width:300px; height:290px; background:${['#fff', '#ffe9e8', '#e6f1ff'][i % 3]}`;
  d.innerHTML = `<div class="dots"></div><img src="coffee/${n}.png" style="left:30px; top:20px; width:230px; height:240px; object-fit:contain">`; $('tiles').appendChild(d); return d; });
// S4: uses panels
const LAP = `<div style="position:absolute; left:110px; top:250px; width:700px; height:460px; background:#3b3f46; border-radius:24px"></div><div style="position:absolute; left:50px; top:720px; width:820px; height:44px; background:#2a2d33; border-radius:0 0 30px 30px"></div>`;
const NB = `<div style="position:absolute; left:220px; top:180px; width:500px; height:700px; background:#2e86de; border-radius:16px"><div style="position:absolute; left:0; top:0; width:50px; height:700px; background:#1f5fa3"></div></div>`;
const MUG = `<div style="position:absolute; left:230px; top:200px; width:420px; height:560px; background:#fff; border:10px solid #111; border-radius:20px 20px 80px 80px"></div><div style="position:absolute; left:620px; top:310px; width:170px; height:280px; border:40px solid #111; border-left:none; border-radius:0 140px 140px 0"></div>`;
const US = [['للابتوب', LAP, [['p54', 180, 330, 260, -6], ['p49', 470, 300, 300, 6], ['p94', 330, 520, 170, 0]]], ['لدفتر الدوام', NB, [['p53', 330, 280, 300, -4], ['p48', 330, 620, 290, 4]]], ['ولأكواب القهوة', MUG, [['p51', 300, 330, 280, 0]]]];
const uses = US.map(([cap, html, st]) => { const d = document.createElement('div'); d.className = 'panel'; d.style.cssText += 'left:70px; top:520px; width:940px; height:1040px; background:#fff'; d.innerHTML = `<div class="dots"></div>${html}`; $('g4').appendChild(d);
  const ims = st.map(([n, x, y, w, r]) => { const im = document.createElement('img'); im.src = `coffee/${n}.png`; im.style.cssText = `left:0; top:0; width:${w}px`; d.appendChild(im); return { im, x, y, r }; }); return { d, cap, ims }; });

window.render = (t) => {
  const sc = sceneAt(t);
  ['g1', 'g2', 'g3', 'g4', 'g5', 'g6'].forEach((id, i) => ($(id).style.display = i === sc ? 'block' : 'none'));
  $('stage').style.opacity = 1 - p(t, T.end_all - 0.5, T.end_all);
  // page shake on every cut
  const sh = CUT.reduce((a, c) => a + (t >= c && t < c + 0.25 ? Math.sin((t - c) * 80) * 10 * (1 - (t - c) / 0.25) : 0), 0);
  $('stage').style.transform = `translate(${sh}px, ${-sh * 0.6}px)`;
  if (sc === 0) { slam($('pA'), t, T.h1 - 0.2, -1.5); slam($('pB'), t, T.h2 - 0.2, 1.5); const b = eb(p(t, T.h2 + 0.15, T.h2 + 0.45)); place($('bB'), 700, 900, b, t * 20, b > 0 ? 1 : 0); }
  if (sc === 1) { const ks = [T.c1, T.c2, T.c3]; its.forEach(({ d }, i) => { const a = ks[i] - 0.25; const end = i < 2 ? ks[i + 1] - 0.25 : 99; if (t >= a && t < end) slam(d, t, a, (i - 1) * 1.5); else d.style.opacity = 0; }); }
  if (sc === 2) { tiles.forEach((d, i) => { slam(d, t, CUT[1] + 0.35 + i * 0.06, (R(i) - 0.5) * 8, 0.2); d.style.transform += ` translate(${TP[i][0]}px, ${TP[i][1]}px)`; d.style.left = TP[i][0] + 'px'; d.style.top = TP[i][1] + 'px'; d.style.transform = d.style.transform.replace(/ translate\([^)]*\)$/, ''); });
    slam($('cP'), t, CUT[1] + 0.05, -2); $('n114').textContent = Math.round(114 * eo(p(t, CUT[1] + 0.15, CUT[1] + 1.1))).toLocaleString('ar-EG'); }
  if (sc === 3) { const at = [CUT[2] + 0.1, T.u1 - 0.3, T.u2 - 0.3]; const st = t < at[1] ? 0 : t < at[2] ? 1 : 2;
    uses.forEach(({ d, ims }, i) => { if (i === st) slam(d, t, at[i], (i - 1) * 1.5); else d.style.opacity = 0; ims.forEach(({ im, x, y, r }, j) => { const q = eb(p(t, at[i] + 0.3 + j * 0.1, at[i] + 0.6 + j * 0.1)); place(im, x, y, q, r, q > 0 ? 1 : 0); }); }); }
  if (sc === 4) slam($('sP'), t, CUT[3] + 0.1, -2);
  if (sc === 5) { slam($('qP'), t, CUT[4] + 0.25, 0); const b = p(t, CUT[4] + 0.6, CUT[4] + 0.9); $('qB').style.opacity = b > 0 ? 1 : 0; $('qB').style.transform = `scale(${eb(b)})`; }
  off('cap', 'n2', 'ucap', 'p1', 'p2', 'e1', 'e2b', 'e2', 'e3');
  if (sc === 1) { const ks = [T.c1, T.c2, T.c3]; let cur = 0; ks.forEach((k, i) => { if (t >= k - 0.15) cur = i; }); $('cap').textContent = IT[cur][0]; pop('cap', t, ks[cur] - 0.1); }
  if (sc === 2) pop('n2', t, T.n2 - 0.05);
  if (sc === 3) { const at = [CUT[2] + 0.1, T.u1 - 0.3, T.u2 - 0.3]; const st = t < at[1] ? 0 : t < at[2] ? 1 : 2; $('ucap').textContent = uses[st].cap; pop('ucap', t, at[st] + 0.1); }
  if (sc === 4) { pop('p1', t, T.print - 0.05); pop('p2', t, T.print2 - 0.05); }
  if (sc === 5) { pop('e1', t, T.brand - 0.05); pop('e2b', t, T.store - 0.05); pop('e2', t, T.store2 - 0.05, 0.4); pop('e3', t, T.store2 + 0.35); }
};
render(0);
</script>
</body></html>
