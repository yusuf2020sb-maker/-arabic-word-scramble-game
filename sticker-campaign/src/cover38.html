<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:clip; font-family:'Reem Kufi',sans-serif; color:#f7f0e1; }
  #stage { position:absolute; left:0; top:0; width:1080px; height:1920px; overflow:clip; background:radial-gradient(ellipse at 50% 50%, #15605d, #0a3534 75%); }
  .line { position:absolute; left:0; width:1080px; text-align:center; font-weight:700; line-height:1.3; white-space:nowrap; }
  .st { position:absolute; filter:drop-shadow(0 16px 20px rgba(0,0,0,.45)); }
  .rays { position:absolute; left:-460px; top:-20px; width:2000px; height:2000px; border-radius:50%; background:repeating-conic-gradient(from 0deg, rgba(212,162,76,.2) 0 8deg, transparent 8deg 20deg); }
  .arch { position:absolute; width:250px; height:340px; border:6px solid #d4a24c; border-radius:125px 125px 12px 12px; background:rgba(10,53,52,.6); }
  .pill { position:absolute; left:220px; top:1700px; width:640px; padding:12px 0 22px; text-align:center; border-radius:80px; background:#b5532f; border:5px solid #d4a24c; font-size:56px; }
</style></head><body><div id="stage">
<svg style="position:absolute; left:0; top:0; opacity:.5" width="1080" height="1920"><g id="g" transform="translate(540 1060)" fill="none" stroke="#d4a24c" stroke-width="4"></g></svg>
<div class="rays"></div>
<div class="line" style="top:190px; font-size:120px">وش في صندوق</div>
<div class="line" style="top:350px; font-size:170px; color:#d4a24c">جدتي؟</div>
<div class="arch" style="left:80px; top:640px"></div><div class="arch" style="left:415px; top:600px"></div><div class="arch" style="left:750px; top:640px"></div>
<img class="st" src="heritage/h50.png" style="left:780px; top:700px; width:190px">
<img class="st" src="heritage/h42.png" style="left:445px; top:690px; width:190px">
<img class="st" src="heritage/h52.png" style="left:115px; top:690px; width:180px">
<img class="st" src="heritage/h49.png" style="left:200px; top:1060px; width:680px">
<img class="st" src="heritage/h14.png" style="left:40px; top:1420px; width:230px; transform:rotate(-10deg)">
<img class="st" src="heritage/h46.png" style="left:820px; top:1420px; width:210px; transform:rotate(12deg)">
<div class="pill">متوفرة في متجر دُر</div>
<script>
const g = document.getElementById('g'); const sp = (r) => { let d=''; for (let i=0;i<16;i++){ const a=i/16*Math.PI*2-Math.PI/2; const rr=i%2?r*0.62:r; d+=(i?'L':'M')+(Math.cos(a)*rr).toFixed(1)+' '+(Math.sin(a)*rr).toFixed(1)+' ';} return d+'Z'; };
[300,520,760].forEach(r=>{ const p=document.createElementNS('http://www.w3.org/2000/svg','path'); p.setAttribute('d',sp(r)); g.appendChild(p); });
</script>
</div></body></html>
