<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:clip; font-family:'Baloo Bhaijaan 2',sans-serif; }
  #stage { position:absolute; left:0; top:0; width:1080px; height:1920px; overflow:clip; background:#e9c46a; }
  .line { position:absolute; left:0; width:1080px; text-align:center; font-weight:800; line-height:1.1; white-space:nowrap; }
  .st { position:absolute; filter:drop-shadow(0 14px 0 rgba(47,61,44,.25)); }
  .ring { position:absolute; border-radius:50%; }
  .badge { position:absolute; left:760px; top:1270px; width:240px; height:240px; border-radius:50%; background:#2f3d2c; color:#f6eedd; transform:rotate(-10deg);
    display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 14px 0 rgba(47,61,44,.25); }
  .badge b { font-size:110px; line-height:.9; } .badge span { font-size:40px; }
</style></head><body>
<div id="stage">
  <div class="ring" style="left:90px; top:640px; width:900px; height:900px; background:#c97f74"></div>
  <div class="ring" style="left:190px; top:740px; width:700px; height:700px; background:#f6eedd"></div>
  <div class="line" style="top:220px; font-size:170px; color:#2f3d2c">حديقة كاملة</div>
  <div class="line" style="top:410px; font-size:160px; color:#f6eedd; -webkit-text-stroke:10px #2f3d2c; paint-order:stroke fill">في ملف!</div>
  <img class="st" src="botan/b14.png" style="left:110px; top:760px; width:250px; transform:rotate(-14deg)">
  <img class="st" src="botan/b13.png" style="left:730px; top:740px; width:250px; transform:rotate(12deg)">
  <img class="st" src="botan/b31.png" style="left:140px; top:1150px; width:220px; transform:rotate(-8deg)">
  <img class="st" src="botan/b19.png" style="left:330px; top:760px; width:420px; transform:rotate(-3deg)">
  <div class="badge"><b>٤٦</b><span>ستيكر</span></div>
  <div class="line" style="top:1610px; font-size:70px; color:#2f3d2c">ستيكرات نباتية · ملف PDF</div>
</div>
</body></html>
