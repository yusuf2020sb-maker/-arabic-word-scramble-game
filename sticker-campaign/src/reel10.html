<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;900&family=Scheherazade+New:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --night:#151634; --night-d:#0b0c22; --gold:#f2c14e; --gold-l:#ffe7a3; --wood:#7a4a26; --wood-d:#4e2d14; --paper:#ecd9b0; --ink:#3b2412; --hl:#f2c14e; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1080px; height:1920px; overflow:clip; font-family:'Rubik',sans-serif; color:#fff; }
  #stage { position:absolute; inset:0; overflow:clip; background:radial-gradient(ellipse at 50% 55%, #26285a, var(--night) 50%, var(--night-d)); }
  .scene { position:absolute; inset:0; overflow:clip; display:none; }
  .abs { position:absolute; }
  .center { width:100%; text-align:center; }
  .big { font-weight:900; line-height:1.25; }
  /* highlighter behind a word */
  .hlw { position:relative; display:inline-block; padding:0 18px; z-index:0; }
  .hlw::before { content:''; position:absolute; left:0; right:0; bottom:8%; height:46%; background:var(--hl); z-index:-1; transform-origin:right; transform:scaleX(var(--k, 0)) skewX(-8deg); border-radius:10px; }
  .dust { position:absolute; left:0; top:0; width:8px; height:8px; border-radius:50%; background:var(--gold-l); box-shadow:0 0 12px var(--gold); }
  /* chest */
  #chest { position:absolute; left:240px; top:900px; width:600px; height:420px; perspective:1400px; }
  #cbody { position:absolute; left:0; right:0; bottom:0; height:300px; background:linear-gradient(var(--wood), var(--wood-d)); border:10px solid #2c1709; border-radius:20px;
           background-image:linear-gradient(90deg, transparent 46%, var(--gold) 46% 54%, transparent 54%), linear-gradient(var(--wood), var(--wood-d)); }
  #lid { position:absolute; left:0; right:0; top:0; height:150px; background:linear-gradient(#8b5730, var(--wood)); border:10px solid #2c1709; border-radius:120px 120px 16px 16px; transform-origin:50% 100%;
         background-image:linear-gradient(90deg, transparent 46%, var(--gold) 46% 54%, transparent 54%), linear-gradient(#8b5730, var(--wood)); }
  #lock { position:absolute; left:265px; top:120px; width:70px; height:80px; background:var(--gold); border:6px solid #2c1709; border-radius:12px; z-index:2; }
  #rays { position:absolute; left:-460px; top:-700px; width:1520px; height:1520px; border-radius:50%; opacity:0;
          background:repeating-conic-gradient(from 0deg, rgba(255,231,163,.55) 0 6deg, transparent 6deg 18deg);
          -webkit-mask:radial-gradient(circle, #000 15%, transparent 65%); }
  #glow { position:absolute; left:50px; top:-60px; width:500px; height:300px; border-radius:50%; background:radial-gradient(rgba(255,231,163,1), rgba(242,193,78,.4) 40%, transparent 70%); opacity:0; }
  #flash { position:absolute; inset:0; background:var(--gold-l); opacity:0; pointer-events:none; }
  /* floating items */
  .item { position:absolute; left:0; top:0; width:300px; height:300px; object-fit:contain; filter:drop-shadow(0 0 24px rgba(255,231,163,.55)); }
  .pill { position:absolute; left:0; top:0; background:var(--gold); color:var(--night-d); font-weight:900; font-size:56px; padding:10px 40px; border-radius:50px; white-space:nowrap; }
  /* multiply grid */
  .tile { position:absolute; left:0; top:0; }
  /* map */
  #map { position:absolute; inset:0; background:var(--paper);
         background-image:radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.35), transparent 50%), radial-gradient(ellipse at 80% 80%, rgba(120,80,30,.25), transparent 55%),
         repeating-linear-gradient(0deg, rgba(120,80,30,.05) 0 2px, transparent 2px 9px); }
  #map .t { color:var(--ink); }
  #compass { position:absolute; left:110px; top:1500px; width:200px; height:200px; border-radius:50%; border:8px solid var(--ink); color:var(--ink); font-size:40px; font-weight:900; display:flex; align-items:flex-start; justify-content:center; padding-top:6px; }
  #needle { position:absolute; left:92px; top:30px; width:16px; height:140px; background:linear-gradient(#b5342a 50%, var(--ink) 50%); clip-path:polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
  #xmark { position:absolute; left:690px; top:600px; font-family:'Scheherazade New',serif; font-size:200px; color:#b5342a; font-weight:700; line-height:1; }
  #qrbox { position:absolute; left:560px; top:520px; width:420px; height:420px; background:#fff; border:8px solid var(--ink); border-radius:30px; padding:26px; box-shadow:0 18px 0 rgba(59,36,18,.5); }
  svg { position:absolute; left:0; top:0; overflow:visible; }
</style>
</head>
<body>
<div id="stage">

<!-- S1: hook -->
<div class="scene" id="s1">
  <div class="abs center big" id="h1" style="top:640px; font-size:88px">طابعتك اللي في البيت…</div>
  <div class="abs center big" id="h2" style="top:900px; font-size:120px"><span class="hlw" id="hl1" style="color:var(--night-d)">كنز</span> محد<br>قال لك عنه 🤫</div>
</div>

<!-- S2: chest opens -->
<div class="scene" id="s2">
  <div id="chest"><div id="rays"></div><div id="glow"></div><div id="cbody"></div><div id="lid"></div><div id="lock"></div></div>
</div>

<!-- S3: what's inside -->
<div class="scene" id="s3">
  <div class="abs center big" id="in" style="top:220px; font-size:96px">وهذا اللي فيه:</div>
</div>

<!-- S4: it multiplies -->
<div class="scene" id="s4">
  <div class="abs center big" id="m1" style="top:200px; font-size:96px">والأحلى؟</div>
  <div class="abs center big" id="m2" style="top:1560px; font-size:84px"><span class="hlw" id="hl2" style="color:var(--night-d)">ما يخلص</span><br><span style="font-size:60px; font-weight:700">تطبعه كل ما احتجت</span></div>
</div>

<!-- S5: treasure map to the store -->
<div class="scene" id="s5">
  <div id="map">
    <div class="abs center big t" id="mt" style="top:170px; font-size:96px">خريطة الكنز</div>
    <svg width="1080" height="1920"><path id="trail" d="M 210 1560 C 260 1300, 520 1380, 470 1150 S 200 900, 420 820 S 760 760, 760 720" fill="none" stroke="#3b2412" stroke-width="12" stroke-linecap="round" stroke-dasharray="1 34"/></svg>
    <div id="compass">ش<div id="needle"></div></div>
    <div id="xmark">✕</div>
    <div id="qrbox"><img src="qr_store.png" style="width:100%; height:100%"></div>
    <div class="abs t big" id="mu" style="left:520px; width:500px; text-align:center; top:980px; font-size:64px">المتجر</div>
    <div class="abs t" id="mu2" style="left:520px; width:500px; text-align:center; top:1070px; font-size:46px; font-weight:700; direction:ltr">planme.zaher.io</div>
  </div>
</div>

<div id="flash"></div>
<div id="dustL"></div>
</div>

<script>
const clamp = (x) => Math.min(1, Math.max(0, x));
const p = (t, a, b) => clamp((t - a) / (b - a));
const back = (x) => { const c1 = 1.8, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const outCubic = (x) => 1 - Math.pow(1 - x, 3);
const inOut = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const $ = (id) => document.getElementById(id);
const rnd = (s) => { const x = Math.sin(s * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };

const SCENES = [['s1', 0, 3.2], ['s2', 3.2, 5.3], ['s3', 5.3, 13.6], ['s4', 13.6, 17.6], ['s5', 17.6, 24.0]];

// gold dust drifting everywhere except on the map
const DUST = [...Array(40)].map((_, i) => { const d = document.createElement('div'); d.className = 'dust'; $('dustL').appendChild(d); return { d, x: rnd(i) * 1080, y: rnd(i + 50) * 1920, s: 0.4 + rnd(i + 9) * 1.2, sp: 15 + rnd(i + 3) * 40, ph: rnd(i + 7) * 6 }; });

// S3: four groups fly out of a chest at the bottom and settle around the screen, then orbit
const GROUPS = [
  ['طوابع', ['cut5/stamps_p30', 'cut3/stamps_p22'], 5.6],
  ['ورود', ['cut4/cozyhome_p50', 'cut4/journal_p68'], 7.5],
  ['تراث', ['cut4/heritage_p8', 'cut3/heritage_p40'], 9.4],
  ['خريف', ['cut2/autumn_ar_p37', 'cut5/cozyautumn_p67'], 11.3],
];
const mini = document.createElement('div'); mini.className = 'abs'; mini.style.cssText = 'left:390px; top:1640px; width:300px; height:180px';
mini.innerHTML = `<div style="position:absolute; inset:60px 0 0; background:linear-gradient(var(--wood),var(--wood-d)); border:8px solid #2c1709; border-radius:14px"></div><div style="position:absolute; left:20px; right:20px; top:-10px; height:90px; border-radius:50%; background:radial-gradient(rgba(255,231,163,1), transparent 70%)"></div>`;
$('s3').appendChild(mini);
const ITEMS = GROUPS.flatMap(([name, srcs, at], g) => {
  const pill = document.createElement('div'); pill.className = 'pill'; pill.textContent = name; $('s3').appendChild(pill);
  const slots = [[[80, 420], [700, 420]], [[80, 780], [700, 780]], [[80, 1140], [700, 1140]], [[390, 560], [390, 960]]][g];
  const its = srcs.map((src, i) => { const el = document.createElement('img'); el.className = 'item'; el.src = `${src}.png`; $('s3').appendChild(el); return { el, at: at + i * 0.25, to: slots[i], g }; });
  return [{ pill, at, g, name }, ...its];
});

// S4: one sticker doubles into a grid: 1 -> 2 -> 4 -> 8 -> 16
const TILES = [...Array(16)].map((_, i) => { const el = document.createElement('img'); el.className = 'tile'; el.src = 'cut4/vases_p19.png'; $('s4').appendChild(el); return el; });
const STEPS = [14.3, 14.75, 15.2, 15.65, 16.1];
const layout = (n) => { const cols = [1, 2, 2, 4, 4][Math.log2(n)], rows = n / cols; const W = 900, H = 1180; const w = Math.min(W / cols, H / rows) * 0.86;
  return [...Array(n)].map((_, i) => [90 + (W / cols) * (i % cols) + (W / cols - w) / 2, 330 + (H / rows) * Math.floor(i / cols) + (H / rows - w) / 2, w]); };

let TRAIL = null;
window.render = (t) => {
  SCENES.forEach(([id, a, b]) => { $(id).style.display = t >= a && t < b ? 'block' : 'none'; });
  const onMap = t >= 17.6;
  DUST.forEach(({ d, x, y, s, sp, ph }) => {
    const yy = ((y - t * sp) % 1950 + 1950) % 1950 - 15;
    d.style.display = onMap ? 'none' : '';
    d.style.transform = `translate(${x + Math.sin(t + ph) * 30}px, ${yy}px) scale(${s})`;
    d.style.opacity = 0.3 + 0.7 * Math.abs(Math.sin(t * 2 + ph));
  });

  // S1: hook lines, then the highlighter sweeps behind "كنز"
  $('h1').style.opacity = p(t, 0.15, 0.4); $('h1').style.transform = `translateY(${(1 - outCubic(p(t, 0.15, 0.6))) * 60}px)`;
  $('h2').style.opacity = p(t, 1.3, 1.5); $('h2').style.transform = `scale(${0.7 + 0.3 * back(p(t, 1.3, 1.75))})`;
  $('hl1').style.setProperty('--k', outCubic(p(t, 1.9, 2.3)));
  $('stage').style.transform = `translate(${t > 1.3 && t < 1.6 ? Math.sin(t * 80) * 10 : 0}px, 0)`;

  // S2: chest drops, rattles, the lid bursts open, rays spin, then we zoom into the light
  const dr = back(p(t, 3.2, 3.65));
  const rattle = t > 3.7 && t < 4.2 ? Math.sin(t * 70) * 4 : 0;
  const lid = outCubic(p(t, 4.2, 4.45));
  const zoom = inOut(p(t, 4.65, 5.3));
  $('chest').style.transform = `translateY(${(1 - dr) * -1500}px) rotate(${rattle}deg) scale(${1 + zoom * 6})`;
  $('chest').style.transformOrigin = '300px 40px';
  $('lid').style.transform = `rotateX(${lid * 110}deg)`;
  $('lock').style.transform = `translateY(${lid * 300}px) rotate(${lid * 90}deg)`; $('lock').style.opacity = 1 - lid;
  $('rays').style.opacity = lid; $('rays').style.transform = `rotate(${t * 40}deg) scale(${0.6 + lid * 0.4})`;
  $('glow').style.opacity = lid;
  $('flash').style.opacity = Math.max(p(t, 4.85, 5.25) * (t < 5.3 ? 1 : 0), t >= 5.3 ? 1 - p(t, 5.3, 5.7) : 0);

  // S3
  $('in').style.opacity = p(t, 5.4, 5.6);
  ITEMS.forEach((it) => {
    if (it.pill) {
      const k = back(p(t, it.at + 0.3, it.at + 0.7));
      const active = t < it.at + 1.9 || it.g === 3;
      it.pill.style.transform = `translate(${400 - it.name.length * 8}px, ${1480 - k * 60}px) scale(${k})`;
      it.pill.style.opacity = active && t >= it.at + 0.3 ? 1 : 0;
      return;
    }
    const k = p(t, it.at, it.at + 0.9);
    const e = outCubic(k);
    const sx = 390, sy = 1600, [tx, ty] = it.to;
    const arc = Math.sin(k * Math.PI) * -350;
    const orbit = t > it.at + 0.9 ? Math.sin((t - it.at) * 1.4 + it.g) * 18 : 0;
    it.el.style.display = t >= it.at ? '' : 'none';
    it.el.style.transform = `translate(${sx + (tx - sx) * e}px, ${sy + (ty - sy) * e + arc + orbit}px) scale(${0.2 + 0.8 * e}) rotate(${(1 - e) * 360 + Math.sin(t + it.g) * 4}deg)`;
  });

  // S4: doubling grid
  $('m1').style.opacity = p(t, 13.7, 13.9);
  const lvl = STEPS.filter((s) => t >= s).length;  // 0..5
  const n = Math.pow(2, Math.max(0, lvl - 1)) || 1;
  const prevN = Math.max(1, n / 2), L = layout(n), Lp = layout(prevN);
  const k = lvl ? outCubic(p(t, STEPS[lvl - 1], STEPS[lvl - 1] + 0.3)) : 0;
  TILES.forEach((el, i) => {
    if (i >= n || lvl === 0) { el.style.display = 'none'; return; }
    el.style.display = '';
    const [x, y, w] = L[i], [px, py, pw] = Lp[i % prevN];
    const cx = px + (x - px) * k, cy = py + (y - py) * k, cw = pw + (w - pw) * k;
    el.style.width = cw + 'px';
    el.style.transform = `translate(${cx}px, ${cy}px) rotate(${Math.sin(t * 2 + i) * 3}deg)`;
  });
  $('m2').style.opacity = p(t, 16.3, 16.5);
  $('hl2').style.setProperty('--k', outCubic(p(t, 16.6, 17.0)));

  // S5: map unrolls, the dotted trail draws to the X, then the QR appears there
  const un = outCubic(p(t, 17.6, 18.1));
  $('map').style.clipPath = `inset(0 0 ${(1 - un) * 100}% 0)`;
  if (!TRAIL) { TRAIL = $('trail'); TRAIL.L = TRAIL.getTotalLength(); }
  const dp = p(t, 18.3, 20.0);
  TRAIL.style.strokeDasharray = `1 34`;
  TRAIL.setAttribute('d', TRAIL.getAttribute('d'));
  TRAIL.style.clipPath = 'none';
  TRAIL.style.strokeDashoffset = 0;
  TRAIL.style.opacity = 1;
  // reveal the dotted trail progressively with a mask path length
  TRAIL.style.strokeDasharray = dp >= 1 ? '1 34' : `${[...Array(Math.ceil(dp * TRAIL.L / 35))].map(() => '1 34').join(' ')} 0 ${TRAIL.L}`;
  $('needle').style.transform = `rotate(${Math.sin(t * 3) * 25 + (t - 17.6) * 40}deg)`;
  const x = back(p(t, 20.0, 20.25));
  $('xmark').style.transform = `scale(${x * (1 - p(t, 20.7, 21.0))}) rotate(-6deg)`;
  const q = back(p(t, 20.8, 21.3));
  $('qrbox').style.transform = `scale(${q}) rotate(${(1 - q) * 25}deg)`;
  $('qrbox').style.opacity = t >= 20.8 ? 1 : 0;
  $('mu').style.opacity = p(t, 21.3, 21.6); $('mu2').style.opacity = p(t, 21.5, 21.8);
  $('mt').style.opacity = p(t, 17.9, 18.2);
};
render(0);
</script>
</body>
</html>
