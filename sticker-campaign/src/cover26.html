<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@700&family=IBM+Plex+Sans+Arabic:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:clip; font-family:'IBM Plex Sans Arabic',sans-serif; color:#f1e4cf; }
  #stage { position:absolute; left:0; top:0; width:1080px; height:1920px; overflow:clip; background:radial-gradient(ellipse at 50% 50%, #5a2030 0%, #2a0c14 72%); }
  #grain { position:absolute; left:0; top:0; opacity:.3; mix-blend-mode:overlay; }
  .line { position:absolute; left:0; width:1080px; text-align:center; }
  .nk { font-family:'Noto Naskh Arabic',serif; font-weight:700; line-height:1.35; }
  .st { position:absolute; filter:drop-shadow(0 20px 24px rgba(0,0,0,.5)); }
  #env { position:absolute; left:170px; top:900px; width:740px; height:490px; }
  #envBack { position:absolute; left:0; top:0; width:740px; height:490px; background:#d9c3a0; border-radius:10px; box-shadow:0 40px 70px rgba(0,0,0,.6); }
  #flapO { position:absolute; left:0; top:-310px; width:740px; height:310px; background:linear-gradient(0deg,#e6d2b0,#d0b48a); clip-path:polygon(0 100%, 100% 100%, 50% 0); }
  #front { position:absolute; left:0; top:170px; width:740px; height:320px; background:linear-gradient(180deg,#eadbc0,#dcc6a2); clip-path:polygon(0 100%, 0 0, 50% 55%, 100% 0, 100% 100%); border-radius:0 0 10px 10px; }
  .badge { position:absolute; left:780px; top:1300px; width:230px; height:230px; border-radius:50%; background:#d6b27a; color:#2a0c14;
    box-shadow:0 0 0 8px #2a0c14, 0 0 0 12px #d6b27a, 0 24px 40px rgba(0,0,0,.5); transform:rotate(10deg); display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .badge b { font-family:'Noto Naskh Arabic'; font-size:92px; line-height:1.1; } .badge span { font-size:34px; }
</style></head><body>
<div id="stage">
  <svg id="grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="5"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .4  0 0 0 0 .35  0 0 0 .7 0"/></filter><rect width="1080" height="1920" filter="url(#n)"/></svg>
  <div class="line nk" style="top:200px; font-size:156px">رسالة…</div>
  <div class="line nk" style="top:400px; font-size:108px; color:#d6b27a">عمرها مية سنة</div>
  <div id="env">
    <div id="envBack"></div><div id="flapO"></div>
    <img class="st" src="eph/b22.png" style="left:60px; top:-300px; width:210px; transform:rotate(-14deg)">
    <img class="st" src="eph/b143.png" style="left:480px; top:-320px; width:210px; transform:rotate(12deg)">
    <img class="st" src="eph/b101.png" style="left:270px; top:-330px; width:200px; transform:rotate(-4deg)">
    <img class="st" src="eph/b98.png" style="left:110px; top:-150px; width:200px; transform:rotate(8deg)">
    <img class="st" src="eph/b21.png" style="left:450px; top:-170px; width:180px; transform:rotate(-8deg)">
    <img class="st" src="eph/b153.png" style="left:290px; top:-200px; width:170px; transform:rotate(4deg)">
    <div id="front"></div>
    <img class="st" src="eph/b18.png" style="left:290px; top:180px; width:160px; transform:rotate(-8deg)">
  </div>
  <img class="st" src="eph/b20.png" style="left:60px; top:690px; width:150px; transform:rotate(-20deg)">
  <img class="st" src="eph/b49.png" style="left:880px; top:760px; width:140px; transform:rotate(18deg)">
  <div class="badge"><b>١٤٩</b><span>ستيكر</span></div>
  <div class="line nk" style="top:1460px; font-size:104px">فتحناها…</div>
  <div class="line nk" style="top:1610px; font-size:60px; color:#d6b27a">ستيكرات إفيميرا فنتج · ملف PDF</div>
</div>
</body></html>
