<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Marhey:wght@500;700&family=Aref+Ruqaa:wght@700&family=Readex+Pro:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --sage:#8ea489; --sage-d:#5f7559; --paper:#fbf6ec; --ink:#2f3a2c; --coral:#e07a5f; --tape:rgba(246,226,170,.82); }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1080px; height:1920px; overflow:clip; font-family:'Readex Pro',sans-serif; color:var(--ink);
    background:var(--sage);
    background-image:radial-gradient(rgba(255,255,255,.28) 2.5px, transparent 3px); background-size:46px 46px; }
  #stage { position:absolute; inset:0; overflow:clip; }
  .scene { position:absolute; inset:0; overflow:clip; display:none; }
  .abs { position:absolute; }
  .title { font-family:'Marhey',sans-serif; font-weight:700; text-align:center; width:100%; line-height:1.15; color:var(--paper); text-shadow:0 6px 0 var(--sage-d); }
  .ruqaa { font-family:'Aref Ruqaa',serif; font-weight:700; }
  .polaroid { position:absolute; left:170px; top:560px; width:740px; background:var(--paper); padding:34px 34px 150px; box-shadow:0 30px 60px rgba(30,40,25,.35); transform-origin:50% -40px; }
  .polaroid img.ph { width:100%; height:640px; object-fit:cover; background:#d9c7b4; display:block; }
  .polaroid .cap { position:absolute; bottom:34px; left:0; right:0; text-align:center; font-family:'Aref Ruqaa',serif; font-weight:700; font-size:62px; color:var(--ink); }
  .tape { position:absolute; top:-30px; left:50%; width:240px; height:64px; margin-left:-120px; background:var(--tape); transform:rotate(-4deg);
          box-shadow:0 2px 4px rgba(0,0,0,.08); clip-path:polygon(3% 0,97% 4%,100% 50%,96% 100%,2% 96%,0 50%); }
  .tag { position:absolute; left:50%; transform:translateX(-50%); background:var(--coral); color:#fff; font-family:'Marhey'; font-weight:700; font-size:54px; padding:14px 46px; border-radius:16px; white-space:nowrap; box-shadow:0 8px 0 #b75c45; }
  .tw { font-family:'Readex Pro'; font-weight:700; font-size:58px; text-align:center; width:100%; color:var(--paper); }
  .spark { position:absolute; width:60px; height:60px; }
  .spark::before, .spark::after { content:''; position:absolute; left:50%; top:50%; background:#fff8dc; border-radius:50%; transform:translate(-50%,-50%); }
  .spark::before { width:100%; height:12%; } .spark::after { width:12%; height:100%; }
  .conf { position:absolute; width:150px; filter:drop-shadow(0 8px 10px rgba(0,0,0,.25)); }
  #leak { position:absolute; inset:-400px; pointer-events:none; mix-blend-mode:screen;
          background:radial-gradient(circle at 50% 50%, rgba(255,190,120,.55), rgba(255,140,90,.25) 25%, transparent 55%); }
  #grain { position:absolute; inset:0; pointer-events:none; opacity:.10; mix-blend-mode:multiply;
           background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
</style>
</head>
<body>
<div id="stage">

<!-- S1: hook -->
<div class="scene" id="s1">
  <div class="title abs" id="h1" style="top:640px; font-size:150px">مين يحتاج<br>ستيكرات؟</div>
  <div class="abs ruqaa" id="h2" style="top:1060px; width:100%; text-align:center; font-size:220px; color:var(--coral); text-shadow:0 8px 0 #9c4f3c">الكل!</div>
</div>

<!-- S2-S4: audiences -->
<div class="scene" id="s2">
  <div class="tag" style="top:300px">أصحاب المشاريع</div>
  <div class="polaroid" id="p1"><div class="tape"></div><img class="ph" src="stamps_body.png"><div class="cap">تغليف يلفت النظر</div></div>
</div>
<div class="scene" id="s3">
  <div class="tag" style="top:300px">المعلمين والمعلمات</div>
  <div class="polaroid" id="p2"><div class="tape"></div><img class="ph" src="botanical_body.png"><div class="cap">تحفيز وتزيين للدفاتر</div></div>
</div>
<div class="scene" id="s4">
  <div class="tag" style="top:300px">محبين الجورنال</div>
  <div class="polaroid" id="p3"><div class="tape"></div><img class="ph" src="journal_body.png"><div class="cap">صفحات ما تكون فاضية</div></div>
</div>

<!-- S5: all together -->
<div class="scene" id="s5">
  <div class="title abs" style="top:250px; font-size:120px">11 مجموعة فنتج</div>
  <div class="tw abs" id="tw" style="top:1500px; white-space:pre-line; line-height:1.5; z-index:10; text-shadow:0 4px 0 var(--sage-d)"></div>
</div>

<!-- S6: store -->
<div class="scene" id="s6">
  <div class="title abs" style="top:290px; font-size:140px">المتجر</div>
  <div class="abs ruqaa" style="top:470px; width:100%; text-align:center; font-size:72px; color:var(--paper)">الكود يوصلك للمتجر</div>
  <div class="polaroid" id="qr" style="left:240px; top:640px; width:600px; padding:30px 30px 110px">
    <div class="tape"></div><img src="qr_store.png" style="width:100%; display:block">
    <div class="cap" style="font-family:'Readex Pro'; font-size:44px; bottom:30px; direction:ltr">planme.zaher.io</div>
  </div>
</div>

<div id="leak"></div>
<div id="grain"></div>
</div>

<script>
const clamp = (x) => Math.min(1, Math.max(0, x));
const p = (t, a, b) => clamp((t - a) / (b - a));
const back = (x) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const outCubic = (x) => 1 - Math.pow(1 - x, 3);
const inCubic = (x) => x * x * x;
const $ = (id) => document.getElementById(id);

const SCENES = [['s1', 0, 2.6], ['s2', 2.6, 6.4], ['s3', 6.4, 10.2], ['s4', 10.2, 14.0], ['s5', 14.0, 18.0], ['s6', 18.0, 22.5]];

// sparkles around the hook
const SPARKS = [[160, 520, 0.2], [880, 600, 0.5], [120, 1250, 0.9], [900, 1180, 1.2], [520, 470, 1.5], [300, 1500, 1.8], [800, 1480, 0.7]]
  .map(([x, y, d]) => { const el = document.createElement('div'); el.className = 'spark'; Object.assign(el.style, { left: x + 'px', top: y + 'px' }); $('s1').appendChild(el); return { el, d }; });

// S5: three polaroids fanned + falling sticker confetti
const FAN = [['stamps_body', -14, -230], ['botanical_body', 0, 0], ['journal_body', 14, 230]].map(([src, r, x], i) => {
  const el = document.createElement('div'); el.className = 'polaroid';
  el.innerHTML = `<div class="tape"></div><img class="ph" src="${src}.png" style="height:420px">`;
  Object.assign(el.style, { left: '290px', top: '560px', width: '500px', padding: '24px 24px 90px' });
  $('s5').appendChild(el); return { el, r, x, at: 14.1 + i * 0.2 };
});
const CONF = ['heritage_2', 'roses_0', 'cozyhome_1', 'journal_0', 'cozyautumn_2', 'autumn_ar_3', 'ephemera_1', 'vintage_3', 'heritage_4', 'cozyhome_4']
  .map((n, i) => {
    const el = document.createElement('img'); el.src = `cut/${n}.png`; el.className = 'conf';
    el.style.left = (i % 2 ? 20 + (i * 37) % 110 : 900 - (i * 41) % 110) + 'px'; $('s5').appendChild(el);
    return { el, at: 14.6 + i * 0.22, spin: (i % 2 ? 1 : -1) * (120 + i * 20), drift: (i % 3 - 1) * 60 };
  });
const TW = 'ملف PDF · تحميل فوري\nتطبع كل ما احتجت';

function polaroid(el, t, a, b) {
  // drop in with a swing, then slide out to the side at the end of the scene
  const k = p(t, a, a + 0.55);
  const y = (1 - outCubic(k)) * -1400;
  const swing = Math.sin((t - a) * 5) * 7 * Math.exp(-(t - a) * 1.6);
  const out = inCubic(p(t, b - 0.35, b));
  el.style.transform = `translate(${out * 1300}px, ${y}px) rotate(${-3 + swing + out * 18}deg)`;
}

window.render = (t) => {
  SCENES.forEach(([id, a, b]) => { $(id).style.display = t >= a && t < b ? 'block' : 'none'; });

  // light leak drifts across the whole video
  $('leak').style.transform = `translate(${Math.sin(t * 0.45) * 520}px, ${Math.cos(t * 0.31) * 760}px)`;
  $('leak').style.opacity = 0.55 + 0.25 * Math.sin(t * 0.9);

  // S1
  $('h1').style.transform = `translateY(${(1 - back(p(t, 0, 0.5))) * 120}px)`;
  $('h1').style.opacity = p(t, 0, 0.25);
  const h2 = p(t, 1.1, 1.45);
  $('h2').style.opacity = h2 > 0 ? 1 : 0;
  $('h2').style.transform = `scale(${0.2 + 0.8 * back(h2)}) rotate(${-6 + 6 * h2}deg)`;
  SPARKS.forEach(({ el, d }) => {
    const s = Math.max(0, Math.sin((t - d) * 4));
    el.style.opacity = t > d ? s : 0; el.style.transform = `scale(${0.4 + s}) rotate(${t * 90}deg)`;
  });

  // S2-S4
  polaroid($('p1'), t, 2.6, 6.4);
  polaroid($('p2'), t, 6.4, 10.2);
  polaroid($('p3'), t, 10.2, 14.0);

  // S5
  FAN.forEach(({ el, r, x, at }) => {
    const k = back(p(t, at, at + 0.45));
    el.style.transform = `translate(${x * k}px, ${(1 - k) * 300}px) rotate(${r * k}deg) scale(${0.6 + 0.4 * k})`;
    el.style.opacity = p(t, at, at + 0.1);
  });
  CONF.forEach(({ el, at, spin, drift }) => {
    const k = p(t, at, at + 2.4);
    el.style.display = k > 0 && k < 1 ? '' : 'none';
    el.style.top = (-220 + k * 2300) + 'px';
    el.style.transform = `translateX(${Math.sin(k * 6) * drift}px) rotate(${k * spin}deg)`;
  });
  const n = Math.floor(p(t, 15.0, 16.6) * TW.length);
  $('tw').textContent = TW.slice(0, n) + (n < TW.length && t > 15 ? '|' : '');

  // S6
  const q = p(t, 18.1, 18.7);
  const qs = Math.sin((t - 18.1) * 5) * 6 * Math.exp(-(t - 18.1) * 1.5);
  $('qr').style.transform = `translateY(${(1 - outCubic(q)) * -1400}px) rotate(${t > 18.1 ? qs : 0}deg)`;
};
render(0);
</script>
</body>
</html>
