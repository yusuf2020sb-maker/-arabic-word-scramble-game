<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --warm:#ffd9a0; --amber:#ffb347; --txt:#fff4e2; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:clip; background:#000; font-family:'Changa',sans-serif; color:var(--txt); }
  #stage { position:absolute; left:0; top:0; width:1080px; height:1920px; overflow:clip; background:#000; }
  .abs { position:absolute; left:0; top:0; }
  .world { position:absolute; left:0; top:0; width:1080px; height:1920px; display:none; }
  .st { position:absolute; left:0; top:0; filter:drop-shadow(0 14px 16px rgba(0,0,0,.9)); }
  #dark { position:absolute; inset:0; z-index:30; pointer-events:none; }
  #warm { position:absolute; inset:0; z-index:31; pointer-events:none; mix-blend-mode:soft-light; }
  #dust { position:absolute; left:0; top:0; z-index:32; pointer-events:none; }
  .cap { position:absolute; left:0; top:150px; width:1080px; text-align:center; z-index:50; font-weight:800; font-size:104px; line-height:1.25; white-space:nowrap; }
  .cap .w { display:inline-block; margin:0 10px; }
  .cap .hl { color:var(--amber); }
  .lab { position:absolute; z-index:40; font-weight:700; font-size:66px; white-space:nowrap; color:var(--txt); text-shadow:0 0 18px rgba(255,180,80,.55), 0 4px 10px #000; }
  #cnt { position:absolute; left:0; top:300px; width:1080px; text-align:center; z-index:40; font-weight:800; font-size:290px; line-height:1; color:var(--amber); text-shadow:0 0 40px rgba(255,170,60,.6); }
  .sw { position:absolute; width:120px; height:120px; border-radius:50%; z-index:40; box-shadow:0 0 30px rgba(255,255,255,.15); border:5px solid rgba(255,255,255,.85); }
</style></head><body>
<div id="stage">
  <div class="world" id="wA"></div>
  <div class="world" id="wB"></div>
  <div class="world" id="wC"></div>
  <div class="world" id="wD"><img id="sheet" src="eph/sheet2.jpg" style="position:absolute; left:190px; top:500px; width:700px; border-radius:8px; box-shadow:0 30px 60px rgba(0,0,0,.8)"><img class="st" id="peel" src="eph/b25.png" style="width:220px; opacity:0"></div>
  <div class="world" id="wE"><img id="card" src="dur_card.png" style="position:absolute; left:200px; top:470px; width:680px; height:850px; border-radius:36px"></div>
  <canvas id="dust" width="1080" height="1920"></canvas>
  <div id="dark"></div>
  <div id="warm"></div>
  <div class="lab" id="l0" style="left:0; width:1080px; text-align:center">تذاكر قديمة</div>
  <div class="lab" id="l1" style="left:0; width:1080px; text-align:center">رسايل</div>
  <div class="lab" id="l2" style="left:0; width:1080px; text-align:center">طوابع وملصقات</div>
  <div id="cnt">٠</div>
  <div id="sws"></div>
  <div class="lab" id="lu0" style="left:0; width:1080px; text-align:center">جورنال</div>
  <div class="lab" id="lu1" style="left:0; width:1080px; text-align:center">سكرابوك</div>
  <div class="lab" id="lu2" style="left:0; width:1080px; text-align:center">هدايا</div>
  <div class="lab" id="avail" style="left:0; top:1400px; width:1080px; text-align:center; font-size:64px">متوفرة في</div>
  <div class="lab" id="storeN" style="left:0; top:1490px; width:1080px; text-align:center; font-size:150px; font-weight:800; color:var(--amber)">متجر دُر</div>
  <div class="cap" id="capbox"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const p = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eb = (x) => { const c = 1.7; return x <= 0 ? 0 : 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const R = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const lerp = (a, b, k) => a + (b - a) * k;
const AR = (n) => String(n).replace(/\d/g, (d) => '٠١٢٣٤٥٦٧٨٩'[d]);

const D = { h1: 0.3, h2: 1.9, c1: 3.8, c2: 5.0, c3: 6.2, count: 7.8, n2: 9.4, u0: 11.0, u1: 12.2, u2: 13.4, print: 15.0, print2: 16.2, brand: 18.2, store: 19.8, store2: 20.6, end_all: 23.6 };
const T = Object.assign({}, D, window.TL || {});

// A: a drawer of paper treasures scattered in the dark
const A = [['b25', 540, 980, 330, -6], ['b94', 260, 760, 240, 8], ['b9', 790, 1150, 280, -10], ['b98', 880, 860, 200, 12], ['b141', 650, 1290, 210, 6],
  ['b21', 330, 1430, 210, -8], ['b85', 170, 1240, 200, 6], ['b106', 520, 1560, 190, 10], ['b76', 830, 1500, 200, -5],
  ['b18', 160, 560, 170, 0], ['b20', 900, 600, 190, 15], ['b143', 560, 680, 170, -12], ['b87', 300, 1700, 230, 4], ['b135', 880, 1780, 170, -6], ['b88', 120, 980, 200, -15], ['b149', 960, 1320, 150, 0]];
$('wA').innerHTML = A.map(([n, x, y, w, r], i) => `<img class="st" id="a${i}" src="eph/${n}.png" style="width:${w}px; transform:translate(${x - w / 2}px,${y - w / 2}px) rotate(${r}deg)">`).join('');
const SPOT = [[400, 880, 330], [800, 1170, 330], [450, 1520, 330]]; // tickets, letters, stamps & labels

// B: five palettes, five columns
const PAL = [['#7a1f2b', ['b9', 'b18', 'b20', 'b21', 'b25', 'b13']], ['#5a3a24', ['b44', 'b48', 'b49', 'b47', 'b54', 'b59']], ['#b5652b', ['b85', 'b87', 'b94', 'b88', 'b80', 'b84']],
  ['#6f8fb8', ['b98', 'b104', 'b106', 'b107', 'b100', 'b108']], ['#7b5aa6', ['b135', 'b141', 'b143', 'b149', 'b157', 'b133']]];
$('wB').innerHTML = PAL.map(([c, L], col) => L.map((n, r) => `<img class="st" id="g${col}_${r}" src="eph/${n}.png" style="width:170px; height:170px; object-fit:contain; transform:translate(${820 - col * 190}px,${700 + r * 195}px)">`).join('')).join('');
$('sws').innerHTML = PAL.map(([c], i) => `<div class="sw" id="sw${i}" style="left:${850 - i * 190}px; top:560px; background:${c}"></div>`).join('');

// C: uses (journal, scrapbook page, gift box) stacked down the frame
$('wC').innerHTML = `
  <div class="abs" style="left:250px; top:470px; width:580px; height:400px; background:linear-gradient(90deg,#3b2416,#5a3722); border-radius:12px; box-shadow:0 20px 40px #000"><div class="abs" style="left:286px; top:0; width:8px; height:400px; background:#24150c"></div><div class="abs" style="left:300px; top:20px; width:260px; height:360px; background:#efe3cc"></div><div class="abs" style="left:20px; top:20px; width:260px; height:360px; background:#efe3cc"></div></div>
  <img class="st" src="eph/b25.png" style="width:200px; transform:translate(300px,520px) rotate(-6deg)"><img class="st" src="eph/b18.png" style="width:150px; transform:translate(600px,560px)"><img class="st" src="eph/b20.png" style="width:150px; transform:translate(620px,700px) rotate(10deg)">
  <div class="abs" style="left:230px; top:960px; width:620px; height:400px; background:#d9c7a7; border-radius:6px; box-shadow:0 20px 40px #000; rotate:2deg; background-image:repeating-linear-gradient(0deg, transparent 0 38px, rgba(120,90,60,.25) 38px 40px)"></div>
  <img class="st" src="eph/b94.png" style="width:170px; transform:translate(270px,990px) rotate(-8deg)"><img class="st" src="eph/b87.png" style="width:240px; transform:translate(450px,1040px) rotate(4deg)"><img class="st" src="eph/b106.png" style="width:150px; transform:translate(680px,1000px) rotate(8deg)">
  <div class="abs" style="left:300px; top:1460px; width:480px; height:330px; background:linear-gradient(160deg,#c49a6c,#8f6a42); border-radius:10px; box-shadow:0 20px 40px #000"></div>
  <div class="abs" style="left:520px; top:1460px; width:40px; height:330px; background:#7a1f2b"></div><div class="abs" style="left:300px; top:1600px; width:480px; height:40px; background:#7a1f2b"></div>
  <img class="st" src="eph/b141.png" style="width:190px; transform:translate(330px,1500px) rotate(-6deg)"><img class="st" src="eph/b149.png" style="width:130px; transform:translate(475px,1555px)">`;
const USE = [[540, 680], [540, 1160], [540, 1620]];

const LINES = () => [
  [T.h1, 'النور طاف...', [1]], [T.h2, 'بس شوفوا وش لقينا!', [3]],
  [T.c1, 'تذاكر قديمة،', [0]], [T.c2, 'رسايل،', [0]], [T.c3, 'وطوابع وملصقات!', [0]],
  [T.count, '١٤٩ ستيكر', [0]], [T.n2, 'بخمس ألوان!', [1]],
  [T.u0, 'للجورنال،', [0]], [T.u1, 'للسكرابوك،', [0]], [T.u2, 'ولتغليف الهدايا.', [1]],
  [T.print, 'ملف PDF', [1]], [T.print2, 'يتطبع ويتقص... بسهولة!', [2]],
  [T.brand, 'ستيكرات إفيميرا فنتج', [1]],
];
const ENDS = () => { const L = LINES(); return L.map((l, i) => (i === L.length - 1 ? 99 : i === 4 ? T.count - 0.3 : i === 6 ? T.u0 - 0.3 : i === 11 ? T.brand - 0.3 : L[i + 1][0] - 0.12)); };

// flashlight path: [time, x, y, radius]
const BEAM = () => [
  [0, 540, 980, 300], [T.h2 - 0.1, 540, 980, 300],
  [T.h2 + 0.3, 250, 700, 280], [T.h2 + 0.7, 850, 760, 280], [T.h2 + 1.1, 820, 1450, 280], [T.h2 + 1.5, 230, 1500, 280], [T.c1 - 0.3, 360, 1050, 300],
  [T.c1, ...SPOT[0]], [T.c2 - 0.25, ...SPOT[0]], [T.c2, ...SPOT[1]], [T.c3 - 0.25, ...SPOT[1]], [T.c3, ...SPOT[2]], [T.count - 0.3, ...SPOT[2]],
  [T.count, 540, 1100, 900], [T.u0 - 0.35, 540, 1100, 900],
  [T.u0, ...USE[0], 330], [T.u1 - 0.25, ...USE[0], 330], [T.u1, ...USE[1], 340], [T.u2 - 0.25, ...USE[1], 340], [T.u2, ...USE[2], 320], [T.print - 0.35, ...USE[2], 320],
  [T.print, 540, 1000, 380], [T.print2 - 0.2, 540, 1000, 420], [T.print2 + 0.3, 540, 1000, 1200], [T.brand - 0.35, 540, 1000, 1200],
  [T.brand, 540, 890, 470], [T.store - 0.2, 540, 890, 520], [T.store2 + 0.4, 540, 1100, 1300], [99, 540, 1100, 1300],
];
const beamAt = (t) => { const K = BEAM(); let i = 0; while (i < K.length - 2 && t >= K[i + 1][0]) i++;
  const [a, x0, y0, r0] = K[i], [b, x1, y1, r1] = K[i + 1]; const k = eio(p(t, a, b));
  return [lerp(x0, x1, k) + Math.sin(t * 2.3) * 10, lerp(y0, y1, k) + Math.sin(t * 1.7 + 1) * 8, lerp(r0, r1, k)]; };
// ambient light level (the power comes back for the count)
const ambient = (t) => {
  const on = (a) => { const k = p(t, a, a + 0.5); return k <= 0 ? 0 : k >= 1 ? 1 : [0.6, 0, 0.8, 0.1, 1][Math.floor(k * 5)]; };
  return Math.max(on(T.count - 0.25) * (1 - p(t, T.u0 - 0.4, T.u0 - 0.1)), on(T.print2 - 0.1) * (1 - p(t, T.brand - 0.4, T.brand - 0.1)), 0.75 * p(t, T.store2 + 0.2, T.store2 + 0.8)); };
const dctx = $('dust').getContext('2d');

window.render = (t) => {
  $('stage').style.opacity = 1 - p(t, T.end_all - 0.5, T.end_all);
  const sc = t < T.count - 0.3 ? 'A' : t < T.u0 - 0.35 ? 'B' : t < T.print - 0.35 ? 'C' : t < T.brand - 0.35 ? 'D' : 'E';
  ['A', 'B', 'C', 'D', 'E'].forEach((k) => ($(`w${k}`).style.display = k === sc ? 'block' : 'none'));
  const [bx, by, br] = beamAt(t); const amb = ambient(t);
  // tiny flicker of the torch
  const fl = 1 - 0.06 * (R(Math.floor(t * 24)) > 0.85 ? 1 : 0);
  $('dark').style.background = `radial-gradient(circle ${br}px at ${bx}px ${by}px, rgba(0,0,0,${0.02 + 0.05 * (1 - fl)}) 0%, rgba(0,0,0,${0.25 * (1 - amb)}) 55%, rgba(0,0,0,${0.97 * (1 - amb)}) 100%)`;
  $('warm').style.background = `radial-gradient(circle ${br * 1.05}px at ${bx}px ${by}px, rgba(255,200,120,${0.55 * (1 - amb * 0.7)}), transparent 70%)`;
  // dust in the beam
  dctx.clearRect(0, 0, 1080, 1920);
  for (let i = 0; i < 70; i++) { const a = R(i) * 6.283, rr = Math.sqrt(R(i + 50)) * br * 0.85;
    const x = bx + Math.cos(a + t * 0.15 * (R(i + 9) - 0.5)) * rr + Math.sin(t * 0.6 + i) * 12, y = by + Math.sin(a) * rr - ((t * 18 + i * 13) % 40);
    dctx.fillStyle = `rgba(255,230,190,${0.35 * R(i + 3) * (1 - amb)})`; dctx.beginPath(); dctx.arc(x, y, 1 + R(i + 7) * 2.2, 0, 7); dctx.fill(); }
  // A: gentle float; hero items pop when the beam lands
  A.forEach(([n, x, y, w, r], i) => { $(`a${i}`).style.translate = `0 ${Math.sin(t * 1.3 + i) * 5}px`; });
  [[0, 1], [2, 3, 4], [5, 6, 7, 8]].forEach((grp, gi) => { const c = [T.c1, T.c2, T.c3][gi]; const k = eb(p(t, c - 0.05, c + 0.35)) * (1 - p(t, c + 0.9, c + 1.3));
    grp.forEach((i) => ($(`a${i}`).style.scale = 1 + 0.12 * k)); });
  [T.c1, T.c2, T.c3].forEach((c, i) => { const e = $(`l${i}`); const nx = i === 2 ? T.count - 0.4 : [T.c2, T.c3][i] - 0.3; const k = Math.min(p(t, c, c + 0.2), 1 - p(t, nx, nx + 0.15));
    e.style.opacity = k; e.style.top = `${SPOT[i][1] + 230}px`; e.style.transform = `translateX(${SPOT[i][0] - 540}px) scale(${0.8 + 0.2 * eo(k)})`; });
  // B: count and the five palettes
  const ck = p(t, T.count - 0.1, T.count + 1.2); $('cnt').textContent = AR(Math.round(149 * eo(ck))); $('cnt').style.opacity = sc === 'B' ? p(t, T.count - 0.2, T.count) * (1 - p(t, T.n2 - 0.4, T.n2 - 0.15)) : 0;
  PAL.forEach((_, col) => { const st = T.n2 - 0.1 + col * 0.16; const k = p(t, st, st + 0.3); const s = $(`sw${col}`);
    s.style.opacity = sc === 'B' ? p(t, st, st + 0.1) : 0; s.style.transform = `scale(${0.4 + 0.6 * eb(k)})`;
    PAL[col][1].forEach((n, r) => { const e = $(`g${col}_${r}`); const a = T.count + 0.05 + (col * 6 + r) * 0.025; e.style.opacity = p(t, a, a + 0.1); e.style.scale = 0.6 + 0.4 * eb(p(t, a, a + 0.3));
      e.style.filter = t > T.n2 - 0.2 && t < T.u0 - 0.4 ? `drop-shadow(0 14px 16px rgba(0,0,0,.9)) brightness(${1 + 0.35 * Math.sin(Math.PI * k)})` : ''; }); });
  // C: labels follow the beam
  [T.u0, T.u1, T.u2].forEach((u, i) => { const e = $(`lu${i}`); const nx = [T.u1, T.u2, T.print][i] - 0.3; const k = Math.min(p(t, u, u + 0.2), 1 - p(t, nx, nx + 0.15)); e.style.opacity = k; e.style.top = `${USE[i][1] + [190, 190, 150][i]}px`; });
  // D: a sticker lifts off the printed sheet
  const pk = p(t, T.print2 + 0.3, T.print2 + 1.0); $('peel').style.opacity = pk > 0 ? 1 : 0;
  $('peel').style.transform = `translate(${260 + 90 * eo(pk)}px, ${560 - 180 * eo(pk)}px) rotate(${-10 * eo(pk)}deg) scale(${1 + 0.3 * eo(pk)})`;
  $('sheet').style.transform = `translateY(${(1 - eo(p(t, T.print - 0.35, T.print + 0.3))) * 200}px)`;
  // E
  $('card').style.transform = `scale(${0.9 + 0.1 * eo(p(t, T.brand - 0.35, T.brand + 0.3))})`;
  $('avail').style.opacity = p(t, T.store - 0.1, T.store + 0.15); $('storeN').style.opacity = p(t, T.store2 - 0.1, T.store2 + 0.05);
  $('storeN').style.transform = `scale(${0.7 + 0.3 * eb(p(t, T.store2 - 0.1, T.store2 + 0.3))})`;
  // captions: words switch on like a bulb
  const L = LINES(), E = ENDS(); let html = '';
  L.forEach(([s, text, hl], i) => {
    if (t < (i === 0 ? -1 : s - 0.1) || t >= E[i]) return;
    const ws = text.split(' '); const per = Math.min(0.2, 0.7 / ws.length);
    html = ws.map((w, j) => { const st = i === 0 ? -1 : s - 0.1 + j * per; const k = p(t, st, st + 0.25); if (k <= 0) return '';
      const on = k >= 1 ? 1 : [0.3, 0, 0.7, 0.2, 1][Math.floor(k * 5)];
      return `<span class="w${hl.includes(j) ? ' hl' : ''}" style="opacity:${on}; text-shadow:0 0 ${24 * on}px rgba(255,170,70,${0.7 * on}), 0 6px 14px #000">${w}</span>`; }).join(' ');
  });
  $('capbox').innerHTML = html; { let cur = L[0]; L.forEach((l) => { if (t >= l[0] - 0.1) cur = l; }); $('capbox').style.fontSize = Math.min(104, 1500 / cur[1].length) + 'px'; }
  $('capbox').style.opacity = sc === 'E' && t > T.store - 0.2 ? 1 - p(t, T.store - 0.2, T.store) : 1;
  $('capbox').style.top = sc === 'E' ? '230px' : '150px';
};
render(0);
</script>
</body></html>
