<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Changa:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root { --mus:#d9a441; --rust:#7d2a3a; --cream:#f3e7d6; --brown:#241726; --olive:#6f88a6; --wine:#5b3f78; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:clip; background:var(--brown); font-family:'Changa',sans-serif; }
  #stage { position:absolute; left:0; top:0; width:1080px; height:1920px; overflow:clip; }
  .scene { position:absolute; left:0; top:0; width:1080px; height:1920px; overflow:clip; display:none; }
  .abs { position:absolute; left:0; top:0; }
  .line { position:absolute; left:0; width:1080px; text-align:center; font-weight:900; line-height:1.1; white-space:nowrap; }
  .w { display:inline-block; }
  .st { position:absolute; left:0; top:0; filter:drop-shadow(0 14px 0 rgba(36,23,38,.25)); will-change:transform; }
  .ring { position:absolute; left:0; top:0; border-radius:50%; border:14px solid; }
  .dot { position:absolute; left:0; top:0; border-radius:50%; }
  .stripe { position:absolute; left:0; width:1080px; height:60px; }
  .panel { position:absolute; left:0; width:1080px; height:640px; overflow:hidden; }
  .panel .lab { position:absolute; top:250px; font-weight:800; font-size:108px; line-height:1.1; }
  .step { position:absolute; width:380px; height:380px; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .blob { position:absolute; left:0; top:0; }
  .tag { position:absolute; left:0; top:0; padding:12px 46px 22px; border-radius:60px; font-size:76px; font-weight:900; white-space:nowrap; }
  #qr { position:absolute; left:330px; top:760px; width:420px; height:420px; background:#fff; padding:26px; border-radius:36px; box-shadow:0 18px 0 rgba(36,23,38,.3); }
  #qr img { width:100%; height:100%; display:block; }
</style></head><body>
<div id="stage">

  <!-- S1 hook -->
  <div class="scene" id="s1" style="background:var(--mus)">
    <div id="rings"></div>
    <div id="burst"></div>
    <div class="line" style="top:660px; font-size:112px; color:var(--brown)"><span class="w" id="h1">الرسالة العادية…</span></div>
    <div class="line" style="top:860px; font-size:140px; color:var(--cream); -webkit-text-stroke:10px var(--brown); paint-order:stroke fill"><span class="w" id="h2">انتهى وقتها!</span></div>
  </div>

  <!-- S2 journal missing something -->
  <div class="scene" id="s2" style="background:var(--rust)">
    <div class="line" style="top:250px; font-size:130px; color:var(--cream)"><span class="w" id="j1">والظرف…</span></div>
    <div id="book" class="abs" style="left:190px; top:640px; width:700px; height:560px">
      <div class="abs" style="left:0; top:0; width:350px; height:560px; background:var(--cream); border-radius:24px 0 0 24px"></div>
      <div class="abs" style="left:350px; top:0; width:350px; height:560px; background:#fbf2e0; border-radius:0 24px 24px 0"></div>
      <div class="abs" style="left:345px; top:0; width:10px; height:560px; background:var(--brown); opacity:.3"></div>
      <div id="lines"></div>
    </div>
    <div class="line" style="top:770px; font-size:300px; color:var(--rust)"><span class="w" id="qm">؟</span></div>
    <div class="line" style="top:1320px; font-size:130px; color:var(--mus)"><span class="w" id="j2">يبي له لمسة</span></div>
  </div>

  <!-- S3 count with stripes -->
  <div class="scene" id="s3" style="background:var(--cream)">
    <div id="grid"></div>
    <div id="stripes"></div>
    <div class="line" style="top:600px; font-size:340px; color:var(--rust)"><span class="w" id="n41">١٤٩</span></div>
    <div class="line" style="top:1080px; font-size:120px; color:var(--brown)"><span class="w" id="n2">ستيكر فنتج</span></div>
  </div>

  <!-- S4 vertical slot panels -->
  <div class="scene" id="s4" style="background:var(--brown)"><div id="panels"></div></div>

  <!-- S5 print / cut / stick -->
  <div class="scene" id="s5" style="background:var(--olive)">
    <div id="steps"></div>
    <svg class="abs" width="1080" height="1920"><path id="path5" d="M 820 560 C 820 760, 260 760, 260 960 S 820 1160, 820 1360" fill="none" stroke="#f4e6cc" stroke-width="10" stroke-dasharray="26 22" stroke-linecap="round"/></svg>
    <div id="stepsTop"></div>
  </div>

  <!-- S6 uses on morphing blobs -->
  <div class="scene" id="s6" style="background:var(--cream)">
    <svg id="blobsvg" class="abs" width="1080" height="1920"><path id="blob" fill="#e3a33b"/></svg>
    <div id="uses"></div>
    <div class="line" style="top:240px; font-size:120px; color:var(--brown)"><span class="w" id="ucap">للجورنال</span></div>
  </div>

  <!-- S7 end ring -->
  <div class="scene" id="s7" style="background:var(--rust)">
    <div class="line" style="top:220px; font-size:120px; color:var(--cream)"><span class="w" id="e1">ستيكرات الإفيميرا</span></div>
    <div id="orbit"></div>
    <div id="qr"><img src="qr_store.png"></div>
    <div class="line" style="top:1500px; font-size:130px; color:var(--mus)"><span class="w" id="e2">في المتجر</span></div>
    <div class="line" style="top:1670px; font-size:52px; color:var(--cream); direction:ltr"><span class="w" id="e3">planme.zaher.io</span></div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const p = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eb = (x) => { const c = 2.2; return x <= 0 ? 0 : 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const el = (x) => x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - 0.75) * (2 * Math.PI) / 3) + 1;
const R = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

const D = { h1: 0.15, h2: 1.0, j1: 2.7, j2: 3.8, count: 5.2, k0: 8.2, k1: 9.2, k2: 10.2, s0: 11.4, s1: 12.2, s2: 13.0, u0: 14.4, u1: 15.6, u2: 16.8, brand: 18.2, store: 19.6, end_all: 22.0 };
const T = Object.assign({}, D, window.TL || {});
const CUT = [T.j1 - 0.2, T.count - 0.2, T.k0 - 0.2, T.s0 - 0.2, T.u0 - 0.2, T.brand - 0.2];
const IDS = ['s1', 's2', 's3', 's4', 's5', 's6', 's7'];
const WIPE = 0.45;

// slam text: big scale-in with overshoot + shake
const slam = (id, t, a) => { const k = p(t, a, a + 0.18); const s = k < 1 ? 2.6 - 1.6 * eio(k) : 1 + 0.06 * Math.sin((t - a - 0.18) * 30) * Math.exp(-(t - a - 0.18) * 8);
  const e = $(id); e.style.opacity = k > 0 ? 1 : 0; e.style.transform = `scale(${s}) rotate(${(1 - k) * -6}deg)`; };
const popin = (id, t, a) => { const k = el(p(t, a, a + 0.7)); const e = $(id); e.style.opacity = p(t, a, a + 0.08); e.style.transform = `scale(${k}) `; };
const slide = (id, t, a, dir = 1) => { const k = eo(p(t, a, a + 0.4)); const e = $(id); e.style.opacity = p(t, a, a + 0.1); e.style.transform = `translateX(${dir * (1 - k) * 700}px) skewX(${dir * (1 - k) * 20}deg)`; };
const place = (e, x, y, s, r, o) => { e.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`; if (o !== undefined) e.style.opacity = o; };
const mkimg = (host, n, w) => { const im = document.createElement('img'); im.className = 'st'; im.src = `eph/${n}.png`; im.style.width = w + 'px'; $(host).appendChild(im); return im; };
const mkdiv = (host, cls, css = '', html = '') => { const d = document.createElement('div'); d.className = cls; d.style.cssText = css; d.innerHTML = html; $(host).appendChild(d); return d; };

// S1 rings + leaf burst
const RINGS = [0, 1, 2].map((i) => mkdiv('rings', 'ring', `border-color:${['#7d2a3a', '#f3e7d6', '#5b3f78'][i]}`));
const BURST = ['b15', 'b16', 'b20', 'b49', 'b50', 'b143', 'b107', 'b18', 'b28', 'b29', 'b110', 'b149'].map((n) => mkimg('burst', n, 150));
// S2 lines in the journal
[...Array(8)].forEach((_, i) => mkdiv('lines', 'abs', `left:${i < 4 ? 40 : 390}px; top:${120 + (i % 4) * 100}px; width:270px; height:12px; border-radius:6px; background:#3a2117; opacity:.15; transform-origin:100% 50%`));
const LINES = [...$('lines').children];
// S3 stripes + grid
const STR = [...Array(32)].map((_, i) => mkdiv('stripes', 'stripe', `top:${i * 60}px; background:${['#d9a441', '#7d2a3a', '#6f88a6', '#5b3f78'][i % 4]}`));
const GRID = ['b9', 'b22', 'b24', 'b26', 'b36', 'b44', 'b47', 'b98', 'b101', 'b128', 'b141', 'b157'].map((n, i) => ({ im: mkimg('grid', n, 210), x: 60 + (i % 4) * 250, y: (i < 4 ? 80 : i < 8 ? 1330 : 1600) + (i % 2) * 30 }));
// S4 panels
const PAN = [['أختام شمع', 'b29', '#7d2a3a', '#f3e7d6'], ['فراشات', 'b143', '#5b3f78', '#f3e7d6'], ['فيونكات', 'b101', '#6f88a6', '#241726']].map(([w, n, bg, fg], i) => {
  const d = mkdiv('panels', 'panel', `top:${i * 640}px; background:${bg}`, `<img class="st" src="eph/${n}.png" style="width:270px; max-height:520px; object-fit:contain"><div class="lab" style="color:${fg}; ${i % 2 ? 'right:auto; left:80px' : 'right:80px'}"><span class="w">${w}</span></div>`);
  return { d, im: d.querySelector('img'), lab: d.querySelector('.lab span'), i };
});
// S5 steps
const STEPS = [['طباعة', 820, 560, '#d9a441'], ['قص', 260, 960, '#7d2a3a'], ['لصق', 820, 1360, '#f3e7d6']].map(([w, x, y, c], i) => {
  const d = mkdiv('steps', 'step', `left:${x - 190}px; top:${y - 190}px; background:${c}`);
  const img = document.createElement('img'); img.src = `eph/${['sheet2', 'b25', 'b141'][i]}.${i === 0 ? 'jpg' : 'png'}`; img.style.cssText = `width:${i === 0 ? 190 : 210}px; ${i === 0 ? 'border-radius:6px; box-shadow:0 8px 0 rgba(0,0,0,.2)' : ''}`;
  if (i === 1) img.style.outline = '6px dashed #3a2117', img.style.outlineOffset = '10px';
  d.appendChild(img);
  const tg = mkdiv('stepsTop', 'tag', `background:${i === 2 ? '#3a2117' : '#f4e6cc'}; color:${i === 2 ? '#f4e6cc' : '#3a2117'}`, `${w}`);
  return { d, tg, x, y, i };
});
// S6 uses
const USES = [
  { cap: 'للرسائل', col: '#d9a441', html: '<div class="abs" style="left:170px; top:700px; width:740px; height:500px; background:#f3e7d6; border-radius:18px; box-shadow:0 18px 0 rgba(36,23,38,.25)"></div><svg class="abs" width="1080" height="1920"><path d="M170 700 L540 960 L910 700" fill="none" stroke="#d6c3a5" stroke-width="8"/></svg>', st: [['b18', 440, 860, 200], ['b15', 220, 1000, 170], ['b143', 690, 1000, 170]] },
  { cap: 'للجورنال', col: '#7d2a3a', html: '<div class="abs" style="left:180px; top:640px; width:720px; height:560px; background:#fbf2e0; border-radius:24px; box-shadow:0 18px 0 rgba(36,23,38,.25)"></div><div class="abs" style="left:535px; top:640px; width:10px; height:560px; background:#241726; opacity:.25"></div>', st: [['b22', 230, 690, 200], ['b26', 610, 700, 190], ['b20', 400, 960, 170]] },
  { cap: 'ولتغليف الطلبات', col: '#6f88a6', html: '<div class="abs" style="left:170px; top:720px; width:740px; height:560px; background:#c9a173; border-radius:20px; box-shadow:0 18px 0 rgba(36,23,38,.25)"></div><div class="abs" style="left:170px; top:950px; width:740px; height:80px; background:#f4e6cc; opacity:.7"></div>', st: [['b98', 220, 780, 230], ['b101', 640, 760, 200]] },
].map((u, i) => {
  const host = mkdiv('uses', 'abs', 'width:1080px; height:1920px', u.html);
  u.ims = u.st.map(([n, x, y, w]) => { const im = document.createElement('img'); im.className = 'st'; im.src = `eph/${n}.png`; im.style.width = w + 'px'; host.appendChild(im); return { im, x, y }; });
  u.host = host; return u;
});
// S7 orbit
const ORB = ['b22', 'b18', 'b143', 'b101', 'b26', 'b98', 'b141', 'b36', 'b128', 'b149'].map((n) => mkimg('orbit', n, 160));

const blobPath = (t, cx, cy, r) => { let d = ''; const n = 8; const pts = [];
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; const rr = r * (1 + 0.12 * Math.sin(t * 2 + i * 1.7) + 0.06 * Math.sin(t * 3.3 + i)); pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * 1.25]); }
  for (let i = 0; i < n; i++) { const [x0, y0] = pts[i], [x1, y1] = pts[(i + 1) % n]; const mx = (x0 + x1) / 2, my = (y0 + y1) / 2; d += i === 0 ? `M ${mx} ${my} ` : ''; const [x2, y2] = pts[(i + 2) % n]; d += `Q ${x1} ${y1} ${(x1 + x2) / 2} ${(y1 + y2) / 2} `; }
  return d + 'Z'; };

window.render = (t) => {
  // scenes with circle-wipe overlap
  IDS.forEach((id, i) => {
    const a = i === 0 ? 0 : CUT[i - 1]; const b = i < CUT.length ? CUT[i] + WIPE : 99; const on = t >= a && t < b;
    const s = $(id); s.style.display = on ? 'block' : 'none'; s.style.zIndex = i;
    if (i > 0) { const k = eio(p(t, a, a + WIPE)); s.style.clipPath = k < 1 ? `circle(${k * 1150}px at ${i % 2 ? 540 : 540}px ${i % 2 ? 1920 : 0}px)` : 'none'; }
  });
  const end = p(t, T.end_all - 0.4, T.end_all); $('stage').style.opacity = 1 - end;

  // S1
  if (t < CUT[0] + WIPE) {
    slam('h1', t, T.h1); popin('h2', t, T.h2);
    RINGS.forEach((r, i) => { const k = eo(p(t, T.h1 + 0.15 + i * 0.12, T.h1 + 1.2 + i * 0.12)); const s = k * 1700; r.style.width = r.style.height = s + 'px'; r.style.transform = `translate(${540 - s / 2}px, ${860 - s / 2}px)`; r.style.opacity = 1 - k; r.style.borderWidth = (30 * (1 - k) + 4) + 'px'; });
    BURST.forEach((im, i) => { const a0 = T.h2 + 0.05; const k = eo(p(t, a0, a0 + 0.9)); const ang = i / 12 * Math.PI * 2 + 0.3; const r = 120 + k * (380 + R(i) * 120);
      place(im, 540 + Math.cos(ang) * r - 85, 980 + Math.sin(ang) * r * 1.5 - 85, Math.min(1, k * 2), (t - a0) * 180 * (i % 2 ? 1 : -1), k > 0 ? 1 : 0); });
  }
  // S2
  if (t >= CUT[0] && t < CUT[1] + WIPE) {
    slide('j1', t, T.j1, 1);
    const bk = el(p(t, CUT[0] + 0.15, CUT[0] + 0.9)); $('book').style.transform = `scale(${bk})`;
    LINES.forEach((l, i) => { l.style.transform = `scaleX(${eo(p(t, CUT[0] + 0.5 + i * 0.05, CUT[0] + 0.8 + i * 0.05))})`; });
    popin('qm', t, CUT[0] + 0.8); $('qm').style.transform += ` rotate(${Math.sin(t * 6) * 8}deg)`;
    slam('j2', t, T.j2 - 0.05);
  }
  // S3
  if (t >= CUT[1] && t < CUT[2] + WIPE) {
    const a = CUT[1];
    STR.forEach((s, i) => { const k = eio(p(t, a + 0.2 + (i % 8) * 0.02, a + 0.6 + (i % 8) * 0.02)); const out = eio(p(t, a + 0.7 + (i % 8) * 0.02, a + 1.1 + (i % 8) * 0.02));
      s.style.transform = `translateX(${(i % 2 ? 1 : -1) * ((1 - k) * 1100 + out * 1100)}px)`; });
    const n = Math.round(149 * eo(p(t, a + 0.7, a + 1.6))); $('n41').textContent = n.toLocaleString('ar-EG');
    const nk = el(p(t, a + 0.7, a + 1.4)); $('n41').style.transform = `scale(${nk})`; $('n41').style.opacity = p(t, a + 0.7, a + 0.8);
    slide('n2', t, T.count + 0.6, -1);
    GRID.forEach(({ im, x, y }, i) => { const k = el(p(t, a + 1.1 + i * 0.06, a + 1.8 + i * 0.06)); place(im, x, y, k, (R(i) - 0.5) * 16, k > 0 ? 1 : 0); });
  }
  // S4
  if (t >= CUT[2] && t < CUT[3] + WIPE) {
    const at = [T.k0 - 0.15, T.k1 - 0.15, T.k2 - 0.15];
    PAN.forEach(({ d, im, lab, i }) => {
      const k = eio(p(t, at[i], at[i] + 0.4)); d.style.transform = `translateY(${(1 - k) * (i % 2 ? -1 : 1) * 700}px)`; d.style.opacity = t >= at[i] ? 1 : 0;
      const sk = el(p(t, at[i] + 0.2, at[i] + 0.9)); place(im, i % 2 ? 700 : 90, 70 + Math.sin(t * 3 + i) * 8, sk, (i - 1) * 8 + Math.sin(t * 2 + i) * 3);
      const lk = eb(p(t, at[i] + 0.25, at[i] + 0.6)); lab.style.transform = `scale(${lk})`; lab.style.opacity = p(t, at[i] + 0.25, at[i] + 0.3);
    });
  }
  // S5
  if (t >= CUT[3] && t < CUT[4] + WIPE) {
    const at = [T.s0 - 0.1, T.s1 - 0.1, T.s2 - 0.1]; const path = $('path5'); const L = path.getTotalLength();
    path.style.strokeDashoffset = 0; path.setAttribute('stroke-dasharray', `${L * eio(p(t, at[0], at[2] + 0.3))} ${L}`);
    STEPS.forEach(({ d, tg, x, y, i }) => {
      const k = el(p(t, at[i], at[i] + 0.7)); d.style.transform = `scale(${k}) rotate(${Math.sin(t * 2 + i) * 4}deg)`; d.style.opacity = p(t, at[i], at[i] + 0.06);
      const tk = eb(p(t, at[i] + 0.15, at[i] + 0.5)); place(tg, x - (i === 1 ? -200 : 420), y - 60, tk, (i - 1) * -6, p(t, at[i] + 0.15, at[i] + 0.2));
    });
  }
  // S6
  if (t >= CUT[4] && t < CUT[5] + WIPE) {
    const at = [CUT[4] + 0.1, T.u1 - 0.2, T.u2 - 0.2]; const st = t < at[1] ? 0 : t < at[2] ? 1 : 2;
    const morph = eio(p(t, at[st], at[st] + 0.4));
    $('blob').setAttribute('d', blobPath(t, 540, 1000, 420 + morph * 0 + 30 * Math.sin(t * 2)));
    $('blob').setAttribute('fill', USES[st].col);
    $('ucap').textContent = USES[st].cap; slam('ucap', t, at[st] + 0.1);
    USES.forEach((u, i) => {
      u.host.style.display = i === st ? 'block' : 'none';
      const hk = el(p(t, at[i], at[i] + 0.7)); u.host.style.transform = `scale(${hk})`; u.host.style.transformOrigin = '540px 1000px';
      u.ims.forEach(({ im, x, y }, j) => { const s0 = at[i] + 0.35 + j * 0.18; const k = el(p(t, s0, s0 + 0.6)); place(im, x, y, k, (j - 1) * 10, k > 0 ? 1 : 0); });
    });
  }
  // S7
  if (t >= CUT[5]) {
    const a = CUT[5]; slam('e1', t, a + 0.15); popin('e2', t, T.store - 0.05); slide('e3', t, T.store + 0.3, 1);
    ORB.forEach((im, i) => { const ang = i / ORB.length * Math.PI * 2 + (t - a) * 0.8; const k = el(p(t, a + 0.2 + i * 0.05, a + 0.9 + i * 0.05));
      place(im, 540 + Math.cos(ang) * 410 * k - 75, 970 + Math.sin(ang) * 330 * k - 130, k, Math.sin(t * 2 + i) * 12); });
    const q = el(p(t, a + 0.5, a + 1.3)); $('qr').style.transform = `scale(${q})`; $('qr').style.opacity = p(t, a + 0.5, a + 0.6);
  }
};
render(0);
</script>
</body></html>
