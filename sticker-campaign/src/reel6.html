<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@300;700;800&family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --wall:#efe9df; --wall-d:#d9d0c2; --ink:#1f1b16; --muted:#7a6f61; --brass:#b08d57; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1080px; height:1920px; overflow:clip; font-family:'Noto Kufi Arabic',sans-serif; color:var(--ink); }
  #stage { position:absolute; inset:0; overflow:clip; background:var(--wall);
    background-image:radial-gradient(rgba(0,0,0,.025) 1px, transparent 1px); background-size:7px 7px; }
  #floor { position:absolute; left:0; right:0; top:1560px; bottom:0; background:linear-gradient(#cdbfa9, #b9a88f); border-top:10px solid #a8957a; }
  .scene { position:absolute; inset:0; overflow:clip; display:none; }
  .abs { position:absolute; }
  .center { width:100%; text-align:center; }
  /* framed exhibit */
  .frame { position:absolute; left:0; top:0; width:520px; height:640px; background:#fff; border:16px solid var(--ink);
           box-shadow:0 28px 40px rgba(31,27,22,.28), inset 0 0 0 2px #e7e1d6; display:flex; align-items:center; justify-content:center; }
  .frame img { width:80%; height:80%; object-fit:contain; filter:drop-shadow(0 8px 10px rgba(0,0,0,.18)); }
  .label { position:absolute; left:0; top:0; width:330px; background:#fbf8f2; border:1px solid var(--wall-d); padding:14px 20px; font-family:'Noto Naskh Arabic',serif; box-shadow:0 4px 8px rgba(0,0,0,.08); }
  .label b { display:block; font-size:34px; font-weight:700; }
  .label span { font-size:24px; color:var(--muted); }
  .spot { position:absolute; left:0; top:0; width:760px; height:1100px; pointer-events:none; mix-blend-mode:multiply;
          background:radial-gradient(ellipse 50% 46% at 50% 44%, transparent 0 60%, rgba(31,27,22,.0) 61%); }
  .lamp { position:absolute; left:0; top:0; width:160px; height:24px; background:var(--ink); border-radius:12px; }
  .beam { position:absolute; left:0; top:0; width:760px; height:1000px; pointer-events:none; mix-blend-mode:screen;
          background:radial-gradient(ellipse 48% 52% at 50% 0%, rgba(255,246,222,.85), rgba(255,240,205,.25) 55%, transparent 75%); }
  #dark { position:absolute; inset:0; background:#1f1b16; pointer-events:none; }
  /* masked line reveal */
  .mask { overflow:hidden; display:block; }
  .mask > span { display:inline-block; }
  .h { font-weight:800; font-size:96px; line-height:1.35; }
  .sub { font-weight:300; font-size:52px; color:var(--muted); }
  .room { font-weight:700; font-size:68px; color:var(--ink); border-top:3px solid var(--ink); border-bottom:3px solid var(--ink); padding:4px 40px; }
  #ped { position:absolute; left:300px; top:1240px; width:480px; height:420px; background:linear-gradient(90deg, #f7f3ec, #e4ddd1); border:2px solid var(--wall-d); }
</style>
</head>
<body>
<div id="stage">
<div id="floor"></div>

<!-- S1: three framed pieces, lights switch on -->
<div class="scene" id="s1">
  <div class="abs center" style="top:230px"><span class="mask"><span class="h" id="t1">هذي مو لوحات…</span></span></div>
</div>

<!-- S2: macro push into the middle piece -->
<div class="scene" id="s2">
  <div class="abs" id="macro" style="left:0; top:0; width:1080px; height:1920px; transform-origin:540px 900px"></div>
  <div class="abs" style="left:110px; right:110px; top:1470px; z-index:5; text-align:center; background:var(--wall); padding:26px 0 30px; box-shadow:0 10px 30px rgba(0,0,0,.12)">
    <span class="mask"><span class="h" id="t2a" style="font-size:84px">هذي ستيكرات</span></span>
    <span class="mask"><span class="sub" id="t2b" style="color:var(--ink)">تطبعها في بيتك</span></span>
  </div>
</div>

<!-- S3: walk along the gallery wall -->
<div class="scene" id="s3">
  <div class="abs" id="wall" style="left:0; top:0; width:9000px; height:1920px"></div>
  <div class="abs center" style="top:200px"><span class="mask"><span class="room" id="room"></span></span></div>
</div>

<!-- S4: statement -->
<div class="scene" id="s4">
  <div class="abs center" style="top:620px">
    <span class="mask"><span class="h" id="t4a">كل قطعة</span></span>
    <span class="mask"><span class="h" id="t4b" style="color:var(--brass)">ملف PDF مستقل</span></span>
    <span class="mask" style="margin-top:30px"><span class="sub" id="t4c">تحميل فوري · وتطبعها كل ما احتجت</span></span>
  </div>
</div>

<!-- S5: the last exhibit, the store -->
<div class="scene" id="s5">
  <div class="abs center" style="top:200px"><span class="mask"><span class="room" id="t5a">القطعة الأخيرة</span></span></div>
  <div class="abs center" style="top:280px"><span class="mask"><span class="h" id="t5b">المتجر</span></span></div>
  <div class="frame" id="qrframe" style="width:560px; height:620px; border-color:var(--brass)"><img src="qr_store.png" style="width:86%; height:86%; filter:none"></div>
  <div id="ped"></div>
  <div class="label" id="qrlabel" style="width:420px; text-align:center"><b style="direction:ltr">planme.zaher.io</b><span>الكود يوصلك للمتجر</span></div>
</div>

<div id="dark"></div>
</div>

<script>
const clamp = (x) => Math.min(1, Math.max(0, x));
const p = (t, a, b) => clamp((t - a) / (b - a));
const outCubic = (x) => 1 - Math.pow(1 - x, 3);
const inOut = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const outQuint = (x) => 1 - Math.pow(1 - x, 5);
const $ = (id) => document.getElementById(id);

const SCENES = [['s1', 0, 3.2], ['s2', 3.2, 6.0], ['s3', 6.0, 14.2], ['s4', 14.2, 17.4], ['s5', 17.4, 22.0]];

// one exhibit: lamp + light beam + frame + museum label, placed at (x, y) in its parent
function exhibit(parent, src, title, x, y) {
  const lamp = document.createElement('div'); lamp.className = 'lamp';
  const beam = document.createElement('div'); beam.className = 'beam';
  const fr = document.createElement('div'); fr.className = 'frame'; fr.innerHTML = `<img src="cut3/${src}.png">`;
  const lb = document.createElement('div'); lb.className = 'label'; lb.innerHTML = `<b>${title}</b><span>ملف PDF · جاهز للطباعة</span>`;
  lamp.style.transform = `translate(${x + 180}px, ${y - 120}px)`;
  beam.style.transform = `translate(${x - 120}px, ${y - 110}px)`;
  fr.style.transform = `translate(${x}px, ${y}px)`;
  lb.style.transform = `translate(${x + 95}px, ${y + 690}px)`;
  [beam, lamp, fr, lb].forEach((e) => parent.appendChild(e));
  return { lamp, beam, fr, lb, x, y };
}
// smooth line reveal from under a mask
function reveal(el, t, at) { const k = outQuint(p(t, at, at + 0.6)); el.style.transform = `translateY(${(1 - k) * 110}%)`; el.style.opacity = k > 0 ? 1 : 0; }

// S1: three pieces side by side (smaller)
const S1 = [['vases_p11', 'مزهرية حمراء'], ['cozyautumn_p115', 'عصفور الفطر'], ['stamps_p38', 'طابع وردة']].map(([src, title], i) => {
  const e = exhibit($('s1'), src, title, 0, 0);
  return { ...e, i };
});
// S2: the bird, big, for the macro push
const HERO = exhibit($('macro'), 'cozyautumn_p115', 'عصفور الفطر', 280, 420);

// S3: the long wall, grouped in rooms
const ROOMS = ['ورود', 'طوابع', 'تراث', 'خريف'];
const WALL = [
  ['roses_p23', 'وردة عتيقة'], ['botanical_p37', 'صندوق توليب'], ['vases_p15', 'مزهرية الخزامى'],
  ['stamps_p6', 'طابع نرجس'], ['stamps_p22', 'طابع أزهار'], ['ephemera_p149', 'ختم الخزامى'],
  ['heritage_p18', 'إسطرلاب'], ['heritage_p40', 'قارورة عطر'], ['heritage_p51', 'لوح كيرم'],
  ['cozyautumn_p42', 'كوخ الغابة'], ['botanical_p17', 'باقة أقحوان'], ['vintage_p23', 'كتاب مفتوح'],
].map(([src, title], i) => exhibit($('wall'), src, title, 280 + i * 700, 520));

window.render = (t) => {
  SCENES.forEach(([id, a, b]) => { $(id).style.display = t >= a && t < b ? 'block' : 'none'; });

  // fade from dark at the start, and short dips to dark between scenes
  const cuts = [3.2, 6.0, 14.2, 17.4];
  const dip = Math.max(0, ...cuts.map((c) => 1 - Math.abs(t - c) / 0.18));
  $('dark').style.opacity = Math.max(1 - p(t, 0, 0.5), dip * 0.9);

  // S1: frames at 0.62 scale, lights switch on one by one
  S1.forEach(({ lamp, beam, fr, lb, i }) => {
    const x = 40 + i * 340, y = 700;
    const s = 0.6;
    const on = t > 0.4 + i * 0.45;
    const hang = outCubic(p(t, 0.2 + i * 0.15, 0.7 + i * 0.15));
    fr.style.transform = `translate(${x}px, ${y - (1 - hang) * 80}px) scale(${s}) rotate(${(1 - hang) * (i - 1) * 4}deg)`;
    fr.style.transformOrigin = '0 0';
    lb.style.transform = `translate(${x + 60}px, ${y + 410}px) scale(${s})`; lb.style.transformOrigin = '0 0';
    lamp.style.transform = `translate(${x + 100}px, ${y - 80}px) scale(${s})`; lamp.style.transformOrigin = '0 0';
    beam.style.transform = `translate(${x - 70}px, ${y - 70}px) scale(${s})`; beam.style.transformOrigin = '0 0';
    beam.style.opacity = on ? 1 : 0;
    fr.style.filter = on ? 'none' : 'brightness(.55)';
  });
  $('s1').style.background = `rgba(31,27,22,${0.55 - 0.55 * p(t, 0.4, 1.8)})`;
  reveal($('t1'), t, 1.7);

  // S2: slow push into the bird with the background blurring
  const z = inOut(p(t, 3.2, 5.6));
  $('macro').style.transform = `scale(${1 + z * 1.7}) translateY(${z * 40}px)`;
  HERO.lb.style.opacity = 1 - z;
  $('stage').style.backgroundColor = '';
  reveal($('t2a'), t, 4.0);
  reveal($('t2b'), t, 4.45);

  // S3: camera walks the wall; each lamp turns on as it reaches the centre
  const pan = inOut(p(t, 6.1, 14.0));
  const off = 280 + 0 - 280 + pan * (11 * 700);
  $('wall').style.transform = `translateX(${-off}px) translateY(${Math.sin(t * 2.2) * 6}px)`;
  WALL.forEach((e, i) => {
    const sx = e.x - off + 260;
    const near = 1 - Math.min(1, Math.abs(sx - 540) / 620);
    e.beam.style.opacity = near > 0.35 ? 1 : 0.15;
    e.fr.style.filter = `brightness(${0.75 + 0.25 * Math.min(1, near * 2)})`;
    e.fr.style.transform = `translate(${e.x}px, ${e.y}px) rotate(${Math.sin(t * 1.3 + i) * 0.6}deg)`;
  });
  const ri = Math.min(3, Math.floor(pan * 4 * 0.999));
  if ($('room').textContent !== ROOMS[ri]) $('room').textContent = ROOMS[ri];
  const roomStart = 6.1 + (ri / 4) * 7.9 * 0.5 + (ri ? 0.6 : 0);
  reveal($('room'), t, ri === 0 ? 6.3 : 6.1 + [0, 2.35, 4.3, 6.2][ri]);

  // S4
  reveal($('t4a'), t, 14.4);
  reveal($('t4b'), t, 14.8);
  reveal($('t4c'), t, 15.5);

  // S5: QR frame drops onto the wall above a pedestal, light comes up
  const q = outCubic(p(t, 17.5, 18.1));
  $('qrframe').style.transform = `translate(260px, ${560 - (1 - q) * 120}px)`;
  $('qrframe').style.opacity = q;
  $('qrlabel').style.transform = `translate(330px, ${1300 + (1 - p(t, 18.3, 18.7)) * 40}px)`;
  $('qrlabel').style.opacity = p(t, 18.3, 18.7);
  $('s5').style.background = `radial-gradient(ellipse 45% 40% at 50% 38%, rgba(255,246,222,${0.9 * p(t, 17.6, 18.6)}), transparent 70%)`;
  reveal($('t5a'), t, 17.6);
  reveal($('t5b'), t, 17.9);
};
render(0);
</script>
</body>
</html>
