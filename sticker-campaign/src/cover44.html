<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=VT323&display=swap" rel="stylesheet">
<style>
  :root { --desk:#2f6f6a; --win:#ece4d4; --hi:#fffaf0; --lo:#4a3a2e; --tb1:#5a3a22; --tb2:#c07a3e; --red:#d8432f; --cream:#fff6e6; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:clip; background:var(--desk); font-family:'Cairo',sans-serif; color:#2b1d14; }
  #stage { position:absolute; left:0; top:0; width:1080px; height:1920px; overflow:clip; }
  #desk { position:absolute; left:0; top:0; width:1080px; height:1920px; background-color:var(--desk); background-image:linear-gradient(45deg, rgba(0,0,0,.06) 25%, transparent 25%, transparent 75%, rgba(0,0,0,.06) 75%), linear-gradient(45deg, rgba(0,0,0,.06) 25%, transparent 25%, transparent 75%, rgba(0,0,0,.06) 75%); background-size:8px 8px; background-position:0 0, 4px 4px; }
  #scan { position:absolute; left:0; top:0; width:1080px; height:1920px; background:repeating-linear-gradient(180deg, rgba(0,0,0,.05) 0 2px, transparent 2px 5px); pointer-events:none; z-index:90; }
  .scene { position:absolute; left:0; top:0; width:1080px; height:1920px; display:none; }
  .abs { position:absolute; left:0; top:0; }
  .win { position:absolute; left:0; top:0; background:var(--win); border:5px solid; border-color:var(--hi) var(--lo) var(--lo) var(--hi); box-shadow:10px 10px 0 rgba(0,0,0,.35); transform-origin:50% 50%; will-change:transform; }
  .tb { height:74px; background:linear-gradient(270deg, var(--tb1), var(--tb2)); color:#fff; font-size:38px; font-weight:900; padding:0 22px; display:flex; align-items:center; justify-content:space-between; white-space:nowrap; }
  .tb .x { width:50px; height:46px; background:var(--win); border:4px solid; border-color:var(--hi) var(--lo) var(--lo) var(--hi); color:#2b1d14; font:900 34px/38px sans-serif; text-align:center; }
  .bd { position:relative; padding:30px; }
  .btn3 { display:inline-block; background:var(--win); border:5px solid; border-color:var(--hi) var(--lo) var(--lo) var(--hi); padding:4px 50px 12px; font-weight:900; }
  .pix { font-family:'VT323', monospace; direction:ltr; }
  .line { position:absolute; left:0; width:1080px; text-align:center; font-weight:900; line-height:1.3; white-space:nowrap; }
  .w { display:inline-block; }
  .st { position:absolute; left:0; top:0; filter:drop-shadow(0 10px 10px rgba(0,0,0,.3)); will-change:transform; }
  .icon { position:absolute; width:170px; text-align:center; color:#fff; font-size:30px; font-weight:700; text-shadow:2px 2px 0 #000; }
  .folder { width:110px; height:84px; margin:0 auto 6px; background:#f0c24a; border:4px solid #7a5a12; border-radius:4px 14px 4px 4px; position:relative; }
  .folder:before { content:''; position:absolute; right:-4px; top:-22px; width:50px; height:22px; background:#f0c24a; border:4px solid #7a5a12; border-bottom:none; border-radius:8px 8px 0 0; }
  .bar { height:56px; border:5px solid; border-color:var(--lo) var(--hi) var(--hi) var(--lo); background:#fff; padding:5px; }
  .bar i { display:block; height:100%; background:repeating-linear-gradient(90deg, var(--tb1) 0 34px, transparent 34px 42px); }
  #cursor { position:absolute; left:0; top:0; width:70px; z-index:80; filter:drop-shadow(3px 3px 0 rgba(0,0,0,.4)); }
  #ring { position:absolute; left:0; top:0; width:120px; height:120px; border-radius:50%; border:8px solid #fff; z-index:79; }
  #taskbar { position:absolute; left:0; top:1800px; width:1080px; height:120px; background:var(--win); border-top:5px solid var(--hi); z-index:70; }
  .cf { position:absolute; left:0; top:0; width:22px; height:22px; }
</style></head><body>
<div id="stage"><div id="desk"></div>
  <div class="win" style="left:40px; top:60px; width:560px; transform:rotate(-3deg)"><div class="tb"><span>تنبيه</span><span class="x">✕</span></div><div class="bd" style="height:120px"><div style="font-size:50px; font-weight:900; color:var(--red)">✕ ما فيه قهوة</div></div></div>
  <div class="win" style="left:480px; top:150px; width:560px; transform:rotate(3deg)"><div class="tb"><span>تنبيه</span><span class="x">✕</span></div><div class="bd" style="height:120px"><div style="font-size:50px; font-weight:900; color:var(--red)">✕ ما فيه قهوة</div></div></div>
  <div class="win" style="left:40px; top:360px; width:1000px">
    <div class="tb"><span>تنبيه</span><span class="x">✕</span></div>
    <div class="bd" style="height:500px">
      <div style="position:absolute; right:40px; top:40px; width:150px; height:150px; border-radius:50%; background:var(--red); color:#fff; font:900 110px/150px sans-serif; text-align:center; border:6px solid #8a1e12">✕</div>
      <div style="position:absolute; right:215px; top:20px; font-size:112px; font-weight:900; white-space:nowrap">خطأ في النظام!</div>
      <div style="position:absolute; left:0; top:230px; width:930px; text-align:center; font-size:96px; font-weight:900; white-space:nowrap; color:var(--red)">السبب: ما فيه قهوة</div>
      <div style="position:absolute; left:0; top:385px; width:930px; text-align:center"><span class="btn3" style="font-size:40px">موافق</span></div>
    </div>
  </div>
  <img class="st" src="coffee/p33.png" style="left:70px; top:960px; width:290px; transform:rotate(-8deg)">
  <img class="st" src="coffee/p49.png" style="left:420px; top:1000px; width:300px; transform:rotate(5deg)">
  <img class="st" src="coffee/p54.png" style="left:740px; top:920px; width:290px; transform:rotate(8deg)">
  <div class="win" style="left:90px; top:1300px; width:900px">
    <div class="tb"><span>📁 ستيكرات قهوة وميمز</span><span class="x">✕</span></div>
    <div class="bd" style="height:370px; text-align:center">
      <div style="font-size:74px; font-weight:900; white-space:nowrap; color:var(--tb1); line-height:1.4">١١٤ ستيكر قهوة وميمز</div>
      <div style="margin-top:20px"><span class="btn3" style="font-size:72px; padding:0 50px 16px">متوفرة في متجر دُر</span></div>
    </div>
  </div>
  <svg style="position:absolute; left:200px; top:1640px; width:80px; z-index:80; filter:drop-shadow(3px 3px 0 rgba(0,0,0,.4))" viewBox="0 0 24 36"><path d="M2 2 L2 28 L8 22 L12 33 L17 31 L13 20 L21 20 Z" fill="#fff" stroke="#000" stroke-width="2" stroke-linejoin="round"/></svg>
  <div id="taskbar">
    <div class="btn3" style="position:absolute; right:20px; top:18px; font-size:42px; padding:0 34px 6px">☕ ابدأ</div>
    <div style="position:absolute; left:20px; top:18px; width:220px; height:80px; border:5px solid; border-color:var(--lo) var(--hi) var(--hi) var(--lo); font-size:40px; font-weight:900; text-align:center; line-height:66px">٩ ص</div>
  </div>
  <div id="scan"></div>
</div></body></html>
