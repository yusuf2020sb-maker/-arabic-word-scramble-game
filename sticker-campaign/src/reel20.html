<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<style>
  :root { --wood:#7a5236; --wood-d:#5b3a24; --leather:#5a3420; --paper:#f6efe0; --ink:#2a1d14; --cream:#fff8ec; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1080px; height:1920px; overflow:clip; font-family:'Tajawal',sans-serif; color:var(--cream); }
  #stage { position:absolute; inset:0; overflow:clip; background:var(--wood);
    background-image:repeating-linear-gradient(88deg, rgba(0,0,0,.08) 0 3px, transparent 3px 26px), repeating-linear-gradient(92deg, rgba(255,220,180,.05) 0 2px, transparent 2px 41px); }
  #world { position:absolute; inset:0; transform-origin:540px 900px; }
  .abs { position:absolute; }
  .center { width:100%; text-align:center; }
  .hd { font-weight:900; text-shadow:0 6px 18px rgba(0,0,0,.45); }
  /* journal */
  #spread { position:absolute; left:70px; top:460px; width:940px; height:800px; perspective:2600px; }
  .pg { position:absolute; top:0; width:470px; height:800px; background:var(--paper); box-shadow:0 26px 40px rgba(0,0,0,.35);
        background-image:radial-gradient(rgba(42,29,20,.2) 1.6px, transparent 2px); background-size:32px 32px; }
  #pgL { left:0; border-radius:14px 0 0 14px; box-shadow:inset -30px 0 30px -24px rgba(0,0,0,.25), 0 26px 40px rgba(0,0,0,.35); }
  #pgR { right:0; border-radius:0 14px 14px 0; box-shadow:inset 30px 0 30px -24px rgba(0,0,0,.25), 0 26px 40px rgba(0,0,0,.35); }
  #cover { position:absolute; right:0; top:-6px; width:476px; height:812px; transform-origin:0 50%; transform-style:preserve-3d; z-index:30; }
  #cover .out, #cover .in { position:absolute; inset:0; backface-visibility:hidden; border-radius:0 16px 16px 0; }
  #cover .out { background:var(--leather); box-shadow:0 26px 40px rgba(0,0,0,.4); background-image:radial-gradient(circle at 30% 20%, rgba(255,255,255,.08), transparent 50%), repeating-linear-gradient(45deg, rgba(0,0,0,.06) 0 2px, transparent 2px 7px); }
  #cover .out::after { content:''; position:absolute; right:40px; top:0; bottom:0; width:26px; background:#3a2014; }
  #cover .in { transform:rotateY(180deg); background:#e9dcc4; border-radius:16px 0 0 16px; }
  .stk { position:absolute; left:0; top:0; filter:drop-shadow(0 6px 6px rgba(0,0,0,.25)); transform-origin:0 0; z-index:20; }
  #hand { position:absolute; left:560px; top:850px; width:400px; font-family:'Aref Ruqaa'; font-size:58px; color:var(--ink); white-space:nowrap; z-index:21; text-align:right; }
  /* backing sheet */
  #sheet { position:absolute; left:110px; top:1360px; width:860px; height:330px; background:#efe6d3; border-radius:16px; box-shadow:0 16px 24px rgba(0,0,0,.3);
           background-image:linear-gradient(90deg, rgba(0,0,0,.04) 50%, transparent 50%); background-size:24px 100%; }
  /* props */
  #cup { position:absolute; left:50px; top:300px; width:180px; height:180px; border-radius:50%; background:radial-gradient(circle, #4a2a16 52%, #f3ece0 54% 66%, #d8cdbd 68%); box-shadow:0 14px 20px rgba(0,0,0,.35); }
  #cup::after { content:''; position:absolute; right:-44px; top:62px; width:60px; height:56px; border:14px solid #f3ece0; border-left:none; border-radius:0 40px 40px 0; }
  #clock { position:absolute; right:50px; top:340px; background:rgba(20,12,8,.55); border-radius:24px; padding:10px 30px; font-weight:900; font-size:64px; direction:rtl; }
  #sun { position:absolute; inset:-400px; pointer-events:none; mix-blend-mode:soft-light;
         background:repeating-linear-gradient(125deg, rgba(255,226,170,.22) 0 160px, rgba(0,0,0,.10) 160px 200px, rgba(255,226,170,.22) 200px 360px, rgba(0,0,0,.10) 360px 380px); }
  .chip { display:inline-block; background:var(--cream); color:var(--ink); border-radius:999px; padding:8px 30px; font-weight:900; font-size:44px; margin:8px; }
  #tag { position:absolute; left:340px; top:1080px; width:400px; height:640px; background:#d9b98c; border-radius:20px; clip-path:polygon(50% 0, 100% 12%, 100% 100%, 0 100%, 0 12%); display:flex; flex-direction:column; align-items:center; padding-top:110px; gap:10px; color:var(--ink); z-index:40; }
  #tag img { width:310px; height:310px; background:#fff; padding:12px; border-radius:12px; }
  #string { position:absolute; left:538px; top:900px; width:4px; height:200px; background:#c73b2f; z-index:39; }
</style>
</head>
<body>
<div id="stage">
<div id="world">
  <div id="cup"></div>
  <div id="clock">٤:٠٠ م</div>
  <div id="spread"><div class="pg" id="pgL"></div><div class="pg" id="pgR"></div>
    <div id="cover"><div class="out"></div><div class="in"></div></div></div>
  <div id="hand">أيام هادية ✿</div>
  <div id="sheet"></div>
  <div id="string"></div>
  <div id="tag"><div style="font-weight:900; font-size:60px">المتجر</div><img src="qr_store.png"><div style="font-weight:900; font-size:36px; direction:ltr">planme.zaher.io</div></div>
</div>
<div id="sun"></div>

<!-- captions above the desk -->
<div class="abs center hd" id="c0" style="top:40px; font-size:56px; color:#f2c98a">POV:</div>
<div class="abs center hd" id="c1" style="top:100px; font-size:78px; line-height:1.2">ساعتك المفضلة<br>في الأسبوع ☕📒</div>
<div class="abs center hd" id="c2" style="top:70px; font-size:74px; line-height:1.25">دفتر فاضي…<br><span style="color:#f2c98a">وستيكرات جورنال فنتج 🖋️</span></div>
<div class="abs center hd" id="c3" style="top:60px; font-size:96px; line-height:1.15">٦٨ تصميم<br><span style="font-size:70px; color:#f2c98a">جورنال فنتج</span></div>
<div class="abs center" id="chips" style="top:1720px; padding:0 30px"><span class="chip">ورق عتيق</span><span class="chip">زهور مجففة</span><span class="chip">ريش وحبر</span><span class="chip">بولارويد</span></div>
<div class="abs center hd" id="c4" style="top:70px; font-size:76px; line-height:1.25">صفحتك الجاية…<br><span style="color:#f2c98a">تبدأ من هنا ✨</span></div>
<div class="abs center hd" id="c5" style="top:1760px; font-size:48px">ملف PDF تطبعه في بيتك · تحميل فوري</div>
</div>

<script src="reel20_timeline.js"></script>
<script>
const clamp = (x) => Math.min(1, Math.max(0, x));
const p = (t, a, b) => clamp((t - a) / (b - a));
const back = (x) => { const c1 = 1.6, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const outCubic = (x) => 1 - Math.pow(1 - x, 3);
const inOut = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const $ = (id) => document.getElementById(id);
const AR = (n) => String(n).replace(/\d/g, (d) => '٠١٢٣٤٥٦٧٨٩'[d]);

// [src, target x, target y, width, final rotation] in page coordinates (spread origin at 70,460)
const PLACE = [
  ['j34', 260, 470, 70, 88], ['j30', 100, 560, 300, -4], ['j26', 330, 760, 190, 7], ['j51', 120, 930, 180, -6], ['j6', 290, 1030, 230, 3],
  ['j11', 590, 540, 270, 5], ['j56', 840, 600, 160, -7], ['j58', 610, 790, 230, -3], ['j47', 850, 930, 150, 6], ['j65', 610, 1020, 170, -5], ['j53', 840, 1090, 90, 12],
];
// Timings come from reel20_timeline.js (tools/mix_reel20.py): music and desk sounds sit between the voice lines.
const T0 = TL.lapse + 0.2, STEP = TL.step, LE = TL.lapse_end;
const STK = PLACE.map(([src, x, y, w, r], i) => {
  const el = document.createElement('img'); el.src = `journal/${src}.png`; el.className = 'stk'; el.style.width = w + 'px'; $('world').appendChild(el);
  const sx = 150 + (i % 6) * 135, sy = 1400 + Math.floor(i / 6) * 150;
  return { el, x, y, w, r, sx, sy, at: T0 + i * STEP, washi: src === 'j34' };
});

window.render = (t) => {
  // captions
  const show = (id, a, b) => { const k = Math.min(p(t, a, a + 0.35), 1 - p(t, b - 0.3, b)); $(id).style.opacity = k; $(id).style.transform = `translateY(${(1 - outCubic(p(t, a, a + 0.4))) * 40}px)`; };
  show('c0', TL.pov - 0.15, TL.open + 0.3); show('c1', TL.pov - 0.1, TL.open + 0.3); show('c2', TL.daftar - 0.1, TL.lapse + 0.4); show('c3', TL.count - 0.1, TL.close); show('c4', TL.next - 0.1, TL.end_all + 1);
  $('c5').style.opacity = p(t, TL.starts + 0.2, TL.starts + 0.5);
  [...$('chips').children].forEach((c, i) => { c.style.transform = `scale(${back(p(t, TL.chips + i * 0.15, TL.chips + 0.35 + i * 0.15)) * (1 - p(t, TL.close - 0.3, TL.close))})`; });

  // clock: 4:00 until decorating starts, then time-lapse to 5:00
  const mins = Math.round(60 * p(t, T0, LE - 0.2));
  $('clock').textContent = mins >= 60 ? '٥:٠٠ م' : `٤:${AR(String(mins).padStart(2, '0'))} م`;
  $('clock').style.transform = `scale(${t > T0 && t < LE - 0.2 ? 1 + 0.03 * Math.sin(t * 20) : 1})`;
  // sunlight shadows sweep across the desk faster during the time-lapse
  const sunT = t < T0 ? t * 6 : T0 * 6 + (t - T0) * 70;
  $('sun').style.transform = `translate(${-sunT}px, ${sunT * 0.4}px)`;

  // cover opens, later closes
  const open = inOut(p(t, TL.open, TL.open + 0.8)) - inOut(p(t, TL.close, TL.close + 0.6));
  $('cover').style.transform = `rotateY(${-178 * open}deg)`;
  $('pgL').style.visibility = open > 0.5 ? 'visible' : 'hidden';

  // stickers peel off the backing sheet, arc over, and press onto the page
  STK.forEach((s) => {
    const peel = p(t, s.at, s.at + 0.18), fly = inOut(p(t, s.at + 0.18, s.at + 0.5)), press = p(t, s.at + 0.5, s.at + 0.62);
    const sw = 110, sc0 = sw / s.w;
    const x = s.sx + (s.x - s.sx) * fly, y = s.sy + (s.y - s.sy) * fly - Math.sin(fly * Math.PI) * 220 - peel * 20 * (1 - fly);
    const sc = sc0 + (1 - sc0) * fly + (fly > 0 && fly < 1 ? 0.12 * Math.sin(fly * Math.PI) : 0) + 0.06 * Math.sin(press * Math.PI);
    const curl = peel * (1 - fly) * 38;
    const rot = s.r * fly + (1 - fly) * -6;
    s.el.style.transform = `translate(${x}px, ${y}px) perspective(900px) rotate3d(1, -1, 0, ${curl}deg) rotate(${rot}deg) scale(${sc})`;
    s.el.style.filter = `drop-shadow(0 ${6 + 20 * Math.sin(fly * Math.PI)}px ${6 + 14 * Math.sin(fly * Math.PI)}px rgba(0,0,0,.3))`;
    const vis = t >= TL.open + 0.6 && (t < TL.close || open > 0.5);
    s.el.style.display = vis ? '' : 'none';
    if (s.washi) { // washi tape unrolls instead of flying
      const u = p(t, s.at, s.at + 0.5);
      s.el.style.transform = `translate(${s.x}px, ${s.y}px) rotate(${s.r}deg)`;
      s.el.style.clipPath = `inset(0 0 ${(1 - u) * 100}% 0)`;
      s.el.style.display = t >= s.at && (t < TL.close || open > 0.5) ? '' : 'none';
    }
  });
  $('sheet').style.opacity = 1 - p(t, TL.zoom, TL.zoom + 0.6);
  $('sheet').style.transform = `translateY(${p(t, TL.zoom, TL.zoom + 0.6) * 300}px)`;
  // handwriting appears right-to-left
  const hw = p(t, TL.pen, TL.pen + 0.8);
  $('hand').style.clipPath = `inset(0 0 0 ${(1 - hw) * 100}%)`;
  $('hand').style.display = t > TL.pen && (t < TL.close || open > 0.5) ? '' : 'none';

  // zoom out a little to admire, then the bookmark tag drops with the QR
  const z = inOut(p(t, TL.zoom, TL.zoom + 0.8));
  const end = inOut(p(t, TL.close - 0.1, TL.close + 0.7));
  $('world').style.transform = `scale(${1 - 0.06 * z + 0.0 * end}) translateY(${end * -260}px)`;
  const D0 = TL.close + 0.75, drop = back(p(t, D0, D0 + 0.55));
  $('tag').style.transform = `translateY(${(1 - drop) * -900 + 260}px) rotate(${Math.sin((t - D0) * 3.5) * 5 * Math.exp(-Math.max(0, t - D0) * 1.2)}deg)`;
  $('tag').style.transformOrigin = '50% 0';
  $('tag').style.display = t > D0 ? '' : 'none';
  $('string').style.display = t > D0 + 0.1 ? '' : 'none';
  $('string').style.transform = `translateY(260px) scaleY(${p(t, D0 + 0.1, D0 + 0.4)})`; $('string').style.transformOrigin = '50% 0';
};
render(0);
</script>
</body>
</html>
