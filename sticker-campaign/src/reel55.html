<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@700&family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root { --paper:#f6efe4; --ink:#2b2220; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:clip; background:var(--paper); font-family:'IBM Plex Sans Arabic','Cairo',sans-serif; color:var(--ink); }
  #stage { position:absolute; left:0; top:0; width:1080px; height:1920px; overflow:clip; background:radial-gradient(ellipse at 50% 40%, #fbf7ef, #efe5d4 80%); }
  .abs { position:absolute; left:0; top:0; }
  #deck { position:absolute; left:0; top:0; width:1080px; height:1920px; }
  .strip { position:absolute; left:430px; top:620px; width:220px; height:980px; border-radius:16px; transform-origin:110px 940px; box-shadow:0 18px 30px rgba(0,0,0,.25); overflow:hidden; will-change:transform; }
  .strip .chips { position:absolute; left:16px; top:16px; width:188px; }
  .strip .chip { height:130px; border-radius:8px; margin-bottom:12px; }
  .strip .lb { position:absolute; left:0; bottom:20px; width:220px; text-align:center; font-size:40px; color:#fff; }
  .strip .hole { position:absolute; left:94px; bottom:-40px; width:32px; height:32px; border-radius:50%; background:#d8cbb6; }
  #pivot { position:absolute; left:518px; top:1540px; width:44px; height:44px; border-radius:50%; background:radial-gradient(circle at 35% 35%, #fff, #a99a82); box-shadow:0 4px 8px rgba(0,0,0,.3); z-index:30; }
  #wash { position:absolute; left:0; top:0; width:1080px; height:1920px; will-change:clip-path; }
  .st { position:absolute; left:0; top:0; filter:drop-shadow(0 12px 14px rgba(0,0,0,.35)); will-change:transform; }
  .ov { position:absolute; left:0; width:1080px; text-align:center; white-space:nowrap; line-height:1.4; z-index:40; }
  .w { display:inline-block; }
  .pill { display:inline-block; padding:4px 54px 18px; border-radius:90px; background:var(--ink); color:var(--paper); }
  .card { position:absolute; background:#fff; border-radius:20px; box-shadow:0 30px 50px rgba(0,0,0,.25); }
</style></head><body>
<div id="stage">
  <div id="wash"></div>
  <div id="stk"></div>
  <div id="deck"></div><div id="pivot"></div>
  <div id="uses"></div>
  <img id="sheet" class="abs" src="eph/sheet2.jpg" style="width:600px; border-radius:8px; box-shadow:0 30px 50px rgba(0,0,0,.3); opacity:0">
  <div id="qrCard" class="card" style="left:250px; top:400px; width:580px; height:820px; opacity:0">
    <div style="position:absolute; left:50px; top:50px; width:480px; height:480px"><img src="qr_store.png" style="width:100%; height:100%; display:block"></div>
    <div style="position:absolute; left:50px; top:560px; width:480px; height:90px; display:flex; gap:10px"><div style="flex:1; border-radius:8px; background:#6d1f2a"></div><div style="flex:1; border-radius:8px; background:#6b4a32"></div><div style="flex:1; border-radius:8px; background:#b8682f"></div><div style="flex:1; border-radius:8px; background:#6f8fb5"></div><div style="flex:1; border-radius:8px; background:#6e4f8f"></div></div>
    <div style="position:absolute; left:50px; top:670px; width:480px; text-align:right; font-size:54px">دُر</div>
    <div style="position:absolute; left:50px; top:745px; width:480px; text-align:right; font-family:Cairo; font-size:28px; color:#8a7f72; direction:ltr; text-align:left">planme.zaher.io</div>
  </div>
  <div class="ov" style="top:150px; font-size:140px"><span class="w" id="h1">خمس ألوان…</span></div>
  <div class="ov" style="top:360px; font-size:110px"><span class="w pill" id="h2">ومزاج لكل لون!</span></div>
  <div class="ov" style="top:1560px; font-size:170px; color:#fff; text-shadow:0 8px 24px rgba(0,0,0,.35)"><span class="w" id="cap"></span></div>
  <div class="ov" style="top:600px; font-size:110px"><span class="w" id="nB" style="background:var(--paper); border-radius:30px; padding:10px 70px 26px; box-shadow:0 20px 40px rgba(0,0,0,.25)"><span id="n149" style="display:block; font-family:Cairo; font-weight:900; font-size:250px; line-height:1.05">١٤٩</span><span style="display:block">ستيكر</span></span></div>
  <div class="ov" style="top:1250px; font-size:96px"><span class="w pill" id="n2">إفيميرا فنتج</span></div>
  <div class="ov" style="top:180px; font-size:130px"><span class="w" id="ucap"></span></div>
  <div class="ov" style="top:150px; font-size:140px"><span class="w" id="p1">ملف PDF</span></div>
  <div class="ov" style="top:360px; font-size:96px"><span class="w pill" id="p2">جاهز للطباعة</span></div>
  <div class="ov" style="top:170px; font-size:110px"><span class="w" id="e1">ستيكرات الإفيميرا</span></div>
  <div class="ov" style="top:1300px; font-size:80px"><span class="w" id="e2b">متوفرة في</span></div>
  <div class="ov" style="top:1430px; font-size:160px"><span class="w pill" id="e2" style="padding:0 70px 26px">متجر دُر</span></div>
</div>

<script src="reel55_timeline.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const p = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eb = (x) => { const c = 1.7; return x <= 0 ? 0 : 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const R = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const place = (e, x, y, s, r, o) => { e.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`; if (o !== undefined) e.style.opacity = o; };
const pop = (id, t, a, d = 0.4) => { const k = p(t, a, a + d); const e = $(id); e.style.opacity = p(t, a, a + 0.1); e.style.transform = `translateY(${(1 - eo(k)) * 40}px) scale(${0.7 + 0.3 * eb(k)})`; };
const off = (...ids) => ids.forEach((id) => ($(id).style.opacity = 0));

const D = { h1: 0.3, h2: 1.5, c1: 3.4, c2: 4.8, c3: 6.2, count: 8.0, n2: 9.4, u0: 11.0, u1: 12.2, u2: 13.4, print: 15.2, print2: 16.3, brand: 18.0, store: 19.6, store2: 20.3, end_all: 23.4 };
const T = Object.assign({}, D, window.TL || {});
const CUT = [T.c1 - 0.4, T.count - 0.35, T.u0 - 0.35, T.print - 0.35, T.brand - 0.35];
const sceneAt = (t) => (t < CUT[0] ? 0 : t < CUT[1] ? 1 : t < CUT[2] ? 2 : t < CUT[3] ? 3 : t < CUT[4] ? 4 : 5);

// five colour families (deck strips)
const FAM = [['عنابي', '#6d1f2a', ['#8e3a44', '#b06a6f', '#d6a9a6', '#ecd5cf', '#f6ebe6']], ['بني', '#6b4a32', ['#8a6646', '#a8875f', '#c8ab84', '#e2cfb2', '#f3e9da']], ['خريفي', '#b8682f', ['#c97f45', '#d99a62', '#e7b98a', '#f1d5b5', '#f8eadb']],
  ['أزرق', '#6f8fb5', ['#86a2c4', '#a0b7d2', '#bccde1', '#d7e2ee', '#ecf2f8']], ['بنفسجي', '#6e4f8f', ['#86699f', '#9f86b5', '#bba7cc', '#d8cbe3', '#efe8f4']]];
const strips = FAM.map(([lb, base, chips], i) => { const d = document.createElement('div'); d.className = 'strip'; d.style.background = base; d.style.zIndex = 10 + i;
  d.innerHTML = `<div class="chips">${chips.map((c) => `<div class="chip" style="background:${c}"></div>`).join('')}</div><div class="lb">${lb}</div><div class="hole"></div>`; $('deck').appendChild(d); return d; });
// stickers per featured family
const PICK = [['عنابي', '#6d1f2a', ['b9', 'b18', 'b20', 'b21', 'b27', 'b22'], 0], ['أزرق', '#6f8fb5', ['b98', 'b101', 'b107', 'b109', 'b110', 'b102'], 3], ['وبنفسجي', '#6e4f8f', ['b141', 'b143', 'b149', 'b135', 'b153', 'b157'], 4]];
const SLOT = [[110, 300, 300], [600, 260, 320], [150, 720, 340], [640, 760, 300], [140, 1140, 300], [620, 1160, 320]];
const fam = PICK.map(([, , ns]) => ns.map((n, j) => { const im = document.createElement('img'); im.className = 'st'; im.src = `eph/${n}.png`; im.style.width = SLOT[j][2] + 'px'; $('stk').appendChild(im); return im; }));
// count burst
const BURST = ['b10', 'b15', 'b26', 'b29', 'b45', 'b47', 'b48', 'b49', 'b54', 'b74', 'b75', 'b81', 'b85', 'b87', 'b94', 'b97', 'b100', 'b105', 'b129', 'b133', 'b137', 'b142', 'b154', 'b156'];
const burst = BURST.map((n) => { const im = document.createElement('img'); im.className = 'st'; im.src = `eph/${n}.png`; im.style.width = '170px'; $('stk').appendChild(im); return im; });
// uses
const JRN = `<div class="card" style="left:120px; top:560px; width:840px; height:1000px; background:#f3ead9"><div style="position:absolute; left:416px; top:0; width:8px; height:1000px; background:#e0d2ba"></div></div>`;
const LET = `<div class="card" style="left:150px; top:700px; width:780px; height:540px; background:#e9ddc8"><div style="position:absolute; left:0; top:0; width:780px; height:270px; background:#dccdb2; clip-path:polygon(0 0, 100% 0, 50% 100%)"></div></div>`;
const GFT = `<div class="card" style="left:190px; top:740px; width:700px; height:600px; background:#cbb79a"></div><div class="abs" style="left:510px; top:740px; width:60px; height:600px; background:#6d1f2a"></div>`;
const US = [['للجورنال', JRN, [['b22', 180, 640, 280, -4], ['b49', 220, 1000, 220, 6], ['b130', 570, 640, 300, 4], ['b143', 600, 1080, 260, -6], ['b13', 380, 1250, 120, 0]]], ['للرسائل', LET, [['b18', 470, 860, 170, 0], ['b9', 180, 520, 260, -8], ['b101', 680, 560, 220, 10]]], ['ولتغليف الهدايا', GFT, [['b27', 420, 610, 260, 0], ['b85', 230, 960, 220, -6], ['b110', 640, 980, 200, 8]]]];
const uses = US.map(([cap, html, st]) => { const d = document.createElement('div'); d.className = 'abs'; d.style.cssText = 'width:1080px; height:1920px; display:none'; d.innerHTML = html; $('uses').appendChild(d);
  const ims = st.map(([n, x, y, w, r]) => { const im = document.createElement('img'); im.className = 'st'; im.src = `eph/${n}.png`; im.style.width = w + 'px'; d.appendChild(im); return { im, x, y, r }; }); return { d, cap, ims }; });

window.render = (t) => {
  const sc = sceneAt(t);
  $('stage').style.opacity = 1 - p(t, T.end_all - 0.5, T.end_all);
  // deck: closed -> fans open (S1); in S2 the featured strip lifts; S3 fully fanned; hidden otherwise
  const fanOpen = sc === 0 ? eio(p(t, 0.3, 1.2)) : sc === 2 ? eio(p(t, CUT[1], CUT[1] + 0.5)) : 0;
  const deckVis = sc === 0 || sc === 2;
  strips.forEach((d, i) => { const ang = (i - 2) * 16 * fanOpen; const lift = sc === 0 ? Math.sin(t * 1.5 + i) * 1.5 : 0;
    d.style.transform = `rotate(${ang + lift}deg) translateY(${(1 - eo(p(t, 0, 0.5))) * 900}px)`; d.style.opacity = deckVis ? 1 : 0; });
  $('pivot').style.opacity = deckVis ? 1 : 0;
  // colour wash for S2 (circle reveal from the pivot)
  let wash = null; if (sc === 1) { const ks = [T.c1, T.c2, T.c3]; let cur = 0; ks.forEach((k, i) => { if (t >= k - 0.35) cur = i; });
    const k = eio(p(t, ks[cur] - 0.4, ks[cur] + 0.05)); wash = [PICK[cur][1], k, cur]; }
  if (wash) { const [col, k, cur] = wash; const prev = cur > 0 ? PICK[cur - 1][1] : 'transparent'; $('wash').style.background = `radial-gradient(circle at 540px 1560px, ${col} ${k * 2300}px, ${prev} ${k * 2300 + 2}px)`; $('wash').style.opacity = 1; }
  else $('wash').style.opacity = 0;
  // S2 stickers
  fam.forEach((ims, fi) => ims.forEach((im, j) => { let vis = 0; let s = 0; if (sc === 1) { const ks = [T.c1, T.c2, T.c3]; const a = ks[fi] - 0.1 + j * 0.07; const end = fi < 2 ? ks[fi + 1] - 0.4 : 99;
      if (t >= a && t < end) { vis = 1; s = eb(p(t, a, a + 0.35)); } }
    place(im, SLOT[j][0], SLOT[j][1] + Math.sin(t * 2 + j) * 6, s, (R(j + fi * 7) - 0.5) * 16, vis); }));
  // S3 burst
  burst.forEach((im, i) => { if (sc !== 2) { im.style.opacity = 0; return; } const a = CUT[1] + 0.3 + i * 0.03; const k = eo(p(t, a, a + 0.6)); const ang = -Math.PI * (0.05 + 0.9 * (i / burst.length));
    const rad = 360 + (i % 3) * 140; place(im, 455 + Math.cos(ang) * rad * k, 1450 + Math.sin(ang) * rad * k * 1.5, 0.4 + 0.6 * k, (R(i) - 0.5) * 30, k > 0 ? 1 : 0); });
  // S4 uses
  uses.forEach(({ d }) => (d.style.display = 'none'));
  if (sc === 3) { const at = [CUT[2] + 0.1, T.u1 - 0.3, T.u2 - 0.3]; const st = t < at[1] ? 0 : t < at[2] ? 1 : 2; const u = uses[st]; u.d.style.display = 'block';
    u.d.style.transform = `translateY(${(1 - eo(p(t, at[st], at[st] + 0.4))) * 900}px)`; u.ims.forEach(({ im, x, y, r }, j) => { const s = at[st] + 0.3 + j * 0.1; const q = eb(p(t, s, s + 0.3)); place(im, x, y, q, r, q > 0 ? 1 : 0); }); }
  // S5 sheet, S6 QR card
  if (sc === 4) { const k = eo(p(t, CUT[3] + 0.1, CUT[3] + 0.8)); place($('sheet'), 240, 620 + (1 - k) * 1300, 1, -2, 1); } else $('sheet').style.opacity = 0;
  if (sc === 5) { const q = eb(p(t, CUT[4] + 0.25, CUT[4] + 0.7)); $('qrCard').style.opacity = p(t, CUT[4] + 0.25, CUT[4] + 0.3); $('qrCard').style.transform = `scale(${q}) rotate(${(1 - Math.min(q, 1)) * -10}deg)`; } else $('qrCard').style.opacity = 0;
  // text overlays
  off('h1', 'h2', 'cap', 'nB', 'n2', 'ucap', 'p1', 'p2', 'e1', 'e2b', 'e2');
  if (sc === 0) { pop('h1', t, T.h1); pop('h2', t, T.h2, 0.45); }
  if (sc === 1) { const ks = [T.c1, T.c2, T.c3]; let cur = 0; ks.forEach((k, i) => { if (t >= k - 0.15) cur = i; }); $('cap').textContent = PICK[cur][0]; pop('cap', t, ks[cur] - 0.1); }
  if (sc === 2) { $('n149').textContent = Math.round(149 * eo(p(t, CUT[1] + 0.2, CUT[1] + 1.2))).toLocaleString('ar-EG'); pop('nB', t, CUT[1] + 0.15); pop('n2', t, T.n2 - 0.05); }
  if (sc === 3) { const at = [CUT[2] + 0.1, T.u1 - 0.3, T.u2 - 0.3]; const st = t < at[1] ? 0 : t < at[2] ? 1 : 2; $('ucap').textContent = uses[st].cap; pop('ucap', t, at[st] + 0.1); }
  if (sc === 4) { pop('p1', t, T.print - 0.05); pop('p2', t, T.print2 - 0.05); }
  if (sc === 5) { pop('e1', t, T.brand - 0.05); pop('e2b', t, T.store - 0.05); pop('e2', t, T.store2 - 0.05, 0.45); }
};
render(0);
</script>
</body></html>
