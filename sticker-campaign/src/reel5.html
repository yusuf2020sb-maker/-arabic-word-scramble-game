<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Rakkas&family=Baloo+Bhaijaan+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --peach:#f4b393; --mint:#a8d5ba; --lilac:#c3b1e1; --butter:#f6e27f; --ink:#2b2118; --white:#fffaf2; --red:#e2483d; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1080px; height:1920px; overflow:clip; font-family:'Baloo Bhaijaan 2',sans-serif; color:var(--ink); }
  #stage { position:absolute; inset:0; overflow:clip; background:var(--peach); }
  #dots { position:absolute; inset:-60px; background-image:radial-gradient(rgba(43,33,24,.13) 5px, transparent 6px); background-size:38px 38px; }
  .scene { position:absolute; inset:0; overflow:clip; display:none; }
  .abs { position:absolute; }
  .center { width:100%; text-align:center; }
  .rk { font-family:'Rakkas',serif; line-height:1.1; }
  .outline { color:var(--white); -webkit-text-stroke:10px var(--ink); paint-order:stroke fill; }
  .stk { position:absolute; left:0; top:0; filter:drop-shadow(6px 10px 0 rgba(43,33,24,.25)); }
  .chip { display:inline-block; background:var(--white); border:6px solid var(--ink); border-radius:999px; padding:8px 36px; font-weight:800; font-size:46px; margin:8px; box-shadow:6px 6px 0 var(--ink); }
  svg.mk { position:absolute; left:0; top:0; overflow:visible; pointer-events:none; }
  svg.mk path { fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .bar { position:absolute; left:-400px; width:1900px; height:900px; transform-origin:center; }
  #slot { position:absolute; left:120px; top:470px; width:840px; height:70px; background:var(--ink); border-radius:35px; z-index:3; }
  #paper { position:absolute; left:210px; top:505px; width:660px; overflow:hidden; height:0; z-index:2; box-shadow:0 20px 30px rgba(0,0,0,.18); }
  #paper img { width:660px; display:block; }
  #cover { position:absolute; left:250px; top:600px; width:580px; height:580px; z-index:5; transform-origin:0 0; }
  #cover .face { position:absolute; inset:0; background:var(--butter); border:8px solid var(--ink); border-radius:46px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; }
  #qrbox { position:absolute; left:250px; top:600px; width:580px; height:580px; background:#fff; border:8px solid var(--ink); border-radius:46px; padding:40px; box-shadow:12px 12px 0 var(--ink); }
</style>
</head>
<body>
<div id="stage">
<div id="dots"></div>

<!-- S1: hook -->
<div class="scene" id="s1">
  <div class="abs center rk outline" id="q" style="top:560px; font-size:170px">ستيكرات<br>ما تخلص؟</div>
  <div class="abs center rk" id="yes" style="top:1060px; font-size:260px; color:var(--red)">إيه!</div>
  <svg class="mk" width="1080" height="1920"><path id="u1" d="M330 1390 C 450 1370, 640 1400, 760 1375" stroke="#2b2118" stroke-width="22"/></svg>
</div>

<!-- S2: printing again and again -->
<div class="scene" id="s2">
  <div id="slot"></div>
  <div id="paper"><img src="sheet_feed.jpg"></div>
  <div class="abs center rk outline" id="pw" style="top:250px; font-size:110px"></div>
</div>

<!-- S3: where do they go -->
<div class="scene" id="s3">
  <div class="abs center rk outline" id="where" style="top:700px; font-size:180px">وين<br>تلصقها؟</div>
  <div class="abs center rk outline" id="beat" style="top:420px; font-size:200px"></div>
</div>

<!-- S4: style grid -->
<div class="scene" id="s4">
  <div class="abs center rk outline" style="top:220px; font-size:140px">ستايلك موجود</div>
  <div class="abs center" id="chips" style="top:1600px; padding:0 40px">
    <span class="chip">طوابع</span><span class="chip">ورود</span><span class="chip">خريف</span><span class="chip">تراث</span><span class="chip">جورنال</span>
  </div>
</div>

<!-- S5: peel to reveal the store QR -->
<div class="scene" id="s5">
  <div class="abs center rk outline" id="s5t" style="top:240px; font-size:120px">المتجر<br>تحت الملصق</div>
  <div id="qrbox"><img src="qr_store.png" style="width:100%; height:100%"></div>
  <div id="cover"><div class="face"><div class="rk" style="font-size:150px">👀</div><div class="rk" style="font-size:80px">شيله!</div></div></div>
  <div class="abs center" style="top:1300px; font-size:64px; font-weight:800; direction:ltr">planme.zaher.io</div>
  <svg class="mk" width="1080" height="1920"><path id="c1" d="M560 1290 C 900 1270, 960 1400, 560 1420 C 150 1420, 120 1290, 520 1285" stroke="#e2483d" stroke-width="14"/></svg>
</div>

<!-- colour bar wipe -->
<div id="wipe" class="abs" style="inset:0; pointer-events:none">
  <div class="bar" style="background:var(--butter)"></div>
  <div class="bar" style="background:var(--lilac)"></div>
  <div class="bar" style="background:var(--mint)"></div>
</div>
</div>

<script>
const clamp = (x) => Math.min(1, Math.max(0, x));
const p = (t, a, b) => clamp((t - a) / (b - a));
const back = (x) => { const c1 = 2, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const outCubic = (x) => 1 - Math.pow(1 - x, 3);
const inOut = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const $ = (id) => document.getElementById(id);
const rnd = (seed) => { const x = Math.sin(seed * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };
// stop-motion: animation time advances in 8 fps steps
const step = (t) => Math.floor(t * 8) / 8;

const SCENES = [['s1', 0, 3.4], ['s2', 3.4, 7.0], ['s3', 7.0, 13.4], ['s4', 13.4, 17.4], ['s5', 17.4, 22.5]];
const CUTS = [3.4, 7.0, 13.4, 17.4];
const BG = { s1: '--peach', s2: '--mint', s4: '--lilac', s5: '--peach' };

function sticker(parent, src, x, y, w) {
  const el = document.createElement('img'); el.src = `cut2/${src}.png`; el.className = 'stk'; el.style.width = w + 'px';
  parent.appendChild(el); return { el, x, y };
}
// stop-motion slap: appears big, settles in two steps, then "boils" (jitters a little every step)
function slap(s, t, at, rot, seed) {
  const st = step(t), k = st < at ? -1 : Math.min(3, Math.floor((st - at) * 8));
  s.el.style.display = k < 0 ? 'none' : '';
  if (k < 0) return;
  const scale = [1.5, 0.9, 1.05, 1][k];
  const j = k === 3 ? (rnd(Math.floor(t * 8) + seed) - 0.5) * 6 : 0;
  s.el.style.transform = `translate(${s.x + j}px, ${s.y + j}px) rotate(${rot + j}deg) scale(${scale})`;
}

// S1 stickers around the hook
const S1 = [['cozyautumn_p79', 60, 300, 260, -12, 0.4], ['vases_p13', 780, 330, 230, 10, 0.65], ['stamps_p18', 90, 1450, 240, 8, 0.9], ['journal_p18', 760, 1480, 260, -8, 1.15]]
  .map(([src, x, y, w, r, at], i) => ({ s: sticker($('s1'), src, x, y, w), r, at, i }));

// S3 beats: word + background colour + sticker
const BEATS = [['على الكوب', '--butter', 'cozyhome_p92'], ['على الدفتر', '--mint', 'journal_p46'], ['على الهدية', '--lilac', 'ephemera_p102'], ['على الطلبات', '--peach', 'stamps_p34']]
  .map(([word, bg, src], i) => ({ word, bg, s: sticker($('s3'), src, 300, 800, 480), at: 8.2 + i * 1.3 }));

// S4 grid of 12 different stickers
const GRID = ['roses_p30', 'stamps_p26', 'cozyautumn_p103', 'heritage_p24', 'vases_p17', 'journal_p32', 'botanical_p12', 'ephemera_p70', 'roses_p43', 'heritage_p45', 'vases_p9', 'vintage_p16']
  .map((src, i) => ({ s: sticker($('s4'), src, 70 + (i % 3) * 330, 430 + Math.floor(i / 3) * 255, 250), at: 13.6 + i * 0.125, r: (rnd(i) - 0.5) * 20 }));

const pathLen = (el) => { const L = el.getTotalLength(); el.style.strokeDasharray = L; return L; };
const U1 = pathLen($('u1')), C1 = pathLen($('c1'));

window.render = (t) => {
  let cur = 's1';
  SCENES.forEach(([id, a, b]) => { const on = t >= a && t < b; $(id).style.display = on ? 'block' : 'none'; if (on) cur = id; });
  if (BG[cur]) $('stage').style.background = `var(${BG[cur]})`;
  $('dots').style.transform = `translate(${(t * 20) % 38}px, ${(t * 12) % 38}px)`;

  // colour-bar wipe centred on each cut
  const c = CUTS.find((x) => Math.abs(t - x) < 0.3);
  const bars = [...$('wipe').children];
  bars.forEach((b, i) => {
    if (c === undefined) { b.style.display = 'none'; return; }
    const k = p(t, c - 0.3 + i * 0.05, c + 0.3 + i * 0.05);
    b.style.display = '';
    b.style.top = (-200 + i * 700) + 'px';
    b.style.transform = `rotate(-18deg) translateX(${(inOut(k) * 2 - 1) * 2000}px)`;
  });

  // S1
  const qt = step(t);
  $('q').style.transform = `rotate(${(rnd(Math.floor(t * 8)) - 0.5) * 2}deg) scale(${qt < 0.25 ? 0 : qt < 0.375 ? 1.15 : 1})`;
  $('yes').style.transform = `scale(${step(t) < 1.6 ? 0 : step(t) < 1.75 ? 1.3 : 1}) rotate(-6deg)`;
  $('u1').style.strokeDashoffset = U1 * (1 - p(t, 1.9, 2.4));
  S1.forEach(({ s, r, at, i }) => slap(s, t, at, r, i * 7));

  // S2 paper feeds out of the slot in three stop-motion pushes
  const pushes = [3.8, 4.8, 5.8];
  const n = pushes.filter((x) => t >= x).length;
  const ph = n === 0 ? 0 : (n - 1) * 300 + 300 * Math.min(1, Math.floor((t - pushes[n - 1]) * 8) / 4);
  $('paper').style.height = ph + 'px';
  $('pw').textContent = ['', 'طبعة…', 'طبعة… وطبعة…', 'وكل ما تبي طبعة!'][n];
  $('pw').style.top = n === 3 ? '1500px' : '250px';
  $('slot').style.transform = `translateY(${n && (t - pushes[n - 1]) < 0.25 ? 6 : 0}px)`;

  // S3
  $('where').style.display = t < 8.2 ? '' : 'none';
  $('where').style.transform = `scale(${step(t) < 7.2 ? 0.6 : 1}) rotate(${(rnd(Math.floor(t * 8)) - 0.5) * 3}deg)`;
  const bi = BEATS.findIndex((b) => t >= b.at && t < b.at + 1.3);
  if (cur === 's3') $('stage').style.background = bi < 0 ? 'var(--lilac)' : `var(${BEATS[bi].bg})`;
  $('beat').textContent = bi < 0 ? '' : BEATS[bi].word;
  BEATS.forEach((b, i) => { if (i === bi) slap(b.s, t, b.at + 0.25, (i % 2 ? 8 : -8), i); else b.s.el.style.display = 'none'; });

  // S4
  GRID.forEach(({ s, at, r }, i) => slap(s, t, at, r, i + 30));
  $('chips').style.transform = `translateY(${step(t) < 15.2 ? 400 : 0}px)`;

  // S5: the cover sticker peels from its corner and flies off
  const pk = p(t, 19.0, 19.9);
  const lift = inOut(pk);
  $('cover').style.transform = `translate(${lift * 900}px, ${-lift * 500}px) rotate(${lift * 55}deg) scale(${1 + 0.1 * Math.sin(Math.PI * pk)})`;
  $('cover').style.filter = `drop-shadow(${10 + lift * 40}px ${10 + lift * 50}px 0 rgba(43,33,24,${0.25 + 0.2 * Math.sin(Math.PI * pk)}))`;
  $('cover').style.transform += ` rotate(${t > 18.0 && t < 19.0 ? Math.sin(t * 30) * 1.5 : 0}deg)`;
  $('c1').style.strokeDashoffset = C1 * (1 - p(t, 20.1, 20.7));
  $('s5t').innerHTML = t < 19.9 ? 'المتجر<br>تحت الملصق' : 'المتجر<br>هنا';
};
render(0);
</script>
</body>
</html>
