<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root { --sand:#e9cf9f; --dune:#c98b4c; --dusk:#7a2f22; --night:#1d1410; --cream:#f6ead3; --green:#145c43; --sadu:#9b1c1f; --gold:#d9a441; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:clip; background:var(--night); font-family:'Cairo',sans-serif; color:var(--cream); }
  #stage { position:absolute; left:0; top:0; width:1080px; height:1920px; overflow:clip; }
  .scene { position:absolute; left:0; top:0; width:1080px; height:1920px; overflow:clip; display:none; }
  .abs { position:absolute; left:0; top:0; }
  .line { position:absolute; left:0; width:1080px; text-align:center; font-weight:900; line-height:1.3; white-space:nowrap; }
  .w { display:inline-block; }
  .st { position:absolute; left:0; top:0; filter:drop-shadow(0 18px 22px rgba(0,0,0,.45)); will-change:transform; }
  .sky { position:absolute; left:0; top:0; width:1080px; height:1920px; }
  .dune { position:absolute; left:-200px; width:1480px; border-radius:50% 50% 0 0 / 100% 100% 0 0; }
  .sadu { height:70px; background:
      linear-gradient(135deg, var(--sadu) 25%, transparent 25%) 0 0 / 70px 70px,
      linear-gradient(225deg, var(--sadu) 25%, transparent 25%) 0 0 / 70px 70px,
      linear-gradient(315deg, #1d1410 25%, transparent 25%) 0 0 / 70px 70px,
      linear-gradient(45deg, #1d1410 25%, transparent 25%) 0 0 / 70px 70px, var(--cream);
    border-top:8px solid var(--sadu); border-bottom:8px solid var(--sadu); }
  .smoke { position:absolute; left:0; top:0; width:120px; height:120px; border-radius:50%; background:radial-gradient(circle, rgba(255,250,240,.5), rgba(255,250,240,0) 70%); filter:blur(8px); }
  #stream { position:absolute; left:0; top:0; }
  #tray { position:absolute; left:90px; top:620px; width:900px; height:900px; border-radius:50%;
    background:radial-gradient(circle at 45% 40%, #f2cf7a, #c9922f 55%, #8f6220 75%, #6c4818 100%); box-shadow:0 50px 80px rgba(0,0,0,.6), inset 0 0 0 26px rgba(255,230,160,.25), inset 0 0 0 30px rgba(110,70,20,.5); }
  #tray::after { content:''; position:absolute; left:120px; top:120px; width:660px; height:660px; border-radius:50%; border:4px dashed rgba(110,70,20,.45); }
  .lbl { position:absolute; left:0; top:0; padding:10px 34px 16px; border-radius:50px; background:var(--green); color:var(--cream); font-size:54px; font-weight:900; white-space:nowrap; box-shadow:0 10px 24px rgba(0,0,0,.4); }
  .bag { position:absolute; width:240px; height:320px; background:linear-gradient(170deg,#d4a96f,#b58648); border-radius:6px 6px 14px 14px; box-shadow:0 24px 40px rgba(0,0,0,.4); }
  .bag::before { content:''; position:absolute; left:70px; top:-60px; width:100px; height:80px; border:10px solid #8a5f2c; border-bottom:none; border-radius:50px 50px 0 0; }
  #sheet { position:absolute; left:0; top:0; width:600px; height:848px; background:#f6efe2; box-shadow:0 30px 60px rgba(0,0,0,.45); border-radius:6px; }
  .chip { position:absolute; left:0; top:0; padding:12px 34px 18px; border-radius:60px; background:var(--sadu); color:var(--cream); font-size:44px; font-weight:900; white-space:nowrap; }
  .chip span { direction:rtl; unicode-bidi:isolate; }
  #qcard { position:absolute; left:150px; top:620px; width:780px; height:860px; background:var(--cream); border-radius:20px; box-shadow:0 40px 80px rgba(0,0,0,.5); overflow:hidden; }
  #qr { position:absolute; left:340px; top:900px; width:400px; height:400px; background:#fff; padding:24px; border-radius:16px; }
  #qr img { width:100%; height:100%; display:block; }
  #fade { position:absolute; left:0; top:0; width:1080px; height:1920px; background:#000; opacity:0; pointer-events:none; }
  #grain { position:absolute; left:0; top:0; opacity:.22; mix-blend-mode:overlay; pointer-events:none; }
</style></head><body>
<div id="stage">

  <!-- S1 hook: coffee pour at dusk -->
  <div class="scene" id="s1">
    <div class="sky" style="background:linear-gradient(180deg,#2b1712 0%,#7a2f22 45%,#d07a3e 70%,#e9b36a 100%)"></div>
    <div class="abs" style="left:640px; top:980px; width:260px; height:260px; border-radius:50%; background:radial-gradient(circle,#ffe2a0,#f4a14c 60%,transparent 72%)"></div>
    <div class="dune" style="top:1250px; height:900px; background:#b8743d"></div>
    <div class="dune" style="top:1420px; left:-500px; height:800px; background:#9c5c2e"></div>
    <svg id="stream" width="1080" height="1920"><path id="pour" d="" fill="none" stroke="#6b3410" stroke-width="24" stroke-linecap="round"/></svg>
    <img id="dallah" class="st" src="saudi/b8.png" style="width:420px">
    <img id="finjan" class="st" src="saudi/b29.png" style="width:300px">
    <div id="steam"></div>
    <div class="line" style="top:220px; font-size:116px"><span class="w" id="h1">ضيافة سعودية…</span></div>
    <div class="line" style="top:420px; font-size:120px; color:var(--gold)"><span class="w" id="h2">بس على ورق!</span></div>
  </div>

  <!-- S2 majlis tray -->
  <div class="scene" id="s2" style="background:radial-gradient(ellipse at 50% 45%, #4a2a1c, #1d1410 70%)">
    <div class="abs sadu" style="top:120px; width:1080px"></div>
    <div id="tray"></div>
    <div id="items"></div>
    <div id="smk"></div>
    <div class="abs sadu" style="top:1700px; width:1080px"></div>
  </div>

  <!-- S3 desert -->
  <div class="scene" id="s3">
    <div class="sky" style="background:linear-gradient(180deg,#f4d79a 0%,#efb871 50%,#e19c56 100%)"></div>
    <div class="abs" style="left:380px; top:420px; width:320px; height:320px; border-radius:50%; background:radial-gradient(circle,#fff4cf,#ffd17a 60%,transparent 72%)"></div>
    <div id="d1" class="dune" style="top:1050px; height:1000px; background:#dea464"></div>
    <div id="d2" class="dune" style="top:1250px; left:-400px; height:900px; background:#c98648"></div>
    <div id="d3" class="dune" style="top:1480px; left:-100px; height:800px; background:#b06d35"></div>
    <img id="palmL" class="st" src="saudi/b24.png" style="width:300px">
    <img id="palmR" class="st" src="saudi/b35.png" style="width:280px">
    <img id="camel1" class="st" src="saudi/b30.png" style="width:300px">
    <img id="camel2" class="st" src="saudi/b53.png" style="width:300px">
    <img id="falcon" class="st" src="saudi/b22.png" style="width:300px">
    <div id="saduband" class="abs sadu" style="top:1600px; width:1080px"></div>
    <div class="line" style="top:170px; font-size:110px; color:#3a1d10"><span class="w" id="w0">صقر</span>  <span class="w" id="w1">نخيل</span>  <span class="w" id="w2">جمال</span></div>
    <div class="line" style="top:1400px; font-size:130px; color:var(--cream); text-shadow:0 8px 24px rgba(0,0,0,.4)"><span class="w" id="w3">وسدو</span></div>
  </div>

  <!-- S4 title -->
  <div class="scene" id="s4" style="background:radial-gradient(ellipse at 50% 45%, #1d7a58, #0c3a2a 75%)">
    <div id="sbT" class="abs sadu" style="top:620px; width:1080px"></div>
    <div id="sbB" class="abs sadu" style="top:1240px; width:1080px"></div>
    <div id="orb"></div>
    <div class="line" style="top:790px; font-size:96px; z-index:2; text-shadow:0 6px 20px rgba(0,0,0,.6)"><span class="w" id="t1">ستيكرات اليوم الوطني</span></div>
    <div class="line" style="top:960px; font-size:90px; color:var(--gold); z-index:2; text-shadow:0 6px 20px rgba(0,0,0,.6)"><span class="w" id="t2">بطابع تراثي</span></div>
  </div>

  <!-- S5 uses carousel -->
  <div class="scene" id="s5" style="background:linear-gradient(180deg,#f3e3c4,#e3c99c)"><div id="rail" class="abs" style="width:3240px; height:1920px"></div></div>

  <!-- S6 print -->
  <div class="scene" id="s6" style="background:radial-gradient(ellipse at 50% 45%, #4a2a1c, #1d1410 70%)">
    <div class="line" style="top:200px; font-size:120px"><span class="w" id="p1">ملف PDF</span></div>
    <div class="line" style="top:380px; font-size:84px; color:var(--gold)"><span class="w" id="p2">جاهز للطباعة</span></div>
    <div id="sheet"></div>
    <div class="chip" id="ch0"><span>A4</span></div>
    <div class="chip" id="ch1"><span>تحميل فوري</span></div>
  </div>

  <!-- S7 end -->
  <div class="scene" id="s7" style="background:radial-gradient(ellipse at 50% 45%, #1d7a58, #0c3a2a 75%)">
    <div class="line" style="top:170px; font-size:92px"><span class="w" id="e1">ستيكرات اليوم الوطني</span></div>
    <div class="line" style="top:340px; font-size:76px; color:var(--gold)"><span class="w" id="e1b">بطابع تراثي</span></div>
    <div id="qcard"><div class="sadu abs" style="top:0; width:780px"></div><div class="sadu abs" style="top:774px; width:780px"></div>
      <div class="line" style="width:780px; top:120px; font-size:100px; color:var(--green)"><span class="w" id="e2">في المتجر</span></div></div>
    <div id="qr"><img src="qr_store.png"></div>
    <img id="endD" class="st" src="saudi/b40.png" style="width:260px">
    <img id="endF" class="st" src="saudi/b22.png" style="width:220px">
    <div class="line" style="top:1560px; font-size:50px; font-weight:900; direction:ltr"><span class="w" id="e3">planme.zaher.io</span></div>
  </div>

  <svg id="grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="9"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .4  0 0 0 0 .3  0 0 0 .6 0"/></filter><rect width="1080" height="1920" filter="url(#n)"/></svg>
  <div id="wipe" class="abs sadu" style="width:1080px; height:0"></div>
  <div id="fade"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const p = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eb = (x) => { const c = 1.7; return x <= 0 ? 0 : 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const R = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

const D = { h1: 0.2, h2: 1.5, i0: 3.6, i1: 4.5, i2: 5.4, i3: 6.3, d0: 8.0, d1: 8.9, d2: 9.8, d3: 10.7, title: 12.3, t2: 13.3, u0: 15.0, u1: 16.4, u2: 17.8, print: 19.4, brand: 22.2, store: 23.6, end_all: 26.5 };
const T = Object.assign({}, D, window.TL || {});
const CUT = [T.i0 - 0.3, T.d0 - 0.3, T.title - 0.3, T.u0 - 0.3, T.print - 0.3, T.brand - 0.3];
const SC = [['s1', 0, CUT[0]], ['s2', CUT[0], CUT[1]], ['s3', CUT[1], CUT[2]], ['s4', CUT[2], CUT[3]], ['s5', CUT[3], CUT[4]], ['s6', CUT[4], CUT[5]], ['s7', CUT[5], 99]];

const show = (id, t, a, out) => {
  const k = eo(p(t, a, a + 0.5)); const o = out ? 1 - p(t, out, out + 0.3) : 1; const el = $(id);
  el.style.opacity = k * o; el.style.filter = `blur(${(1 - k) * 14}px)`; el.style.transform = `translateY(${(1 - k) * 60}px)`;
};
const punch = (id, t, a) => { const k = eb(p(t, a, a + 0.4)); const el = $(id); el.style.opacity = p(t, a, a + 0.1); el.style.transform = `scale(${0.4 + 0.6 * k}) rotate(${(1 - k) * -8}deg)`; };
const place = (el, x, y, s, r, o) => { el.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`; if (o !== undefined) el.style.opacity = o; };
const mk = (host, n, w, cls = 'st') => { const im = document.createElement('img'); im.className = cls; im.src = `saudi/${n}.png`; im.style.width = w + 'px'; $(host).appendChild(im); return im; };

// steam / incense smoke puffs
const STEAM = [...Array(8)].map(() => { const d = document.createElement('div'); d.className = 'smoke'; $('steam').appendChild(d); return d; });
const SMK = [...Array(10)].map(() => { const d = document.createElement('div'); d.className = 'smoke'; $('smk').appendChild(d); return d; });
const puff = (arr, t, x0, y0, on) => arr.forEach((d, i) => { const ph = ((t * 0.55 + i / arr.length) % 1); d.style.opacity = on * (1 - ph) * 0.9; d.style.transform = `translate(${x0 + Math.sin(t * 1.6 + i * 1.7) * 40 * ph - 60}px, ${y0 - ph * 420}px) scale(${0.6 + ph * 1.8})`; });

// tray items with labels
const ITEMS = [['دلّة', 'b8', 330, 230, 760], ['فناجيل', 'b15', 260, 560, 820], ['تمر', 'b40', 300, 400, 1100], ['وبخور', 'b16', 260, 170, 1080]].map(([w, n, size, x, y], i) => {
  const im = mk('items', n, size); const l = document.createElement('div'); l.className = 'lbl'; l.textContent = w; $('items').appendChild(l);
  return { im, l, x, y, size, i };
});

// orbit for title
const ORB = ['b8', 'b15', 'b22', 'b24', 'b28', 'b30', 'b12', 'b31', 'b29', 'b25', 'b53', 'b16'].map((n) => mk('orb', n, 170));

// uses carousel stations
const US = [
  { cap: 'للهدايا', html: '<div class="abs" style="left:2410px; top:760px; width:600px; height:520px; background:#145c43; border-radius:12px; box-shadow:0 40px 60px rgba(0,0,0,.35)"></div><div class="abs" style="left:2410px; top:700px; width:600px; height:110px; background:#1a7353; border-radius:12px"></div><div class="abs" style="left:2690px; top:700px; width:40px; height:580px; background:#d9a441"></div>', st: [['b15', 2470, 880, 230], ['b31', 2790, 900, 170]] },
  { cap: 'للتوزيعات', html: [0, 1, 2].map((j) => `<div class="bag" style="left:${1170 + j * 300}px; top:${880 + (j % 2) * 40}px"></div>`).join(''), st: [['b29', 1195, 960, 190], ['b24', 1520, 980, 150], ['b30', 1790, 990, 180]] },
  { cap: 'ولتغليف الطلبات', html: '<div class="abs" style="left:150px; top:760px; width:780px; height:560px; background:linear-gradient(170deg,#c9a173,#b18657); border-radius:8px; box-shadow:0 40px 60px rgba(0,0,0,.35)"></div><div class="abs" style="left:150px; top:990px; width:780px; height:90px; background:rgba(246,234,211,.55)"></div>', st: [['b28', 220, 820, 230], ['b53', 600, 840, 260]] },
];
const rail = $('rail'); const CAPS = [];
US.forEach((u, i) => {
  rail.insertAdjacentHTML('beforeend', u.html);
  const c = document.createElement('div'); c.className = 'line'; c.style.left = ((2 - i) * 1080) + 'px'; c.style.top = '300px'; c.style.fontSize = '120px'; c.style.color = '#3a1d10';
  c.innerHTML = `<span class="w">${u.cap}</span>`; rail.appendChild(c); CAPS.push(c.querySelector('span'));
  u.ims = u.st.map(([n, x, y, w]) => { const im = document.createElement('img'); im.className = 'st'; im.src = `saudi/${n}.png`; im.style.width = w + 'px'; rail.appendChild(im); return { im, x, y }; });
});

// custom printable sheet (heritage stickers only)
const SH = ['b8', 'b15', 'b16', 'b22', 'b24', 'b27', 'b28', 'b29', 'b30', 'b31', 'b33', 'b35', 'b36', 'b40', 'b53', 'b12', 'b20', 'b25'];
SH.forEach((n, i) => { const im = document.createElement('img'); im.src = `saudi/${n}.png`; im.style.cssText = `position:absolute; width:150px; height:150px; object-fit:contain; left:${40 + (i % 3) * 185}px; top:${50 + Math.floor(i / 3) * 128}px; transform:scale(.82)`; $('sheet').appendChild(im); });

window.render = (t) => {
  for (const [id, a, b] of SC) $(id).style.display = t >= a && t < b ? 'block' : 'none';
  $('fade').style.opacity = Math.max(1 - p(t, 0, 0.3), p(t, T.end_all - 0.5, T.end_all));
  // sadu wipe: a woven band sweeps down at each cut
  let wi = -1; CUT.forEach((c, i) => { if (Math.abs(t - c) < 0.35) wi = i; });
  if (wi >= 0) { const k = p(t, CUT[wi] - 0.35, CUT[wi] + 0.35); const h = Math.sin(k * Math.PI) * 2000; $('wipe').style.height = h + 'px'; $('wipe').style.top = (k < 0.5 ? 0 : 1920 - h) + 'px'; $('wipe').style.opacity = 1; }
  else $('wipe').style.opacity = 0;

  // S1: dallah tilts and pours into the finjan
  if (t < CUT[0]) {
    const intro = eo(p(t, 0, 0.9)); const tilt = eio(p(t, 0.5, 1.2)) * 38;
    place($('dallah'), 160 + (1 - intro) * -300, 760, 1, tilt);
    place($('finjan'), 560, 1240 + (1 - intro) * 300, 1, 0);
    const flow = p(t, 1.0, 1.25) * (1 - p(t, CUT[0] - 0.6, CUT[0] - 0.3));
    const sx = 553, sy = 1037, ex = 705, ey = 1295;
    const y2 = sy + (ey - sy) * flow;
    $('pour').setAttribute('d', flow > 0 ? `M ${sx} ${sy} Q ${sx + 110} ${sy + 15} ${sx + (ex - sx) * Math.min(1, flow * 1.4)} ${y2}` : '');
    $('pour').setAttribute('stroke-width', 10 + 6 * Math.sin(t * 20) * 0.3);
    puff(STEAM, t, 700, 1240, p(t, 1.4, 2.0));
    show('h1', t, T.h1); punch('h2', t, T.h2);
  }

  // S2: items drop onto the tray, incense smoke
  if (t >= CUT[0] && t < CUT[1]) {
    const a = CUT[0]; $('tray').style.transform = `rotate(${(t - a) * 4}deg) scale(${0.85 + 0.15 * eo(p(t, a, a + 0.6))})`;
    const at = [T.i0 - 0.15, T.i1 - 0.15, T.i2 - 0.15, T.i3 - 0.15];
    ITEMS.forEach(({ im, l, x, y, size, i }) => {
      const k = p(t, at[i], at[i] + 0.35); const b = eb(p(t, at[i] + 0.25, at[i] + 0.55));
      im.style.opacity = k > 0 ? 1 : 0; place(im, x, y - (1 - eio(k)) * 900, k < 1 ? 1.1 : 1 + 0.05 * (1 - b), (1 - k) * 25);
      const lk = eb(p(t, at[i] + 0.2, at[i] + 0.55)); l.style.opacity = p(t, at[i] + 0.2, at[i] + 0.3);
      l.style.transform = `translate(${x + size / 2 - 90}px, ${y - 90}px) scale(${lk})`;
    });
    puff(SMK, t, 300, 1080, p(t, T.i3, T.i3 + 0.4));
  }

  // S3: desert parallax, falcon flies, camels walk, sadu band weaves in
  if (t >= CUT[1] && t < CUT[2]) {
    const a = CUT[1]; const tt = t - a;
    $('d1').style.transform = `translateX(${-tt * 10}px)`; $('d2').style.transform = `translateX(${-tt * 22}px)`; $('d3').style.transform = `translateX(${-tt * 40}px)`;
    const fk = p(t, T.d0 - 0.2, T.d0 + 1.2);
    $('falcon').style.transform = `translate(${1100 - eo(fk) * 760}px, ${700 - Math.sin(fk * Math.PI) * 120}px) rotate(${-8 + Math.sin(t * 6) * 3}deg) scaleY(${0.92 + 0.08 * Math.sin(t * 14)})`;
    $('falcon').style.opacity = fk > 0 ? 1 : 0;
    const pk = eb(p(t, T.d1 - 0.2, T.d1 + 0.3));
    $('palmL').style.transformOrigin = $('palmR').style.transformOrigin = '50% 100%';
    $('palmL').style.transform = `translate(-40px, 980px) rotate(${Math.sin(t * 1.4) * 3}deg) scale(${pk})`;
    $('palmR').style.transform = `translate(820px, 1020px) rotate(${Math.sin(t * 1.2 + 1) * 3}deg) scale(${pk})`;
    const ck = p(t, T.d2 - 0.3, CUT[2]);
    $('camel1').style.transform = `translate(${1150 - ck * 900}px, ${1150 + Math.abs(Math.sin(t * 5)) * -8}px)`;
    $('camel2').style.transform = `translate(${1400 - ck * 900}px, ${1210 + Math.abs(Math.sin(t * 5 + 1)) * -8}px)`;
    const sk = eio(p(t, T.d3 - 0.25, T.d3 + 0.35)); $('saduband').style.clipPath = `inset(0 0 0 ${(1 - sk) * 100}%)`;
    show('w0', t, T.d0 - 0.05); show('w1', t, T.d1 - 0.05); show('w2', t, T.d2 - 0.05); punch('w3', t, T.d3 - 0.05);
  }

  // S4: sadu bands slide in, stickers orbit around the title
  if (t >= CUT[2] && t < CUT[3]) {
    const a = CUT[2]; const k = eio(p(t, a, a + 0.6));
    $('sbT').style.transform = `translateX(${(1 - k) * 1080}px)`; $('sbB').style.transform = `translateX(${-(1 - k) * 1080}px)`;
    ORB.forEach((im, i) => {
      const ang = i / ORB.length * Math.PI * 2 + (t - a) * 0.5; const ek = eb(p(t, a + 0.1 + i * 0.05, a + 0.6 + i * 0.05));
      place(im, 540 + Math.cos(ang) * 470 - 85, 1000 + Math.sin(ang) * 760 - 85, ek, Math.sin(t + i) * 10, p(t, a + 0.1 + i * 0.05, a + 0.2 + i * 0.05));
    });
    show('t1', t, T.title - 0.05); show('t2', t, T.t2 - 0.05);
  }

  // S5: carousel pans between stations
  if (t >= CUT[3] && t < CUT[4]) {
    const at = [CUT[3] + 0.1, T.u1 - 0.3, T.u2 - 0.3];
    let cam = -2160; for (let i = 1; i < 3; i++) cam += eio(p(t, at[i] - 0.1, at[i] + 0.5)) * 1080;
    $('rail').style.transform = `translateX(${cam}px)`;
    US.forEach((u, i) => {
      const ck = eo(p(t, at[i] + 0.25, at[i] + 0.7)); CAPS[i].style.opacity = ck; CAPS[i].style.transform = `translateY(${(1 - ck) * 50}px)`;
      u.ims.forEach(({ im, x, y }, j) => {
        const s0 = at[i] + 0.35 + j * 0.25; const pk = eo(p(t, s0, s0 + 0.3));
        im.style.opacity = p(t, s0, s0 + 0.06);
        im.style.transform = `translate(${x}px,${y}px) rotate(${(1 - pk) * 14 + (j - 0.5) * 6}deg) scale(${1.45 - 0.45 * pk})`;
      });
    });
  }

  // S6: printed sheet slides up
  if (t >= CUT[4] && t < CUT[5]) {
    const a = CUT[4]; const k = eo(p(t, a, a + 0.9));
    show('p1', t, a + 0.1); show('p2', t, a + 0.45);
    $('sheet').style.transform = `translate(240px, ${1950 - k * 1380}px) rotate(${3 * eio(p(t, a + 0.5, a + 1.2))}deg)`;
    [[90, 1340], [700, 1180]].forEach(([x, y], i) => {
      const c = eb(p(t, a + 1.0 + i * 0.3, a + 1.4 + i * 0.3));
      place($('ch' + i), x, y + Math.sin(t * 2 + i) * 6, c, (i - 0.5) * 6, p(t, a + 1.0 + i * 0.3, a + 1.1 + i * 0.3));
    });
  }

  // S7: end card
  if (t >= CUT[5]) {
    const a = CUT[5]; const ck = eo(p(t, a, a + 0.7));
    $('qcard').style.transform = `translateY(${(1 - ck) * 1300}px)`; $('qr').style.transform = `translateY(${(1 - ck) * 1300}px)`;
    show('e1', t, a + 0.1); show('e1b', t, a + 0.4); show('e2', t, T.store - 0.05); show('e3', t, T.store + 0.25);
    place($('endD'), 30, 1380 + Math.sin(t * 1.5) * 6, eb(p(t, a + 0.6, a + 1.0)), -8);
    place($('endF'), 820, 1400 + Math.sin(t * 1.3) * 8, eb(p(t, a + 0.8, a + 1.2)), 8);
  }
};
render(0);
</script>
