<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root { --night:#060a14; --green:#1fa463; --gold:#f0c15a; --cream:#fbf3e2; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:clip; background:var(--night); font-family:'Cairo',sans-serif; color:var(--cream); }
  #stage { position:absolute; left:0; top:0; width:1080px; height:1920px; overflow:clip; background:linear-gradient(180deg, #050912 0%, #0b1a24 60%, #10261f 100%); }
  .scene { position:absolute; left:0; top:0; width:1080px; height:1920px; overflow:clip; display:none; }
  .abs { position:absolute; left:0; top:0; }
  .line { position:absolute; left:0; width:1080px; text-align:center; font-weight:900; line-height:1.3; white-space:nowrap; }
  .w { display:inline-block; }
  .glow { text-shadow:0 0 18px rgba(240,193,90,.7), 0 0 40px rgba(240,193,90,.35); }
  .st { position:absolute; left:0; top:0; filter:drop-shadow(0 0 22px rgba(240,193,90,.45)) drop-shadow(0 16px 20px rgba(0,0,0,.5)); will-change:transform; }
  #fx { position:absolute; left:0; top:0; mix-blend-mode:screen; pointer-events:none; }
  #skyline { position:absolute; left:0; top:1700px; width:1080px; height:220px; background:#040608; clip-path:polygon(0 60%, 6% 55%, 10% 30%, 12% 55%, 20% 50%, 24% 20%, 26% 50%, 36% 45%, 42% 35%, 48% 45%, 58% 40%, 62% 10%, 64% 40%, 74% 45%, 80% 25%, 84% 45%, 92% 40%, 96% 55%, 100% 50%, 100% 100%, 0 100%); }
  .bag { position:absolute; left:0; top:0; width:260px; height:330px; background:linear-gradient(170deg,#d4a96f,#b58648); border-radius:6px 6px 14px 14px; box-shadow:0 0 30px rgba(240,193,90,.25); }
  .bag::before { content:''; position:absolute; left:75px; top:-60px; width:110px; height:80px; border:10px solid #8a5f2c; border-bottom:none; border-radius:55px 55px 0 0; }
  .chip { position:absolute; left:0; top:0; padding:12px 34px 18px; border-radius:60px; background:var(--green); color:var(--cream); font-size:44px; font-weight:900; white-space:nowrap; border:3px solid var(--gold); }
  .chip span { direction:rtl; unicode-bidi:isolate; }
  #sheet { position:absolute; left:0; top:0; width:560px; height:792px; background:#fbf3e2; border-radius:10px; box-shadow:0 0 50px rgba(240,193,90,.3); }
  #qrB { position:absolute; left:290px; top:680px; width:500px; height:560px; border-radius:30px; background:rgba(251,243,226,.08); border:4px solid var(--gold); box-shadow:0 0 40px rgba(240,193,90,.4); }
  #qr { position:absolute; left:350px; top:760px; width:380px; height:380px; background:#fff; padding:20px; border-radius:14px; }
  #qr img { width:100%; height:100%; display:block; }
</style></head><body>
<div id="stage">
  <canvas id="fx" width="1080" height="1920"></canvas>
  <div id="skyline"></div>

  <div class="scene" id="s1">
    <div class="line glow" style="top:560px; font-size:104px"><span class="w" id="h1">المناسبة الجاية…</span></div>
    <div class="line glow" style="top:760px; font-size:118px; color:var(--gold)"><span class="w" id="h2">لمستها من التراث!</span></div>
    <img id="hookImg" class="st" src="saudi/b8.png" style="width:360px">
  </div>
  <div class="scene" id="s2"><div id="items"></div>
    <div class="line glow" style="top:200px; font-size:84px; color:var(--gold)"><span class="w" id="r0">دلّة… صقر… ونخلة</span></div>
    <div class="line glow" style="top:1040px; font-size:84px; color:var(--gold)"><span class="w" id="r1">وسدو… وجمل… وفنجال</span></div>
  </div>
  <div class="scene" id="s3">
    <div class="line glow" style="top:780px; font-size:112px"><span class="w" id="t1">ستيكرات تراثية</span></div>
    <div class="line glow" style="top:960px; font-size:92px; color:var(--gold)"><span class="w" id="t2">لكل مناسبة</span></div>
  </div>
  <div class="scene" id="s4">
    <div class="line glow" style="top:300px; font-size:120px"><span class="w" id="ucap">للتوزيعات</span></div>
    <div id="uses"></div>
  </div>
  <div class="scene" id="s5">
    <div class="line glow" style="top:220px; font-size:120px"><span class="w" id="p1">ملف PDF</span></div>
    <div class="line glow" style="top:390px; font-size:84px; color:var(--gold)"><span class="w" id="p2">جاهز للطباعة</span></div>
    <div id="sheet"></div>
    <div class="chip" id="ch0"><span>A4</span></div><div class="chip" id="ch1"><span>تحميل فوري</span></div>
  </div>
  <div class="scene" id="s6">
    <div class="line glow" style="top:200px; font-size:110px"><span class="w" id="e1">ستيكرات المجلس</span></div>
    <div id="qrB"></div><div id="qr"><img src="qr_store.png"></div>
    <img id="eA" class="st" src="saudi/b22.png" style="width:230px"><img id="eB" class="st" src="saudi/b40.png" style="width:240px">
    <div class="line" style="top:1320px; font-size:62px"><span class="w" id="e2b">متوفرة في</span></div>
    <div class="line glow" style="top:1400px; font-size:150px; color:var(--gold)"><span class="w" id="e2">متجر دُر</span></div>
    <div class="line" style="top:1620px; font-size:48px; direction:ltr"><span class="w" id="e3">planme.zaher.io</span></div>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const p = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eb = (x) => { const c = 1.7; return x <= 0 ? 0 : 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const R = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

const D = { h1: 0.2, h2: 1.5, a0: 2.9, a1: 3.7, a2: 4.5, b0: 5.7, b1: 6.5, b2: 7.3, title: 8.7, t2: 9.9, u0: 11.5, u1: 12.7, u2: 13.9, print: 15.5, brand: 17.9, store: 19.1, store2: 19.7, end_all: 22.3 };
const T = Object.assign({}, D, window.TL || {});
const CUT = [T.a0 - 0.3, T.title - 0.3, T.u0 - 0.3, T.print - 0.3, T.brand - 0.3];
const SC = [['s1', 0, CUT[0]], ['s2', CUT[0], CUT[1]], ['s3', CUT[1], CUT[2]], ['s4', CUT[2], CUT[3]], ['s5', CUT[3], CUT[4]], ['s6', CUT[4], 99]];

// sparkler writing: text revealed right-to-left with a bright head; returns the head position
const sparkle = (id, t, a, d = 0.6) => { const k = p(t, a, a + d); const e = $(id); e.style.clipPath = `inset(0 0 0 ${(1 - eio(k)) * 100}%)`; e.style.opacity = k > 0 ? 1 : 0; return k; };
const place = (e, x, y, s, r, o) => { e.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`; if (o !== undefined) e.style.opacity = o; };

// firework bursts: [time, x, y, colour-set, size]
const COLS = [['#1fa463', '#8ff0b8'], ['#f0c15a', '#fff1c2'], ['#ffffff', '#f0c15a']];
const BURSTS = [];
const addB = (t0, x, y, c, s = 1) => BURSTS.push({ t0, x, y, c, s, seed: BURSTS.length * 7.3 });
[[0.15, 300, 520, 0, 0.8], [0.6, 800, 420, 1, 0.9], [T.h2 - 0.15, 540, 1150, 1, 1.4], [T.h2 + 0.3, 220, 1400, 0, 0.8], [T.h2 + 0.5, 860, 1380, 2, 0.8]].forEach((b) => addB(...b));
const SLOTS = [[790, 560], [450, 560], [110, 560], [790, 1300], [450, 1300], [110, 1300]];
[T.a0, T.a1, T.a2, T.b0, T.b1, T.b2].forEach((k, i) => addB(k - 0.2, SLOTS[i][0] + 90, SLOTS[i][1] + 100, i % 3, 0.9));
[T.title - 0.25, T.title + 0.1, T.t2 - 0.1].forEach((k, i) => addB(k, [540, 240, 840][i], [700, 520, 560][i], i % 3, 1.1));
[T.u0 - 0.2, T.u1 - 0.2, T.u2 - 0.2].forEach((k, i) => addB(k + 0.3, 540, 760, (i + 1) % 3, 1.0));
[T.brand - 0.25, T.brand + 0.2, T.store2 - 0.1, T.store2 + 0.3].forEach((k, i) => addB(k, [540, 220, 860, 540][i], [520, 1500, 1500, 380][i], i % 3, 1.0));

const cv = $('fx'), cx = cv.getContext('2d');
const drawFx = (t) => {
  cx.clearRect(0, 0, 1080, 1920); cx.globalCompositeOperation = 'lighter';
  BURSTS.forEach(({ t0, x, y, c, s, seed }) => {
    const launch = 0.45; const dt = t - t0;
    if (dt < -launch || dt > 1.8) return;
    if (dt < 0) { // rising rocket trail
      const k = 1 + dt / launch; const ry = 1950 - (1950 - y) * eo(k);
      for (let j = 0; j < 8; j++) { const yy = ry + j * 18; cx.fillStyle = `rgba(255,230,170,${0.8 - j * 0.1})`; cx.beginPath(); cx.arc(x + Math.sin(j + t * 20) * 2, yy, 4 - j * 0.4, 0, 7); cx.fill(); }
      return;
    }
    const N = 70; const fade = Math.max(0, 1 - dt / 1.6);
    for (let i = 0; i < N; i++) {
      const a = i / N * Math.PI * 2 + R(seed + i) * 0.1; const v = (380 + R(seed + i * 3) * 300) * s;
      const tt = Math.min(dt, 1.6); const drag = (1 - Math.exp(-tt * 2.2)) / 2.2;
      const px = x + Math.cos(a) * v * drag, py = y + Math.sin(a) * v * drag + 120 * tt * tt;
      const col = COLS[c][i % 2]; const tw = 0.6 + 0.4 * Math.sin(t * 40 + i);
      cx.globalAlpha = fade * tw; cx.fillStyle = col; cx.beginPath(); cx.arc(px, py, 5 * s, 0, 7); cx.fill();
      cx.globalAlpha = fade * 0.35; cx.beginPath(); cx.arc(px, py, 14 * s, 0, 7); cx.fill();
    }
    if (dt < 0.2) { cx.globalAlpha = 1 - dt / 0.2; const g = cx.createRadialGradient(x, y, 0, x, y, 220 * s); g.addColorStop(0, 'rgba(255,240,200,.9)'); g.addColorStop(1, 'rgba(255,240,200,0)'); cx.fillStyle = g; cx.fillRect(x - 240 * s, y - 240 * s, 480 * s, 480 * s); }
  });
  // drifting embers / stars
  for (let i = 0; i < 60; i++) { cx.globalAlpha = 0.3 + 0.5 * Math.abs(Math.sin(t * 1.3 + i)); cx.fillStyle = '#fff6d8'; cx.fillRect(R(i) * 1080, R(i + 50) * 1300, 2, 2); }
  cx.globalAlpha = 1; cx.globalCompositeOperation = 'source-over';
};

// items revealed by bursts
const IT = ['b8', 'b22', 'b24', 'b28', 'b30', 'b29'].map((n, i) => { const im = document.createElement('img'); im.className = 'st'; im.src = `saudi/${n}.png`; im.style.width = '190px'; $('items').appendChild(im); return im; });
// uses
const USES = [
  ['للتوزيعات', '<div class="bag" style="left:160px; top:820px"></div><div class="bag" style="left:410px; top:860px"></div><div class="bag" style="left:660px; top:820px"></div>', [['b29', 190, 900, 190], ['b24', 470, 940, 150], ['b30', 690, 900, 190]]],
  ['للهدايا', '<div class="abs" style="left:240px; top:820px; width:600px; height:520px; background:#145c43; border-radius:12px; box-shadow:0 0 40px rgba(240,193,90,.25)"></div><div class="abs" style="left:520px; top:820px; width:40px; height:520px; background:#f0c15a"></div>', [['b8', 300, 900, 220], ['b31', 620, 940, 160]]],
  ['ولتغليف الطلبات', '<div class="abs" style="left:170px; top:820px; width:740px; height:540px; background:linear-gradient(170deg,#c9a173,#b18657); border-radius:8px"></div><div class="abs" style="left:170px; top:1040px; width:740px; height:80px; background:rgba(251,243,226,.55)"></div>', [['b28', 230, 880, 230], ['b53', 600, 900, 260]]],
].map(([cap, html, st], i) => {
  const d = document.createElement('div'); d.className = 'abs'; d.style.cssText = 'width:1080px; height:1920px'; d.innerHTML = html; $('uses').appendChild(d);
  const ims = st.map(([n, x, y, w]) => { const im = document.createElement('img'); im.className = 'st'; im.src = `saudi/${n}.png`; im.style.width = w + 'px'; d.appendChild(im); return { im, x, y }; });
  return { d, cap, ims, i };
});
['b8', 'b29', 'b16', 'b22', 'b24', 'b27', 'b28', 'b30', 'b31', 'b35', 'b40', 'b53', 'b12', 'b20', 'b41'].forEach((n, i) => { const im = document.createElement('img'); im.src = `saudi/${n}.png`;
  im.style.cssText = `position:absolute; width:150px; height:130px; object-fit:contain; left:${30 + (i % 3) * 175}px; top:${40 + Math.floor(i / 3) * 148}px`; $('sheet').appendChild(im); });

window.render = (t) => {
  for (const [id, a, b] of SC) $(id).style.display = t >= a && t < b ? 'block' : 'none';
  $('stage').style.opacity = Math.min(p(t, 0, 0.3) * 1 + 0.0, 1) * (1 - p(t, T.end_all - 0.5, T.end_all)) || 0.0001;
  drawFx(t);
  // S1
  if (t < CUT[0]) {
    sparkle('h1', t, T.h1, 0.7); sparkle('h2', t, T.h2, 0.7);
    const k = eb(p(t, T.h2 - 0.15, T.h2 + 0.35)); place($('hookImg'), 360, 1000, k, Math.sin(t * 2) * 3, p(t, T.h2 - 0.15, T.h2 - 0.1));
  }
  // S2
  if (t >= CUT[0] && t < CUT[1]) {
    sparkle('r0', t, T.a0 - 0.25, 0.5); sparkle('r1', t, T.b0 - 0.25, 0.5);
    [T.a0, T.a1, T.a2, T.b0, T.b1, T.b2].forEach((k, i) => { const s = eb(p(t, k - 0.18, k + 0.3)); place(IT[i], SLOTS[i][0], SLOTS[i][1] + Math.sin(t * 2 + i) * 6, s, Math.sin(t * 1.5 + i) * 4, p(t, k - 0.18, k - 0.12)); });
  }
  // S3
  if (t >= CUT[1] && t < CUT[2]) { sparkle('t1', t, T.title - 0.05, 0.7); sparkle('t2', t, T.t2 - 0.05, 0.6); }
  // S4
  if (t >= CUT[2] && t < CUT[3]) {
    const at = [CUT[2] + 0.1, T.u1 - 0.2, T.u2 - 0.2]; const st = t < at[1] ? 0 : t < at[2] ? 1 : 2;
    $('ucap').textContent = USES[st].cap; sparkle('ucap', t, at[st] + 0.1, 0.5);
    USES.forEach(({ d, ims, i }) => { d.style.display = i === st ? 'block' : 'none'; const k = eo(p(t, at[i], at[i] + 0.5)); d.style.transform = `translateY(${(1 - k) * 200}px)`; d.style.opacity = k;
      ims.forEach(({ im, x, y }, j) => place(im, x, y, eb(p(t, at[i] + 0.35 + j * 0.12, at[i] + 0.8 + j * 0.12)), (j - 1) * 6, p(t, at[i] + 0.35 + j * 0.12, at[i] + 0.4 + j * 0.12))); });
  }
  // S5
  if (t >= CUT[3] && t < CUT[4]) {
    const a = CUT[3]; sparkle('p1', t, a + 0.1, 0.5); sparkle('p2', t, a + 0.5, 0.5);
    const k = eo(p(t, a, a + 0.9)); $('sheet').style.transform = `translate(260px, ${600 + (1 - k) * 1400}px) rotate(${-2 + Math.sin(t)}deg)`;
    place($('ch0'), 90, 1480, eb(p(t, a + 1.0, a + 1.4)), -5, p(t, a + 1.0, a + 1.05)); place($('ch1'), 680, 1340, eb(p(t, a + 1.2, a + 1.6)), 5, p(t, a + 1.2, a + 1.25));
  }
  // S6
  if (t >= CUT[4]) {
    const a = CUT[4]; sparkle('e1', t, T.brand - 0.05, 0.6);
    const q = eb(p(t, a + 0.3, a + 0.8)); $('qrB').style.transform = $('qr').style.transform = `scale(${q})`; $('qrB').style.opacity = $('qr').style.opacity = p(t, a + 0.3, a + 0.35);
    place($('eA'), 40, 1080 + Math.sin(t * 1.5) * 8, eb(p(t, a + 0.6, a + 1.0)), -8, p(t, a + 0.6, a + 0.65));
    place($('eB'), 810, 560 + Math.sin(t * 1.5 + 1) * 8, eb(p(t, a + 0.7, a + 1.1)), 8, p(t, a + 0.7, a + 0.75));
    sparkle('e2b', t, T.store - 0.1, 0.5); sparkle('e2', t, T.store2 - 0.1, 0.5); sparkle('e3', t, T.store2 + 0.3, 0.4);
  }
};
render(0);
</script>
</body></html>
