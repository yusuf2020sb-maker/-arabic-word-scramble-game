<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root { --wood:#3b2418; --wood-l:#5a3826; --page:#f6ecd9; --page-d:#e8d8bb; --rust:#c0623a; --mus:#e2a64a; --cream:#fbf3e4; --ink:#3a2a20; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:clip; background:var(--wood); font-family:'Tajawal',sans-serif; color:var(--cream); }
  #stage { position:absolute; left:0; top:0; width:1080px; height:1920px; overflow:clip;
    background: radial-gradient(circle 700px at 540px 1050px, rgba(255,190,110,.35), transparent 70%), repeating-linear-gradient(90deg, #3b2418 0 46px, #412819 46px 50px, #3b2418 50px 120px), var(--wood); }
  .abs { position:absolute; left:0; top:0; }
  .line { position:absolute; left:0; width:1080px; text-align:center; line-height:1.25; white-space:nowrap; }
  .lz { font-family:'Lalezar',sans-serif; }
  .w { display:inline-block; }
  #view { position:absolute; left:0; top:0; width:1080px; height:1920px; perspective:2200px; perspective-origin:540px 700px; }
  #book { position:absolute; left:60px; top:1000px; width:960px; height:660px; transform-style:preserve-3d; transform-origin:50% 50%; }
  .page { position:absolute; top:0; width:480px; height:660px; background:linear-gradient(90deg, var(--page-d), var(--page) 12%, var(--page) 88%, var(--page-d)); }
  .page.l { left:0; border-radius:14px 0 0 14px; } .page.r { left:480px; border-radius:0 14px 14px 0; }
  #cover { position:absolute; left:-14px; top:-14px; width:988px; height:688px; border-radius:20px; background:#7a3b22; transform:translateZ(-4px); box-shadow:0 40px 80px rgba(0,0,0,.6); }
  #leaf { position:absolute; left:0; top:0; width:480px; height:660px; transform-origin:100% 50%; transform-style:preserve-3d; }
  #leaf .f, #leaf .b { position:absolute; left:0; top:0; width:480px; height:660px; backface-visibility:hidden; background:linear-gradient(90deg, var(--page-d), var(--page) 15%); border-radius:14px 0 0 14px; }
  #leaf .b { transform:rotateY(180deg); border-radius:0 14px 14px 0; background:linear-gradient(270deg, var(--page-d), var(--page) 15%); }
  .pop { position:absolute; left:0; top:0; transform-origin:50% 100%; transform-style:preserve-3d; }
  .pop img { display:block; filter:drop-shadow(0 10px 8px rgba(60,30,10,.35)); }
  .flat { position:absolute; left:0; top:0; }
  .chip { position:absolute; left:0; top:0; padding:12px 34px 16px; border-radius:60px; background:var(--rust); color:var(--cream); font-size:44px; font-weight:800; white-space:nowrap; border:4px solid var(--mus); }
  .chip span { direction:rtl; unicode-bidi:isolate; }
  #end { position:absolute; left:0; top:0; width:1080px; height:1920px; display:none; }
  #endCover { position:absolute; left:140px; top:520px; width:800px; height:1060px; border-radius:20px; background:#7a3b22; box-shadow:0 40px 80px rgba(0,0,0,.6), inset 0 0 0 18px #6a311c, inset 0 0 0 22px var(--mus); }
  #qr { position:absolute; left:340px; top:800px; width:400px; height:400px; background:#fff; padding:22px; border-radius:16px; }
  #qr img { width:100%; height:100%; display:block; }
  #fade { position:absolute; left:0; top:0; width:1080px; height:1920px; background:#000; opacity:0; pointer-events:none; }
</style></head><body>
<div id="stage">
  <div id="view">
    <div id="book">
      <div id="cover"></div>
      <div class="page l"></div><div class="page r"></div>
      <div id="flats" class="abs" style="transform-style:preserve-3d"></div>
      <div id="pops" class="abs" style="transform-style:preserve-3d"></div>
      <div id="leaf"><div class="f"></div><div class="b"></div></div>
    </div>
  </div>
  <div class="line lz" style="top:200px; font-size:140px"><span class="w" id="cap">دفا الخريف</span></div>
  <div class="line lz" style="top:380px; font-size:110px; color:var(--mus)"><span class="w" id="cap2">في كتاب!</span></div>
  <img id="sheet" class="abs" src="cozy/sheet2.jpg" style="width:540px; box-shadow:0 30px 60px rgba(0,0,0,.6); opacity:0">
  <div class="chip" id="ch0" style="opacity:0"><span>A4</span></div><div class="chip" id="ch1" style="opacity:0"><span>١١٦ ستيكر</span></div>
  <div id="end">
    <div id="endCover"></div>
    <div class="line lz" style="top:620px; font-size:84px; color:var(--cream)"><span class="w" id="e1">ستيكرات الشتا الدافي</span></div>
    <div id="qr"><img src="qr_store.png"></div>
    <div class="line" style="top:1260px; font-size:58px; font-weight:800"><span class="w" id="e2b">متوفرة في</span></div>
    <div class="line lz" style="top:1330px; font-size:130px; color:var(--mus)"><span class="w" id="e2">متجر دُر</span></div>
    <div class="line" style="top:1640px; font-size:50px; font-weight:800; direction:ltr"><span class="w" id="e3">planme.zaher.io</span></div>
  </div>
  <div id="fade"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const p = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eb = (x) => { const c = 1.7; return x <= 0 ? 0 : 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

const D = { h1: 0.3, h2: 1.2, k0: 3.0, k1: 5.4, count: 7.8, n2: 8.6, u0: 10.4, u1: 11.6, u2: 12.8, print: 14.4, brand: 16.8, store: 18.0, store2: 18.6, end_all: 21.2 };
const T = Object.assign({}, D, window.TL || {});
const TILT = 52;

// spreads: [time it opens, caption, sub-caption, items [name, x, y(bottom on page), width]]
const SPREADS = [
  [0.2, 'دفا الخريف', 'في كتاب!', [['c96', 360, 330, 260], ['c15', 120, 560, 200], ['c101', 700, 600, 200], ['c124', 470, 620, 280]]],
  [T.k0, 'كنبة · بطانية', 'وكوب كاكاو', [['c124', 90, 560, 330], ['c94', 520, 560, 240], ['c92', 700, 630, 200]]],
  [T.k1, 'شموع · كتب', 'ومدفأة', [['c98', 330, 420, 300], ['c93', 90, 620, 200], ['c95', 680, 620, 220], ['c138', 520, 640, 150]]],
  [T.count, '١١٦ ستيكر', 'بطابع دافي', [['c101', 40, 300, 140], ['c131', 200, 300, 140], ['c128', 360, 300, 150], ['c142', 530, 300, 140], ['c19', 690, 300, 110], ['c33', 820, 300, 120],
    ['c49', 40, 620, 140], ['c72', 200, 620, 150], ['c31', 370, 620, 150], ['c32', 540, 620, 150], ['c129', 700, 620, 130], ['c93', 830, 620, 110]]],
  [T.u0, 'للجورنال', '', [['c33', 80, 560, 300], ['c131', 560, 380, 200], ['c138', 700, 620, 170]]],
];
const POPS = SPREADS.map(([at, c1, c2, items], si) => items.map(([n, x, y, w], j) => {
  const d = document.createElement('div'); d.className = 'pop'; d.innerHTML = `<img src="cozy/${n}.png" style="width:${w}px">`; $('pops').appendChild(d);
  return { d, x, y, w, si, j };
}));
// uses extras inside the last spread: a card and a parcel that pop up later
const EXTRA = [['card', 'c92', 'للبطاقات'], ['box', 'c94', 'ولتغليف الطلبات']].map(([kind, n, cap], i) => {
  const d = document.createElement('div'); d.className = 'pop';
  d.innerHTML = kind === 'card' ? `<div style="width:300px; height:380px; background:#fbf3e4; border:6px solid #c0623a; border-radius:12px; position:relative"><img src="cozy/${n}.png" style="position:absolute; left:50px; top:60px; width:200px"></div>`
    : `<div style="width:360px; height:300px; background:linear-gradient(170deg,#c9a173,#a97f52); border-radius:8px; position:relative"><div style="position:absolute; left:0; top:120px; width:360px; height:56px; background:rgba(251,243,228,.6)"></div><img src="cozy/${n}.png" style="position:absolute; left:90px; top:50px; width:180px"></div>`;
  $('pops').appendChild(d); return { d, cap, i };
});
const BOUND = SPREADS.map((s) => s[0]).concat([T.print - 0.2]);

window.render = (t) => {
  const ending = t >= T.brand - 0.25;
  $('end').style.display = ending ? 'block' : 'none'; $('view').style.display = ending ? 'none' : 'block';
  $('fade').style.opacity = Math.max(1 - p(t, 0, 0.3), p(t, T.end_all - 0.5, T.end_all), Math.max(0, 1 - Math.abs(t - (T.brand - 0.25)) / 0.2) * 0.9);
  // book: slow drift, tilt eases in at the start
  const tilt = TILT - 20 * (1 - eo(p(t, 0, 1.0)));
  $('book').style.transform = `scale(1.12) rotateX(${tilt}deg) rotateZ(${Math.sin(t * 0.4) * 1.2}deg) translateY(${Math.sin(t * 0.7) * 6}px)`;
  // which spread is open
  let si = 0; for (let i = 0; i < SPREADS.length; i++) if (t >= SPREADS[i][0] - 0.6) si = i;
  // page flip between spreads: leaf turns from the left page over to the right (Arabic book direction)
  let flip = -1; for (let i = 1; i < SPREADS.length; i++) { const a = SPREADS[i][0] - 0.6; if (t >= a && t < a + 0.6) flip = p(t, a, a + 0.6); }
  $('leaf').style.opacity = flip >= 0 ? 1 : 0; $('leaf').style.transform = `rotateY(${-eio(Math.max(0, flip)) * 180}deg) translateZ(2px)`;
  // pop-ups: fold down before a flip, stand up after it
  POPS.forEach((arr, s) => arr.forEach(({ d, x, y, w, j }) => {
    const open = SPREADS[s][0]; const close = s + 1 < SPREADS.length ? SPREADS[s + 1][0] - 0.6 : T.print - 0.25;
    const up = eb(p(t, open + j * 0.08, open + 0.55 + j * 0.08)); const down = eio(p(t, close - 0.35, close));
    const k = Math.max(0, up - down); const vis = t >= open - 0.05 && t < close;
    d.style.display = vis ? 'block' : 'none';
    d.style.transform = `translate(${x}px, ${y - d.offsetHeight}px) rotateX(${-(TILT) * k}deg) translateZ(1px)`;
  }));
  // uses extras
  const ua = [T.u1 - 0.15, T.u2 - 0.15]; const usesOpen = t >= T.u0 - 0.6 && t < T.print - 0.25;
  EXTRA.forEach(({ d, i }) => { const k = Math.max(0, eb(p(t, ua[i], ua[i] + 0.55)) - eio(p(t, T.print - 0.6, T.print - 0.25)));
    d.style.display = usesOpen && t >= ua[i] - 0.05 ? 'block' : 'none';
    d.style.transform = `translate(${i ? 520 : 110}px, ${(i ? 640 : 600) - d.offsetHeight}px) rotateX(${-TILT * k}deg) translateZ(${3 + i}px)`; });
  // in the uses spread, earlier items fold away as each new use stands up
  if (si === 4) POPS[4].forEach(({ d }, j) => { if (t > ua[0] - 0.2) d.style.transform += ` scale(${1 - 0.5 * eo(p(t, ua[0] - 0.2, ua[0] + 0.2))})`; d.style.opacity = 1 - 0.6 * p(t, ua[0] - 0.2, ua[0] + 0.2); });

  // captions
  let c1 = SPREADS[si][1], c2 = SPREADS[si][2], ca = SPREADS[si][0];
  if (si === 4) { if (t >= ua[1] - 0.05) { c1 = EXTRA[1].cap; ca = ua[1]; } else if (t >= ua[0] - 0.05) { c1 = EXTRA[0].cap; ca = ua[0]; } }
  if (si === 3) { $('cap').textContent = (Math.round(116 * eo(p(t, ca, ca + 1.2)))).toLocaleString('ar-EG') + ' ستيكر'; } else $('cap').textContent = c1;
  $('cap2').textContent = c2;
  const sub = si === 0 ? T.h2 : si === 3 ? T.n2 : ca + 0.5;
  const k1 = eb(p(t, si === 0 ? T.h1 : ca, (si === 0 ? T.h1 : ca) + 0.45)), k2 = eb(p(t, sub, sub + 0.45));
  const hide = t >= T.print - 0.25;
  $('cap').style.opacity = hide ? 0 : p(t, si === 0 ? T.h1 : ca, (si === 0 ? T.h1 : ca) + 0.08); $('cap').style.transform = `scale(${k1})`;
  $('cap2').style.opacity = hide || !c2 ? 0 : p(t, sub, sub + 0.08); $('cap2').style.transform = `scale(${k2})`;

  // print: a loose page slides up out of the book
  const pa = T.print - 0.25; const pk = eo(p(t, pa, pa + 0.8)); const pout = p(t, T.brand - 0.5, T.brand - 0.25);
  $('sheet').style.opacity = t >= pa && !ending ? 1 - pout : 0; $('sheet').style.transform = `translate(270px, ${1100 - pk * 650}px) rotate(${-4 + pk * 2}deg) scale(${0.7 + 0.3 * pk})`;
  if (t >= pa && t < pa + 0.6) { $('cap').textContent = 'ملف PDF'; }
  if (t >= pa) { $('cap').textContent = 'ملف PDF'; $('cap').style.opacity = ending ? 0 : 1; $('cap').style.transform = `scale(${eb(p(t, T.print, T.print + 0.45))})`;
    $('cap2').textContent = 'جاهز للطباعة'; $('cap2').style.opacity = ending ? 0 : p(t, T.print + 0.6, T.print + 0.7); $('cap2').style.transform = `scale(${eb(p(t, T.print + 0.6, T.print + 1.05))})`; }
  [[90, 1500], [680, 1360]].forEach(([x, y], i) => { const c = eb(p(t, pa + 1.0 + i * 0.3, pa + 1.4 + i * 0.3)); const e = $('ch' + i); e.style.opacity = t >= pa + 1.0 + i * 0.3 && !ending ? 1 : 0; e.style.transform = `translate(${x}px,${y}px) scale(${c}) rotate(${(i - 0.5) * 8}deg)`; });

  // end: closed book cover with the QR
  if (ending) {
    const a = T.brand - 0.25; const k = eo(p(t, a, a + 0.6));
    $('endCover').style.transform = `perspective(2000px) rotateX(${(1 - k) * 50}deg) scale(${0.9 + 0.1 * k})`;
    ['e1', 'e2b', 'e2', 'e3'].forEach((id, i) => { const at = [T.brand, T.store - 0.1, T.store2 - 0.1, T.store2 + 0.3][i]; const kk = eb(p(t, at, at + 0.45)); $(id).style.opacity = p(t, at, at + 0.08); $(id).style.transform = `scale(${kk})`; });
    const q = eb(p(t, a + 0.4, a + 0.9)); $('qr').style.transform = `scale(${q})`; $('qr').style.opacity = p(t, a + 0.4, a + 0.45);
  }
};
render(0);
</script>
</body></html>
