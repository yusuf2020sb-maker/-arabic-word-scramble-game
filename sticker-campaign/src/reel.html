<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;800&family=Reem+Kufi:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#d6bcac; --cream:#f7efe6; --ink:#4a2412; --accent:#8c2f1f; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1080px; height:1920px; overflow:hidden; background:var(--bg); font-family:'Tajawal',sans-serif; color:var(--ink); }
  .scene { position:absolute; inset:0; opacity:0; overflow:clip; }
  .abs { position:absolute; }
  h1 { font-family:'Reem Kufi',sans-serif; font-weight:700; font-size:104px; line-height:1.15; text-align:center; width:100%; }
  .sub { font-weight:800; font-size:48px; text-align:center; width:100%; }
  .page { position:absolute; left:110px; top:720px; width:860px; height:860px; background:var(--cream); border-radius:18px; box-shadow:0 18px 50px rgba(74,36,18,.25);
          background-image:repeating-linear-gradient(to bottom, transparent 0 58px, rgba(74,36,18,.12) 58px 60px); }
  .stk { position:absolute; filter:drop-shadow(0 10px 14px rgba(74,36,18,.3)); transform-origin:center; }
  .cover { position:absolute; left:50%; top:640px; width:620px; margin-left:-310px; border-radius:14px; box-shadow:0 20px 50px rgba(74,36,18,.35); }
  .btn { position:absolute; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--cream); font-weight:800; font-size:52px; padding:30px 80px; border-radius:80px; white-space:nowrap; }
  .word { display:inline-block; margin:0 18px; }
</style>
</head>
<body>

<!-- S1: hook -->
<div class="scene" id="s1">
  <h1 class="abs" id="s1t" style="top:430px">عندك طابعة<br>في البيت؟</h1>
  <img class="stk" id="s1a" src="cut/journal_0.png" style="left:290px; top:860px; width:500px">
</div>

<!-- S2: print, cut, stick -->
<div class="scene" id="s2">
  <div class="sub abs" style="top:430px; font-size:76px; font-family:'Reem Kufi'">
    <span class="word" id="w1">طباعة</span><span class="word" id="w2">قص</span><span class="word" id="w3">لصق</span>
  </div>
  <div class="page"></div>
</div>

<!-- S3: collections carousel + counter -->
<div class="scene" id="s3">
  <h1 class="abs" style="top:300px"><span id="cnt">1</span> مجموعة</h1>
  <div class="sub abs" style="top:460px; opacity:.8">كل مجموعة ملف PDF مستقل</div>
</div>

<!-- S4: use cases -->
<div class="scene" id="s4">
  <h1 class="abs" style="top:290px; font-size:92px">لمسة فنتج لكوبك<br>وجوالك وهداياك</h1>
  <div class="abs" style="left:90px; top:640px; width:900px; height:1020px; overflow:hidden; border-radius:26px; box-shadow:0 20px 50px rgba(74,36,18,.3)">
    <img id="mock" src="mockup.png" style="width:100%; transform-origin:50% 30%">
  </div>
</div>

<!-- S5: CTA -->
<div class="scene" id="s5">
  <h1 class="abs" style="top:330px; font-size:110px">ستيكرات فنتج</h1>
  <div class="sub abs" style="top:500px">تحميل فوري · طباعة في البيت</div>
  <div class="btn" id="btn" style="top:1380px">المتجر 👇</div>
</div>

<!-- S6: store QR -->
<div class="scene" id="s6">
  <h1 class="abs" style="top:330px; font-size:96px">المتجر هنا</h1>
  <div class="sub abs" style="top:480px; opacity:.85">الكود يوصلك للمتجر مباشرة</div>
  <div class="abs" id="qrcard" style="left:240px; top:640px; width:600px; height:600px; background:#fff; border-radius:40px; box-shadow:0 24px 60px rgba(74,36,18,.3); padding:30px">
    <img src="qr_store.png" style="width:100%; height:100%">
  </div>
  <div class="sub abs" style="top:1300px; font-size:52px; direction:ltr">planme.zaher.io</div>
</div>

<script>
const clamp = (x) => Math.min(1, Math.max(0, x));
const p = (t, a, b) => clamp((t - a) / (b - a));
const back = (x) => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const outCubic = (x) => 1 - Math.pow(1 - x, 3);
const inOut = (x) => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const $ = (id) => document.getElementById(id);

const SCENES = [['s1', 0, 2.1], ['s2', 2.1, 8.4], ['s3', 8.4, 13.9], ['s4', 13.9, 17.8], ['s5', 17.8, 20.8], ['s6', 20.8, 25.5]];
const FADE = 0.3;

// S2 stickers placed on the journal page
const S2 = [
  ['cozyautumn_0', 160, 760, 300, -8], ['heritage_4', 560, 740, 260, 6], ['roses_2', 370, 900, 320, -3],
  ['journal_4', 140, 1080, 330, 5], ['cozyhome_1', 560, 1040, 280, -6], ['autumn_ar_5', 400, 1230, 260, 4],
  ['ephemera_1', 140, 1330, 270, -5], ['vintage_0', 640, 1300, 250, 8], ['heritage_2', 820, 880, 200, -10],
].map(([src, x, y, w, r], i) => {
  const el = document.createElement('img');
  el.src = `cut/${src}.png`; el.className = 'stk';
  Object.assign(el.style, { left: x + 'px', top: y + 'px', width: w + 'px' });
  $('s2').appendChild(el);
  return { el, r, at: 2.4 + i * 0.6 };
});

// S3 covers
const COVERS = ['cozyhome', 'journal', 'cozyautumn', 'roses', 'heritage', 'stamps', 'ephemera', 'autumn_ar', 'vintage', 'botanical', 'vases']
  .map((n) => { const el = document.createElement('img'); el.src = `small/${n}.jpg`; el.className = 'cover'; $('s3').appendChild(el); return el; });

// S5 background stickers
const S5 = ['journal_2', 'heritage_1', 'roses_0', 'cozyhome_3', 'cozyautumn_2', 'autumn_ar_0', 'ephemera_4', 'vintage_3']
  .map((n, i) => {
    const el = document.createElement('img'); el.src = `cut/${n}.png`; el.className = 'stk';
    const pos = [[60, 700], [760, 690], [80, 1000], [790, 1010], [420, 700], [420, 1020], [140, 1640], [700, 1640]][i];
    Object.assign(el.style, { left: pos[0] + 'px', top: pos[1] + 'px', width: '240px' });
    $('s5').appendChild(el); return el;
  });

window.render = (t) => {
  SCENES.forEach(([id, a, b], i) => {
    const fin = i === 0 ? 1 : p(t, a, a + FADE);
    const fout = i === SCENES.length - 1 ? 1 : 1 - p(t, b, b + FADE);
    const o = Math.min(fin, fout); $(id).style.opacity = o; $(id).style.display = o > 0 ? '' : 'none';
  });

  // S1
  const h = back(p(t, 0.1, 0.7));
  $('s1t').style.transform = `scale(${0.6 + 0.4 * h})`;
  $('s1t').style.opacity = p(t, 0.1, 0.4);
  const a = p(t, 0.9, 1.35);
  $('s1a').style.opacity = a > 0 ? 1 : 0;
  $('s1a').style.transform = `scale(${1.8 - 0.8 * outCubic(a)}) rotate(${-14 + 10 * outCubic(a) + Math.sin(t * 2) * 2}deg)`;

  // S2
  [['w1', 3.85], ['w2', 4.6], ['w3', 5.25]].forEach(([id, at]) => {
    const k = p(t, at, at + 0.35);
    $(id).style.opacity = k; $(id).style.transform = `translateY(${(1 - outCubic(k)) * 40}px)`;
  });
  S2.forEach(({ el, r, at }) => {
    const k = p(t, at, at + 0.3);
    el.style.opacity = k > 0 ? 1 : 0;
    el.style.transform = `scale(${0.2 + 0.8 * back(k)}) rotate(${r}deg)`;
  });

  // S3
  const s = Math.max(0, (t - 8.5) / 0.48);
  const k = Math.min(COVERS.length - 1, Math.floor(s) + inOut(s % 1));
  COVERS.forEach((el, i) => {
    const d = Math.max(-2.5, Math.min(2.5, i - k));
    el.style.transform = `translateX(${-d * 560}px) scale(${1 - Math.min(Math.abs(d), 2) * 0.18}) rotate(${d * 4}deg)`;
    el.style.zIndex = 100 - Math.round(Math.abs(d) * 10);
    el.style.opacity = Math.abs(d) > 2.2 ? 0 : 1;
  });
  $('cnt').textContent = Math.min(COVERS.length, Math.round(k) + 1);

  // S4
  $('mock').style.transform = `scale(${1.02 + 0.12 * p(t, 13.9, 18.1)})`;

  // S5
  S5.forEach((el, i) => {
    const k = p(t, 18.0 + i * 0.08, 18.4 + i * 0.08);
    el.style.opacity = 0.9 * (k > 0 ? 1 : 0);
    el.style.transform = `scale(${0.3 + 0.7 * back(k)}) rotate(${(i % 2 ? 6 : -6) + Math.sin(t * 3 + i) * 2}deg)`;
  });
  const pulse = 1 + 0.04 * Math.sin(Math.max(0, t - 18.6) * 6);
  $('btn').style.transform = `translateX(-50%) scale(${back(p(t, 18.4, 18.8)) * pulse})`;
  $('qrcard').style.transform = `scale(${0.4 + 0.6 * back(p(t, 20.9, 21.4))})`;
};
render(0);
</script>
</body>
</html>
