<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@800&family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root { --brown:#4a2614; --rust:#a8401f; --cream:#fff4e2; --kraft:#c9a173; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:clip; background:#f2cf9e; font-family:'Noto Kufi Arabic','Cairo',sans-serif; color:var(--brown); }
  #stage { position:absolute; left:0; top:0; width:1080px; height:1920px; overflow:clip; background:linear-gradient(180deg, #fbe7c6 0%, #f3cf9b 45%, #e5a466 100%); }
  #sun { position:absolute; left:640px; top:120px; width:420px; height:420px; border-radius:50%; background:radial-gradient(circle, rgba(255,246,210,.95), rgba(255,220,150,.5) 45%, transparent 70%); }
  #hills { position:absolute; left:0; top:1560px; width:1080px; height:360px; background:linear-gradient(180deg, #c47a3e, #8f4f24); clip-path:polygon(0 35%, 15% 22%, 32% 30%, 50% 15%, 68% 28%, 84% 18%, 100% 30%, 100% 100%, 0 100%); }
  .abs { position:absolute; left:0; top:0; }
  .grp { position:absolute; left:0; top:0; width:1080px; height:1920px; display:none; z-index:2; }
  #drift { position:absolute; left:0; top:0; z-index:1; }
  .hang { position:absolute; left:0; top:0; transform-origin:50% 0; will-change:transform; }
  .hang img.card { display:block; filter:drop-shadow(8px 16px 14px rgba(74,38,20,.35)); }
  .peg { position:absolute; left:50%; top:-26px; width:34px; height:80px; margin-left:-17px; border-radius:6px; background:linear-gradient(90deg, #b9875a, #e2b98a 50%, #a9784d); box-shadow:2px 4px 4px rgba(0,0,0,.25); z-index:3; }
  .peg:after { content:''; position:absolute; left:15px; top:8px; width:4px; height:64px; background:rgba(80,50,30,.4); }
  .tag { background:var(--cream); border:4px solid var(--kraft); border-radius:18px; padding:22px 44px 38px; text-align:center; white-space:nowrap; box-shadow:8px 16px 14px rgba(74,38,20,.3); }
  .leafF { position:absolute; left:0; top:0; will-change:transform; filter:drop-shadow(4px 8px 6px rgba(74,38,20,.25)); }
  .line { position:absolute; left:0; width:1080px; text-align:center; white-space:nowrap; line-height:1.4; }
  .w { display:inline-block; }
  svg path.rope { fill:none; stroke:#7a5330; stroke-width:7; stroke-linecap:round; }
</style></head><body>
<div id="stage">
  <div id="sun"></div><div id="hills"></div>
  <svg id="ropes" class="abs" width="1080" height="1920"></svg>
  <div class="grp" id="g1"></div><div class="grp" id="g2"></div><div class="grp" id="g3"></div><div class="grp" id="g4"></div><div class="grp" id="g5"></div><div class="grp" id="g6"></div>
  <div id="drift"></div><div id="gust"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const p = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eb = (x) => { const c = 1.7; return x <= 0 ? 0 : 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const R = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

const D = { h1: 0.3, h2: 1.5, c1: 3.4, c2: 4.8, c3: 6.2, count: 8.0, n2: 9.4, u0: 11.0, u1: 12.2, u2: 13.4, print: 15.2, print2: 16.3, brand: 18.0, store: 19.6, store2: 20.3, end_all: 23.4 };
const T = Object.assign({}, D, window.TL || {});
const CUT = [T.c1 - 0.4, T.count - 0.35, T.u0 - 0.35, T.print - 0.35, T.brand - 0.35];
const GR = [['g1', 0, CUT[0]], ['g2', CUT[0], CUT[1]], ['g3', CUT[1], CUT[2]], ['g4', CUT[2], CUT[3]], ['g5', CUT[3], CUT[4]], ['g6', CUT[4], 99]];
const sceneAt = (t) => GR.findIndex(([, a, b]) => t >= a && t < b);
const gustAt = (t) => { let g = 0; for (const c of CUT) g = Math.max(g, Math.sin(Math.PI * p(t, c - 0.5, c + 0.5))); return g; };

// ropes per scene: list of y positions (sag 60)
const ROPES = [[880], [420], [380, 900, 1420], [380], [420], [420]];
const ropeY = (y, x, t) => y + 60 * Math.sin(Math.PI * x / 1080) + Math.sin(t * 1.6) * 6;
// hanging items: [scene, html, x(center), ropeY, enterAt, leaveAt?, amp]
const H = [];
const add = (sc, html, x, ry, a, b, amp = 4) => { const d = document.createElement('div'); d.className = 'hang'; d.innerHTML = `<div class="peg"></div>${html}`; $(GR[sc][0]).appendChild(d); H.push({ d, sc, x, ry, a, b, amp, i: H.length }); return d; };
const card = (n, w) => `<img class="card" src="autumn/${n}.png" style="width:${w}px">`;
const tag = (txt, fs, color, id) => `<div class="tag" style="font-size:${fs}px; color:${color || 'var(--brown)'}"><span class="w" ${id ? `id="${id}"` : ''}>${txt}</span></div>`;

// S1
add(0, card('b7', 260), 230, 880, 0.15); add(0, card('b4', 300), 540, 880, 0.3); add(0, card('b13', 220), 850, 880, 0.45);
const hA = add(0, tag('هبّت ريح الخريف…', 92), 540, 130, T.h1 - 0.25, undefined, 1.2);
const hB = add(0, tag('وجابت معها ستيكرات!', 74, 'var(--rust)'), 540, 1420, T.h2 - 0.25, undefined, 1.2);
// S2: three items swap on one rope
const IT = [['فطر وحكايات', card('b12', 460)], ['فوانيس دافية', card('b27', 420)], ['وأوراق شجر', `<div style="display:flex; gap:20px; align-items:flex-start">${card('b37', 260)}${card('b33', 200)}${card('b40', 240)}</div>`]];
const its = IT.map(([cap, html], i) => ({ c: add(1, html, 540, 420, [T.c1, T.c2, T.c3][i] - 0.35, i < 2 ? [T.c2, T.c3][i] - 0.35 : undefined, 5), t: add(1, tag(cap, 110), 540, 1330, [T.c1, T.c2, T.c3][i] - 0.1, i < 2 ? [T.c2, T.c3][i] - 0.35 : undefined, 3) }));
// S3: three ropes full of cards + count tag
const S3N = [['b14', 'b15', 'b16', 'b17', 'b18'], ['b19', 'b20', 'b21', 'b22', 'b23'], ['b24', 'b26', 'b28', 'b29', 'b30']];
S3N.forEach((row, r) => row.forEach((n, c) => add(2, card(n, 150), 120 + c * 210, ROPES[2][r], CUT[1] + 0.1 + (r * 5 + c) * 0.04, undefined, 6)));
add(2, `<div class="tag" style="padding:10px 60px 26px"><div style="font-family:Cairo; font-weight:900; font-size:220px; line-height:1.05; color:var(--rust)" id="n41">٤١</div><div style="font-size:84px">ستيكر</div></div>`, 540, 610, CUT[1] + 0.3, undefined, 2);
const n2 = add(2, tag('بلون الخريف', 90, 'var(--rust)'), 540, 1640, T.n2 - 0.3, undefined, 2);
// S4: uses (objects hang from the rope)
const JRN = `<div style="width:560px; height:740px; background:#f6ead4; border-radius:10px; box-shadow:8px 16px 14px rgba(74,38,20,.3); background-image:repeating-linear-gradient(180deg, transparent 0 64px, rgba(120,90,60,.2) 64px 66px); position:relative"><img src="autumn/b9.png" style="position:absolute; left:40px; top:60px; width:220px; transform:rotate(-5deg)"><img src="autumn/b34.png" style="position:absolute; left:300px; top:120px; width:220px; transform:rotate(8deg)"><img src="autumn/b25.png" style="position:absolute; left:160px; top:380px; width:180px; transform:rotate(4deg)"></div>`;
const CRD = `<div style="width:520px; height:700px; background:#fffaf0; border:6px solid #c9a173; border-radius:16px; box-shadow:8px 16px 14px rgba(74,38,20,.3); position:relative"><img src="autumn/b31.png" style="position:absolute; left:120px; top:50px; width:280px"><div style="position:absolute; left:80px; right:80px; top:560px; height:12px; border-radius:6px; background:#ecd9bd"></div><div style="position:absolute; left:130px; right:130px; top:610px; height:12px; border-radius:6px; background:#ecd9bd"></div></div>`;
const GFT = `<div style="width:600px; height:560px; background:#b98d58; border-radius:12px; box-shadow:8px 16px 14px rgba(74,38,20,.3); position:relative"><div style="position:absolute; left:270px; top:0; width:60px; height:560px; background:#a8401f"></div><img src="autumn/b32.png" style="position:absolute; left:40px; top:120px; width:200px; transform:rotate(-8deg)"><img src="autumn/b42.png" style="position:absolute; left:360px; top:150px; width:200px; transform:rotate(10deg)"></div>`;
const U = [['للجورنال', JRN], ['للبطاقات', CRD], ['ولتغليف الهدايا', GFT]];
const uat = () => [CUT[2] + 0.1, T.u1 - 0.3, T.u2 - 0.3];
U.forEach(([cap, html], i) => { add(3, html, 540, 380, uat()[i], i < 2 ? uat()[i + 1] : undefined, 3); add(3, tag(cap, 110), 540, 1300, uat()[i] + 0.15, i < 2 ? uat()[i + 1] : undefined, 2); });
// S5: print sheet with two pegs
add(4, `<img class="card" src="autumn/sheet2.jpg" style="width:560px; border-radius:6px">`, 540, 420, CUT[3] + 0.1, undefined, 3);
add(4, tag('ملف PDF', 100), 540, 1300, T.print - 0.3, undefined, 2); add(4, tag('جاهز للطباعة', 84, 'var(--rust)'), 540, 1560, T.print2 - 0.3, undefined, 2);
// S6: QR pegged + texts
add(5, `<div style="background:#fff; padding:24px; border-radius:16px; box-shadow:8px 16px 14px rgba(74,38,20,.3)"><img src="qr_store.png" style="width:420px; height:420px; display:block"></div>`, 540, 420, CUT[4] + 0.25, undefined, 1.2);
add(5, tag('ستيكرات خريفية فنتج', 70), 540, 120, T.brand - 0.3, undefined, 1.5);
add(5, card('b5', 200), 140, 420, CUT[4] + 0.5, undefined, 4); add(5, card('b10', 200), 940, 420, CUT[4] + 0.6, undefined, 4);
add(5, tag('متوفرة في', 70), 540, 1090, T.store - 0.3, undefined, 2);
add(5, `<div class="tag" style="font-size:150px; background:var(--rust); color:var(--cream); border-color:#7a2a12">متجر دُر</div>`, 540, 1270, T.store2 - 0.35, undefined, 2);
add(5, `<div class="tag" style="font-size:44px; font-family:Cairo; direction:ltr; padding:10px 40px 16px">planme.zaher.io</div>`, 540, 1600, T.store2 + 0.1, undefined, 2);

// drifting and gust leaves
const LV = ['b33', 'b34', 'b35', 'b36', 'b37', 'b38', 'b39', 'b40', 'b41', 'b42', 'b43', 'b44'];
const drift = [...Array(10)].map((_, i) => { const im = document.createElement('img'); im.className = 'leafF'; im.src = `autumn/${LV[i % LV.length]}.png`; im.style.width = (60 + R(i) * 60) + 'px'; $('drift').appendChild(im); return im; });
const gust = [...Array(34)].map((_, i) => { const im = document.createElement('img'); im.className = 'leafF'; im.src = `autumn/${LV[(i * 5) % LV.length]}.png`; im.style.width = (110 + R(i + 50) * 130) + 'px'; im.style.zIndex = 50; $('gust').appendChild(im); return im; });

window.render = (t) => {
  const sc = sceneAt(t); const g = gustAt(t);
  GR.forEach(([id], i) => ($(id).style.display = i === sc ? 'block' : 'none'));
  $('stage').style.opacity = 1 - p(t, T.end_all - 0.5, T.end_all);
  $('ropes').innerHTML = ROPES[sc].map((y) => `<path class="rope" d="M -20 ${ropeY(y, 0, t) - 30} Q 540 ${ropeY(y, 540, t) + 60} 1100 ${ropeY(y, 1080, t) - 30}"/>`).join('');
  for (const { d, sc: s, x, ry, a, b, amp, i } of H) { if (s !== sc) continue;
    const ink = p(t, a, a + 0.6); const out = b !== undefined ? p(t, b, b + 0.45) : 0;
    const blowIn = (1 - eo(ink)) * 900; const blowOut = eio(out) * -1300;
    const sway = amp * Math.sin(t * 1.9 + i * 0.7) + g * 18 + (1 - ink) * 35 * Math.sin(ink * 12) + out * 40;
    const y = ropeY(ry, x, t) + (ry < 300 ? 0 : 0);
    d.style.opacity = ink > 0 && out < 1 ? 1 : 0;
    d.style.transform = `translate(${x + blowIn + blowOut}px, ${y + 20}px) translateX(-50%) rotate(${sway}deg)`; }
  // count
  if (sc === 2) $('n41').textContent = Math.round(41 * eo(p(t, CUT[1] + 0.4, CUT[1] + 1.3))).toLocaleString('ar-EG');
  // leaves
  drift.forEach((im, i) => { const y = ((R(i + 3) * 2000 + t * (90 + R(i) * 80)) % 2100) - 100; const x = ((R(i + 7) * 1300 - t * (60 + R(i + 1) * 80)) % 1300 + 1300) % 1300 - 110;
    im.style.transform = `translate(${x + Math.sin(t * 2 + i) * 40}px, ${y}px) rotate(${t * (60 + R(i) * 120)}deg)`; im.style.opacity = 0.85; });
  gust.forEach((im, i) => { let k = -1; for (const c of CUT) { const s = c - 0.55 + R(i + 9) * 0.25; if (t >= s && t < s + 0.95) k = p(t, s, s + 0.95); }
    if (k < 0) { im.style.opacity = 0; return; } const y = R(i + 20) * 1900 + Math.sin(k * 6 + i) * 80 - 60; const x = 1250 - k * 1600;
    im.style.opacity = 1; im.style.transform = `translate(${x}px, ${y}px) rotate(${k * 540 + i * 30}deg)`; });
};
render(0);
</script>
</body></html>
