<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@500;700&family=Aref+Ruqaa:wght@700&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --paper:#f3ece0; --paper-d:#e6dccb; --ink:#2f3d2c; --sage:#8a9a74; --rose:#b0645b; --rose-l:#e9c9bf; --kraft:#c49a6c; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:clip; background:var(--paper); color:var(--ink); font-family:'Tajawal',sans-serif; }
  #stage { position:absolute; left:0; top:0; width:1080px; height:1920px; overflow:clip; }
  .scene { position:absolute; left:0; top:0; width:1080px; height:1920px; overflow:clip; display:none; }
  .abs { position:absolute; }
  .line { position:absolute; left:0; width:1080px; text-align:center; }
  .em { font-family:'El Messiri',serif; font-weight:700; line-height:1.2; }
  .rq { font-family:'Aref Ruqaa',serif; font-weight:700; line-height:1.2; }
  .st { position:absolute; left:0; top:0; filter:drop-shadow(0 18px 22px rgba(60,40,25,.28)); will-change:transform; }
  #paper { position:absolute; left:0; top:0; width:1080px; height:1920px;
    background: radial-gradient(ellipse at 50% 40%, #fbf6ee 0%, var(--paper) 55%, var(--paper-d) 100%); }
  #grain { position:absolute; left:0; top:0; width:1080px; height:1920px; opacity:.35; mix-blend-mode:multiply; }
  #leak { position:absolute; left:0; top:0; width:1500px; height:1500px; border-radius:50%; mix-blend-mode:screen; pointer-events:none;
    background:radial-gradient(circle, rgba(255,200,150,.55), rgba(255,180,140,0) 65%); }
  #vig { position:absolute; left:0; top:0; width:1080px; height:1920px; pointer-events:none;
    background:radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(80,55,35,.22) 100%); }
  .petal { position:absolute; left:0; top:0; border-radius:80% 0 80% 0; }
  #flash { position:absolute; left:0; top:0; width:1080px; height:1920px; background:#fffaf2; opacity:0; pointer-events:none; }
  .drop { position:absolute; left:0; top:0; width:26px; height:36px; border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    background:radial-gradient(circle at 35% 35%, #fff, #b9d4dc 45%, #7fa6b3); opacity:.9; }
  .ring { position:absolute; left:0; top:0; border:3px solid rgba(127,166,179,.7); border-radius:50%; }
  /* plates */
  .plate { position:absolute; left:150px; top:520px; width:780px; height:1000px; background:#fbf7ef; transform-origin:100% 50%;
    box-shadow:0 30px 60px rgba(70,50,30,.25); border-radius:6px; }
  .plate::before { content:''; position:absolute; left:28px; top:28px; right:28px; bottom:28px; border:2px solid var(--sage); }
  .plate::after { content:''; position:absolute; left:40px; top:40px; right:40px; bottom:40px; border:1px solid rgba(138,154,116,.5); }
  .plate .no { position:absolute; left:0; width:780px; top:70px; text-align:center; font-size:34px; font-weight:700; color:var(--sage); letter-spacing:.2em; }
  .plate img { position:absolute; left:140px; top:150px; width:500px; height:600px; object-fit:contain; filter:drop-shadow(0 14px 16px rgba(60,40,25,.25)); }
  .plate .nm { position:absolute; left:0; width:780px; top:790px; text-align:center; font-size:110px; color:var(--rose); }
  .plate .ul { position:absolute; left:240px; top:930px; width:300px; height:4px; background:var(--ink); transform-origin:100% 50%; border-radius:2px; }
  .tape { position:absolute; width:170px; height:56px; background:rgba(233,201,191,.75); }
  /* uses */
  .vg { position:absolute; left:0; top:0; width:1080px; height:1920px; overflow:clip; }
  .cap { position:absolute; left:0; width:1080px; top:250px; text-align:center; font-size:120px; }
  .chip { position:absolute; left:0; top:0; padding:16px 34px; border-radius:60px; background:var(--ink); color:var(--paper); font-size:46px; font-weight:800; white-space:nowrap; }
  .chip span { direction:rtl; unicode-bidi:isolate; }
  #qr { position:absolute; left:340px; top:700px; width:400px; height:400px; background:#fffaf2; padding:26px; border-radius:24px; box-shadow:0 20px 50px rgba(70,50,30,.25); }
  #qr img { width:100%; height:100%; display:block; }
</style></head><body>
<div id="stage">
  <div id="paper"></div>
  <svg id="grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .35  0 0 0 0 .25  0 0 0 .55 0"/></filter><rect width="1080" height="1920" filter="url(#n)"/></svg>
  <div id="leak"></div>

  <!-- S1 hook + reveal (one continuous shot) -->
  <div class="scene" id="s1">
    <div id="ghost" class="abs" style="left:230px; top:640px; width:620px; height:700px"></div>
    <img id="hero" class="st" src="botan/b19.png" style="width:620px">
    <div id="drops"></div>
    <div class="line em" style="top:200px; font-size:170px; color:var(--ink)"><span id="h1" style="display:inline-block">ورد…</span></div>
    <div class="line em" style="top:410px; font-size:118px; color:var(--rose)"><span id="h2" style="display:inline-block">ما يحتاج موية</span></div>
    <div class="line em" style="top:1440px; font-size:112px; color:var(--ink)"><span id="h3" style="display:inline-block">ولا يذبل أبد</span></div>
    <div class="line em" style="top:1380px; font-size:150px; color:var(--rose)"><span id="rv" style="display:inline-block">لأنه ستيكرات!</span></div>
  </div>

  <!-- S2 phyllotaxis bloom -->
  <div class="scene" id="s2">
    <div class="line em" style="top:150px; font-size:300px; color:var(--ink); line-height:1"><span id="cnt" style="display:inline-block">٤٦</span></div>
    <div class="line em" style="top:470px; font-size:92px; color:var(--rose)"><span id="c1" style="display:inline-block">ستيكر نباتي</span></div>
    <div class="line em" style="top:590px; font-size:76px; color:var(--sage)"><span id="c2" style="display:inline-block">بطابع فنتج</span></div>
    <div id="spiral" class="abs" style="left:0; top:0; width:1080px; height:1920px"></div>
  </div>

  <!-- S3 herbarium plates -->
  <div class="scene" id="s3">
    <div class="line em" style="top:250px; font-size:84px; color:var(--ink)"><span id="k0" style="display:inline-block">من الحديقة… للورق</span></div>
    <div id="plates"></div>
  </div>

  <!-- S4 uses -->
  <div class="scene" id="s4"></div>

  <!-- S5 print -->
  <div class="scene" id="s5">
    <div class="line em" style="top:220px; font-size:110px; color:var(--ink)"><span id="p1" style="display:inline-block">ملف PDF</span></div>
    <div class="line em" style="top:370px; font-size:84px; color:var(--rose)"><span id="p2" style="display:inline-block">جاهز للطباعة في البيت</span></div>
    <img id="sh2" class="abs" src="botan/sheet3.jpg" style="left:0; top:0; width:560px; box-shadow:0 30px 60px rgba(70,50,30,.3)">
    <img id="sh1" class="abs" src="botan/sheet2.jpg" style="left:0; top:0; width:560px; box-shadow:0 30px 60px rgba(70,50,30,.3)">
    <div id="sheen" class="abs" style="left:0; top:0; width:560px; height:792px; pointer-events:none; background:linear-gradient(105deg, transparent 40%, rgba(255,255,255,.55) 50%, transparent 60%); background-size:300% 100%; mix-blend-mode:screen"></div>
    <div class="chip" id="ch0"><span>A4</span></div>
    <div class="chip" id="ch1"><span>٤٦ تصميم</span></div>
    <div class="chip" id="ch2"><span>تحميل فوري</span></div>
  </div>

  <!-- S6 wreath end card -->
  <div class="scene" id="s6">
    <div class="line em" style="top:170px; font-size:104px; color:var(--ink)"><span id="e1" style="display:inline-block">ستيكرات نباتية فنتج</span></div>
    <div id="wreath"></div>
    <div id="qr"><img src="qr_store.png"></div>
    <div class="line em" style="top:1420px; font-size:100px; color:var(--rose)"><span id="e2" style="display:inline-block">في المتجر</span></div>
    <div class="line" style="top:1570px; font-size:50px; font-weight:800; color:var(--ink); direction:ltr"><span id="e3" style="display:inline-block">planme.zaher.io</span></div>
  </div>

  <div id="petals"></div>
  <div id="vig"></div>
  <div id="flash"></div>
</div>
<script src="reel23_timeline.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const p = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
const eo = (x) => 1 - Math.pow(1 - x, 3);
const eio = (x) => (x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const eb = (x) => { const c = 1.9; return x <= 0 ? 0 : 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const R = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// timeline: voice timeline if present, else defaults for the silent cut
const D = { h1: 0.25, h2: 1.0, h3: 2.2, rev: 3.6, count: 6.4, kinds: 10.4, k1: 11.3, k2: 12.3, k3: 13.3, k4: 14.3,
  u0: 15.6, u1: 17.1, u2: 18.6, print: 20.2, brand: 23.0, store: 24.4, end_all: 27.0 };
const T = Object.assign({}, D, window.TL || {});
const CUT = [T.count - 0.15, T.kinds - 0.15, T.u0 - 0.15, T.print - 0.15, T.brand - 0.15];
const SC = [['s1', 0, CUT[0]], ['s2', CUT[0], CUT[1]], ['s3', CUT[1], CUT[2]], ['s4', CUT[2], CUT[3]], ['s5', CUT[3], CUT[4]], ['s6', CUT[4], 99]];

// line reveal: blur + rise
const show = (id, t, a, out) => {
  const k = eo(p(t, a, a + 0.6)); const o = out ? 1 - p(t, out, out + 0.35) : 1;
  const el = $(id); el.style.opacity = k * o; el.style.filter = `blur(${(1 - k) * 18}px)`;
  el.style.transform = `translateY(${(1 - k) * 50}px) scale(${0.94 + 0.06 * k})`;
};

// petals: ambient drift + sweeps at cuts
const PET = [];
for (let i = 0; i < 70; i++) {
  const d = document.createElement('div'); d.className = 'petal';
  const s = 22 + R(i) * 34; d.style.width = s + 'px'; d.style.height = s * 0.7 + 'px';
  const c = [['#e9b7ad', '#c97f74'], ['#f2d4c8', '#d99a8d'], ['#c9d3b3', '#8a9a74'], ['#f5e1b8', '#d9b273']][i % 4];
  d.style.background = `linear-gradient(135deg, ${c[0]}, ${c[1]})`;
  $('petals').appendChild(d); PET.push({ d, s, amb: i < 14 });
}

// drops for the hook
const DROPS = [];
for (let i = 0; i < 5; i++) {
  const d = document.createElement('div'); d.className = 'drop'; $('drops').appendChild(d);
  const r = document.createElement('div'); r.className = 'ring'; $('drops').appendChild(r);
  DROPS.push({ d, r, x: 360 + i * 85 + R(i + 50) * 40, at: T.h2 + 0.05 + i * 0.28 });
}

// spiral
const SPI = ['b10','b13','b14','b15','b12','b31','b18','b25','b40','b47','b20','b44','b36','b22','b50','b16','b8','b37','b43','b23','b45','b9','b11','b38','b49','b29','b42','b6','b17','b39','b48','b21','b5','b41'];
const SP = SPI.map((n, i) => {
  const im = document.createElement('img'); im.className = 'st'; im.src = `botan/${n}.png`;
  const k = i + 1; const r = 66 * Math.sqrt(k); const th = k * 2.39996;
  const w = 210 - i * 2.6; im.style.width = w + 'px'; $('spiral').appendChild(im);
  return { im, r, th, w, rot: (R(i + 9) - 0.5) * 40 };
});

// herbarium plates
const PL = [['توليب', 'b31', '٠٧'], ['خزامى', 'b14', '١٢'], ['دوار الشمس', 'b13', '١٩'], ['ورد مجفف', 'b8', '٣٣']].map(([nm, src, no], i) => {
  const d = document.createElement('div'); d.className = 'plate';
  d.innerHTML = `<div class="no">رقم ${no}</div><img src="botan/${src}.png"><div class="nm rq">${nm}</div><div class="ul"></div>
    <div class="tape" style="left:-30px; top:40px; transform:rotate(-38deg)"></div><div class="tape" style="left:640px; top:900px; transform:rotate(-38deg)"></div>`;
  $('plates').appendChild(d); return { d, img: d.querySelector('img'), ul: d.querySelector('.ul') };
});

// uses vignettes
const VG = [
  { bg: '#a8b393', cap: 'للدفاتر والجورنال', capc: '#2f3d2c',
    obj: '<div class="abs" style="left:230px; top:560px; width:620px; height:860px; background:#3d4a35; border-radius:18px 34px 34px 18px; box-shadow:0 40px 70px rgba(30,40,25,.4)"></div><div class="abs" style="left:770px; top:560px; width:36px; height:860px; background:#b0645b"></div><div class="abs" style="left:230px; top:560px; width:40px; height:860px; background:rgba(0,0,0,.18); border-radius:18px 0 0 18px"></div>',
    st: [['b49', 290, 610, 240, -10], ['b24', 580, 680, 210, 8], ['b6', 360, 1010, 190, -4]] },
  { bg: '#ead2c8', cap: 'للهدايا', capc: '#7a3b35',
    obj: '<div class="abs" style="left:200px; top:720px; width:680px; height:600px; background:linear-gradient(160deg,#d2aa7c,#b98d5f); border-radius:10px; box-shadow:0 40px 70px rgba(90,55,35,.35)"></div><div class="abs" style="left:200px; top:660px; width:680px; height:110px; background:linear-gradient(160deg,#dbb689,#c49a6c); border-radius:10px; box-shadow:0 10px 20px rgba(90,55,35,.25)"></div><div class="abs" style="left:520px; top:660px; width:40px; height:660px; background:#f3ece0"></div>',
    st: [['b38', 370, 470, 340, -6], ['b32', 640, 900, 230, 12], ['b10', 240, 900, 270, -10]] },
  { bg: '#e8dcc6', cap: 'ولتغليف الطلبات', capc: '#2f3d2c',
    obj: '<div class="abs" style="left:150px; top:700px; width:780px; height:560px; background:linear-gradient(170deg,#c9a173,#b18657); border-radius:8px; box-shadow:0 40px 70px rgba(90,55,35,.35)"></div><div class="abs" style="left:150px; top:930px; width:780px; height:90px; background:rgba(243,236,224,.55)"></div><div class="abs rq" style="left:150px; top:1120px; width:780px; text-align:center; font-size:84px; color:#3a2a1c">شكرًا لطلبك</div>',
    st: [['b35', 620, 720, 280, 8], ['b9', 210, 740, 260, -10], ['b28', 470, 760, 150, 4]] },
];
VG.forEach((v, i) => {
  const d = document.createElement('div'); d.className = 'vg'; d.style.background = v.bg;
  d.innerHTML = v.obj + `<div class="cap rq" style="color:${v.capc}"><span style="display:inline-block">${v.cap}</span></div>`;
  v.ims = v.st.map(([n, x, y, w, r]) => { const im = document.createElement('img'); im.className = 'st'; im.src = `botan/${n}.png`; im.style.width = w + 'px'; d.appendChild(im); return { im, x, y, r }; });
  v.d = d; v.capEl = d.querySelector('.cap span'); $('s4').appendChild(d);
});

// wreath
const WR = ['b15','b14','b13','b10','b25','b18','b31','b12','b20','b44','b36','b16','b47','b22','b8','b40'].map((n, i) => {
  const im = document.createElement('img'); im.className = 'st'; im.src = `botan/${n}.png`; im.style.width = '190px'; $('wreath').appendChild(im); return im;
});

const place = (el, x, y, s, r, o) => { el.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`; if (o !== undefined) el.style.opacity = o; };

window.render = (t) => {
  for (const [id, a, b] of SC) $(id).style.display = t >= a && t < b ? 'block' : 'none';
  // global: light leak drift, flash at cuts
  $('leak').style.transform = `translate(${-500 + Math.sin(t * 0.35) * 380}px, ${-300 + Math.cos(t * 0.27) * 500}px)`;
  $('leak').style.opacity = 0.55 + 0.25 * Math.sin(t * 0.8);
  const fl = Math.max(0, ...CUT.map((c) => 1 - Math.abs(t - c) / 0.18));
  $('flash').style.opacity = Math.max(fl * 0.75, 1 - p(t, 0, 0.35), p(t, T.end_all - 0.5, T.end_all));

  // petals
  PET.forEach(({ d, s, amb }, i) => {
    let x, y, r, o = 0;
    if (amb) {
      const sp = 40 + R(i + 3) * 40; const ph = R(i + 7) * 2000;
      y = ((t * sp + ph) % 2100) - 100; x = (R(i + 1) * 1080 + Math.sin(t * 0.9 + i) * 60);
      r = t * 40 + i * 30; o = 0.65;
    } else {
      // sweep across at the nearest cut
      let best = null; for (const c of CUT) if (Math.abs(t - c) < 0.75) best = c;
      if (best !== null) {
        const k = p(t, best - 0.75, best + 0.75);
        const lane = R(i + 21); const delay = R(i + 33) * 0.35;
        const kk = Math.min(1, Math.max(0, (k - delay) / 0.65));
        x = 1250 - kk * 1600 + Math.sin(kk * 7 + i) * 80; y = lane * 2000 - 40 + Math.sin(kk * 5 + i) * 90;
        r = kk * 540 + i * 23; o = kk > 0 && kk < 1 ? 0.95 : 0;
      } else { x = -200; y = -200; r = 0; }
    }
    d.style.transform = `translate(${x}px,${y}px) rotate(${r}deg)`; d.style.opacity = o;
  });

  // S1
  if (t < CUT[0]) {
    const breathe = 1 + 0.015 * Math.sin(t * 2.2);
    const peel = eio(p(t, T.rev - 0.1, T.rev + 0.7));
    const settle = eo(p(t, T.rev + 0.7, T.rev + 1.6));
    const lift = peel * (1 - 0.55 * settle);
    const h = $('hero');
    h.style.transformOrigin = '0% 100%';
    h.style.transform = `translate(230px, ${640 - lift * 40}px) perspective(1600px) rotateX(${-lift * 22}deg) rotateY(${-lift * 26}deg) rotateZ(${lift * 6}deg) translateZ(${lift * 140}px) scale(${breathe * (0.92 + 0.08 * eo(p(t, 0, 1.2)))})`;
    h.style.filter = `drop-shadow(${lift * 40}px ${18 + lift * 60}px ${22 + lift * 30}px rgba(60,40,25,${0.28 + lift * 0.2})) brightness(${1 + lift * 0.06})`;
    // ghost backing: a faint die-cut silhouette left on the paper
    const g = $('ghost'); g.style.background = `url(botan/b19.png) center/contain no-repeat`; g.style.filter = 'brightness(0) blur(6px)'; g.style.opacity = 0.13 * peel;
    show('h1', t, T.h1, T.rev - 0.2); show('h2', t, T.h2, T.rev - 0.2); show('h3', t, T.h3, T.rev - 0.2);
    const sk = eb(p(t, T.rev + 0.15, T.rev + 0.65));
    $('rv').style.opacity = p(t, T.rev + 0.15, T.rev + 0.3); $('rv').style.transform = `scale(${1.8 - 0.8 * sk}) rotate(${-4 * sk}deg)`;
    $('rv').parentElement.style.top = '1380px';
    // water drops fall and splash on the bouquet top
    DROPS.forEach(({ d, r, x, at }) => {
      const k = p(t, at, at + 0.55); const hit = 690 + (x % 60);
      d.style.transform = `translate(${x}px, ${-60 + eio(k) * (hit + 60)}px)`; d.style.opacity = k > 0 && k < 1 ? 0.9 : 0;
      const rk = p(t, at + 0.55, at + 1.0); const rs = 20 + rk * 90;
      r.style.width = rs + 'px'; r.style.height = rs * 0.35 + 'px'; r.style.transform = `translate(${x + 13 - rs / 2}px, ${hit + 30 - rs * 0.17}px)`;
      r.style.opacity = rk > 0 ? 1 - rk : 0;
    });
  }

  // S2 phyllotaxis bloom
  if (t >= CUT[0] && t < CUT[1]) {
    const a = CUT[0]; const n = Math.round(46 * eo(p(t, a + 0.1, a + 1.4)));
    $('cnt').textContent = n.toLocaleString('ar-EG');
    show('cnt', t, a + 0.05); show('c1', t, a + 0.5); show('c2', t, a + 0.9);
    const spin = (t - a) * 0.12; const zoom = 1 + 0.06 * p(t, a, CUT[1]);
    SP.forEach(({ im, r, th, w, rot }, i) => {
      const k = eb(p(t, a + 0.15 + i * 0.045, a + 0.75 + i * 0.045));
      const ang = th + spin; const rr = r * zoom * (0.4 + 0.6 * eo(p(t, a + 0.15 + i * 0.045, a + 0.9 + i * 0.045)));
      const x = 540 + Math.cos(ang) * rr - w / 2; const y = 1200 + Math.sin(ang) * rr - w / 2;
      place(im, x, y, k, rot + (1 - k) * 90, p(t, a + 0.15 + i * 0.045, a + 0.3 + i * 0.045));
    });
  }

  // S3 herbarium plates (page turns)
  if (t >= CUT[1] && t < CUT[2]) {
    show('k0', t, CUT[1] + 0.05);
    const at = [T.kinds + 0.05, T.k2 - 0.25, T.k3 - 0.25, T.k4 - 0.25];
    PL.forEach(({ d, img, ul }, i) => {
      const k = eio(p(t, at[i], at[i] + 0.7));
      const next = i < 3 ? eio(p(t, at[i + 1], at[i + 1] + 0.7)) : 0;
      d.style.zIndex = 10 + i;
      const tilt = (i % 2 ? 1 : -1) * 2.5;
      d.style.transform = `perspective(2200px) translateY(${next * 30}px) rotateY(${(1 - k) * -105}deg) rotateZ(${tilt * k - next * tilt * 0.6}deg) scale(${1 - next * 0.04})`;
      d.style.opacity = k > 0.02 ? 1 : 0; d.style.filter = `brightness(${1 - next * 0.12})`;
      img.style.transform = `scale(${0.85 + 0.15 * eo(p(t, at[i] + 0.4, at[i] + 1.1))})`;
      ul.style.transform = `scaleX(${eo(p(t, at[i] + 0.7, at[i] + 1.2))})`;
    });
  }

  // S4 uses: circular ink reveals + stickers pressed on
  if (t >= CUT[2] && t < CUT[3]) {
    const at = [CUT[2], T.u1 - 0.2, T.u2 - 0.2];
    VG.forEach((v, i) => {
      const k = eio(p(t, at[i], at[i] + 0.7));
      v.d.style.display = t >= at[i] ? 'block' : 'none';
      v.d.style.clipPath = i === 0 ? 'none' : `circle(${k * 2300}px at ${i === 1 ? 900 : 180}px ${i === 1 ? 1700 : 300}px)`;
      v.d.style.zIndex = i;
      const ck = eo(p(t, at[i] + 0.2, at[i] + 0.8)); v.capEl.style.opacity = ck; v.capEl.style.transform = `translateY(${(1 - ck) * 40}px)`; v.capEl.style.filter = `blur(${(1 - ck) * 14}px)`;
      v.ims.forEach(({ im, x, y, r }, j) => {
        const s0 = at[i] + 0.5 + j * 0.3; const pk = eo(p(t, s0, s0 + 0.35));
        im.style.opacity = p(t, s0, s0 + 0.08);
        im.style.transform = `translate(${x}px,${y}px) rotate(${r + (1 - pk) * 12}deg) scale(${1.45 - 0.45 * pk})`;
        im.style.filter = `drop-shadow(0 ${18 + (1 - pk) * 70}px ${22 + (1 - pk) * 40}px rgba(60,40,25,${0.28 - (1 - pk) * 0.12}))`;
      });
    });
  }

  // S5 print: two sheets fan up, sheen, chips
  if (t >= CUT[3] && t < CUT[4]) {
    const a = CUT[3]; const k = eo(p(t, a, a + 1.0)); const f = eio(p(t, a + 0.6, a + 1.4));
    show('p1', t, a + 0.1); show('p2', t, a + 0.5);
    $('sh1').style.transform = `translate(${260 + f * 40}px, ${1950 - k * 1350}px) rotate(${4 * f}deg)`;
    $('sh2').style.transform = `translate(${260 - f * 90}px, ${1980 - k * 1350}px) rotate(${-8 * f}deg)`;
    $('sheen').style.transform = $('sh1').style.transform; $('sheen').style.backgroundPosition = `${100 - p(t, a + 1.2, a + 2.4) * 100}% 0`;
    [[90, 760], [700, 1000], [110, 1260]].forEach(([x, y], i) => {
      const ck = eb(p(t, a + 1.1 + i * 0.3, a + 1.5 + i * 0.3));
      place($('ch' + i), x, y + Math.sin(t * 2 + i) * 6, ck, (i - 1) * 4, p(t, a + 1.1 + i * 0.3, a + 1.2 + i * 0.3));
    });
  }

  // S6 wreath end card
  if (t >= CUT[4]) {
    const a = CUT[4];
    show('e1', t, a + 0.1); show('e2', t, T.store - 0.05); show('e3', t, T.store + 0.3);
    WR.forEach((im, i) => {
      const ang = -Math.PI / 2 + i * (2 * Math.PI / WR.length) + (t - a) * 0.05;
      const k = eb(p(t, a + 0.1 + i * 0.07, a + 0.6 + i * 0.07));
      const rr = 385 + (1 - eo(p(t, a + 0.1 + i * 0.07, a + 0.8 + i * 0.07))) * 300;
      place(im, 540 + Math.cos(ang) * rr - 95, 900 + Math.sin(ang) * rr - 95, k * (0.9 + 0.1 * Math.sin(t * 1.5 + i)), (R(i) - 0.5) * 30, p(t, a + 0.1 + i * 0.07, a + 0.2 + i * 0.07));
    });
    const q = eb(p(t, a + 0.9, a + 1.5));
    $('qr').style.transform = `scale(${q})`; $('qr').style.opacity = p(t, a + 0.9, a + 1.0);
  }
};
render(0);
</script>
