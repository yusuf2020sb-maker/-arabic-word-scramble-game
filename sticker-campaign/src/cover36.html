<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Mada:wght@900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1080px; height:1920px; overflow:clip; font-family:'Mada',sans-serif; color:#1d3557; }
  #stage { position:absolute; left:0; top:0; width:1080px; height:1920px; overflow:clip; background:#9fd3c7; }
  .grid { position:absolute; left:0; top:0; width:100%; height:100%; background-image:linear-gradient(rgba(29,53,87,.08) 2px, transparent 2px), linear-gradient(90deg, rgba(29,53,87,.08) 2px, transparent 2px); background-size:60px 60px; }
  .line { position:absolute; left:0; width:1080px; text-align:center; font-weight:900; line-height:1.2; white-space:nowrap; }
  .st { position:absolute; filter:drop-shadow(0 10px 12px rgba(29,53,87,.3)); }
  .belt { position:absolute; left:-40px; top:1350px; width:1160px; height:70px; background:#1d3557; border-radius:35px; }
  .belt::after { content:''; position:absolute; left:0; top:28px; width:100%; height:14px; background:repeating-linear-gradient(90deg, #ffb703 0 40px, transparent 40px 90px); }
  .mach { position:absolute; left:330px; top:790px; width:420px; height:460px; background:#f1faee; border:12px solid #1d3557; border-radius:32px; }
  .mach .mouth { position:absolute; left:50px; top:290px; width:296px; height:160px; background:#1d3557; border-radius:20px 20px 0 0; }
  .lamp { position:absolute; left:180px; top:120px; width:60px; height:60px; border-radius:50%; background:#e63946; border:7px solid #1d3557; }
  .gear { position:absolute; width:170px; height:170px; border-radius:50%; background:repeating-conic-gradient(#1d3557 0 15deg, transparent 15deg 30deg); }
  .gear::after { content:''; position:absolute; left:34px; top:34px; width:102px; height:102px; border-radius:50%; background:#ffb703; border:10px solid #1d3557; }
  .pill { position:absolute; left:210px; top:1600px; width:660px; padding:14px 0 24px; text-align:center; border-radius:80px; background:#e63946; color:#f1faee; border:8px solid #1d3557; font-size:58px; }
</style></head><body><div id="stage">
<div class="grid"></div>
<div class="line" style="top:220px; font-size:120px">كيف يتصنّع</div>
<div class="line" style="top:390px; font-size:160px; color:#e63946">الطابع؟</div>
<div class="gear" style="left:60px; top:620px"></div><div class="gear" style="left:850px; top:640px; width:130px; height:130px"></div>
<div class="mach"><div class="lamp"></div><div class="mouth"></div></div>
<img class="st" src="stamps/s26.png" style="left:150px; top:1030px; width:300px; transform:rotate(-6deg)">
<img class="st" src="stamps/s32.png" style="left:620px; top:1040px; width:290px; transform:rotate(5deg)">
<div class="belt"></div>
<div class="line" style="top:1460px; font-size:76px">٣٥ ستيكر طابع فنتج</div>
<div class="pill">متوفرة في متجر دُر</div>
</div></body></html>
